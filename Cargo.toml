[package]
name = "harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "High-performance, memory-safe AI agent harness"
license = "MIT"

[dependencies]
tokio = { version = "1.44", features = ["full"] }
rig-core = "0.31"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
glob = "0.3"
regex = "1.10"
tokio-stream = "0.1"
futures = "0.3"
schemars = "0.8"
reedline = "0.46"
dirs = "6.0.0"
http = "1.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.13"
