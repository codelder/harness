vent_channel, send_frontend_command, DeliveryMode,\n    EmitOutcome, FrontendCommand, FrontendCommandReceiver, FrontendCommandSender, FrontendEvent,\n    FrontendEventReceiver, FrontendEventSender, FrontendSessionSummary, FrontendTodoItem,\n    FrontendTodoStatus, HARNESS_VERSION, SESSION_START_TURN_ID,\n};\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","src","frontend","protocol.rs"],"content":"use std::sync::Arc;\nuse tokio::sync::{mpsc, Mutex};\n\n/// Default bounded channel capacity between the runtime and any frontend adapter.\npub const DEFAULT_FRONTEND_CHANNEL_CAPACITY: usize = 64;\n\n/// Reserved turn id for session-start snapshots and pre-turn metadata.\npub const SESSION_START_TURN_ID: u64 = 0;\n\n/// Current harness version\npub const HARNESS_VERSION: \u0026str = env!(\"CARGO_PKG_VERSION\");\n\n/// Typed commands sent from an adapter to the shared runtime.\npub type FrontendCommandSender = mpsc::Sender\u003cFrontendCommand\u003e;\npub type FrontendCommandReceiver = mpsc::Receiver\u003cFrontendCommand\u003e;\n\n/// Typed events emitted by the runtime to a frontend adapter.\npub type FrontendEventReceiver = mpsc::Receiver\u003cFrontendEvent\u003e;\n\n/// Owned session summary shared with adapters when a session ends.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct FrontendSessionSummary {\n    pub turns: u32,\n    pub message_count: u32,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum FrontendTodoStatus {\n    Pending,\n    InProgress,\n    Completed,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub struct FrontendTodoItem {\n    pub id: u32,\n    pub text: String,\n    pub status: FrontendTodoStatus,\n}\n\n/// Minimal user intent surface for v1 adapters.\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum FrontendCommand {\n    SubmitMessage(String),\n    Interrupt,\n    Exit,\n}\n\n/// Delivery class for runtime-to-frontend events.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum DeliveryMode {\n    MustDeliver,\n    BestEffort,\n}\n\n/// Runtime-to-frontend protocol.\n///\n/// Delivery policy:\n/// - must-deliver events use `send().await`\n/// - best-effort events use `try_send`\n/// - when a best-effort event hits a full bounded queue, the sender coalesces it\n///   into the latest reducer-visible value so adapters can flush it later\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum FrontendEvent {\n    SessionStarted {\n        provider: String,\n        model: String,\n        working_directory: String,\n        version: String,\n    },\n    UserMessageCommitted {\n        turn_id: u64,\n        text: String,\n    },\n    AssistantMessageDelta {\n        turn_id: u64,\n        delta: String,\n    },\n    AssistantMessageCompleted {\n        turn_id: u64,\n        text: String,\n    },\n    Thinking {\n        turn_id: u64,\n        text: String,\n    },\n    ToolCallStarted {\n        turn_id: u64,\n        call_id: String,\n        name: String,\n        args_preview: String,\n    },\n    ToolCallFinished {\n        turn_id: u64,\n        call_id: String,\n        name: String,\n        result_preview: String,\n        is_error: bool,\n    },\n    RetryScheduled {\n        turn_id: u64,\n        attempt: u32,\n        max_retries: u32,\n        delay_ms: u64,\n        reason: String,\n    },\n    Reminder {\n        turn_id: u64,\n        message: String,\n    },\n    TodoSnapshot {\n        turn_id: u64,\n        items: Vec\u003cFrontendTodoItem\u003e,\n    },\n    TokenUsage {\n        turn_id: u64,\n        input_tokens: u64,\n        output_tokens: u64,\n        total_tokens: u64,\n    },\n    Status {\n        message: String,\n    },\n    Error {\n        turn_id: u64,\n        message: String,\n    },\n    SessionEnded {\n        summary: FrontendSessionSummary,\n    },\n}\n\nimpl FrontendEvent {\n    pub fn delivery_mode(\u0026self) -\u003e DeliveryMode {\n        match self {\n            FrontendEvent::AssistantMessageDelta { .. }\n            | FrontendEvent::Thinking { .. }\n            | FrontendEvent::Status { .. }\n            | FrontendEvent::TokenUsage { .. } =\u003e DeliveryMode::BestEffort,\n            FrontendEvent::SessionStarted { .. }\n            | FrontendEvent::UserMessageCommitted { .. }\n            | FrontendEvent::AssistantMessageCompleted { .. }\n            | FrontendEvent::ToolCallStarted { .. }\n            | FrontendEvent::ToolCallFinished { .. }\n            | FrontendEvent::RetryScheduled { .. }\n            | FrontendEvent::Reminder { .. }\n            | FrontendEvent::TodoSnapshot { .. }\n            | FrontendEvent::Error { .. }\n            | FrontendEvent::SessionEnded { .. } =\u003e DeliveryMode::MustDeliver,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum EmitOutcome {\n    Delivered,\n    Coalesced,\n}\n\n#[derive(Debug, Default)]\nstruct BestEffortBacklog {\n    assistant_delta: Option\u003c(u64, String)\u003e,\n    thinking: Option\u003c(u64, String)\u003e,\n    status: Option\u003cString\u003e,\n    token_usage: Option\u003c(u64, u64, u64, u64)\u003e, // (turn_id, input, output, total)\n}\n\nimpl BestEffortBacklog {\n    fn push(\u0026mut self, event: FrontendEvent) {\n        match event {\n            FrontendEvent::AssistantMessageDelta { turn_id, delta } =\u003e {\n                self.assistant_delta = Some((turn_id, delta));\n            }\n            FrontendEvent::Thinking { turn_id, text } =\u003e {\n                self.thinking = Some((turn_id, text));\n            }\n            FrontendEvent::Status { message } =\u003e {\n                self.status = Some(message);\n            }\n            FrontendEvent::TokenUsage {\n                turn_id,\n                input_tokens,\n                output_tokens,\n                total_tokens,\n            } =\u003e {\n                self.token_usage = Some((turn_id, input_tokens, output_tokens, total_tokens));\n            }\n            _ =\u003e {}\n        }\n    }\n\n    fn pop_next(\u0026mut self) -\u003e Option\u003cFrontendEvent\u003e {\n        if let Some((turn_id, input, output, total)) = self.token_usage.take() {\n            return Some(FrontendEvent::TokenUsage {\n                turn_id,\n                input_tokens: input,\n                output_tokens: output,\n                total_tokens: total,\n            });\n        }\n\n        if let Some((turn_id, delta)) = self.assistant_delta.take() {\n            return Some(FrontendEvent::AssistantMessageDelta { turn_id, delta });\n        }\n\n        if let Some((turn_id, text)) = self.thinking.take() {\n            return Some(FrontendEvent::Thinking { turn_id, text });\n        }\n\n        self.status\n            .take()\n            .map(|message| FrontendEvent::Status { message })\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct FrontendEventSender {\n    tx: mpsc::Sender\u003cFrontendEvent\u003e,\n    backlog: Arc\u003cMutex\u003cBestEffortBacklog\u003e\u003e,\n}\n\nimpl FrontendEventSender {\n    pub fn new(tx: mpsc::Sender\u003cFrontendEvent\u003e) -\u003e Self {\n        Self {\n            tx,\n            backlog: Arc::new(Mutex::new(BestEffortBacklog::default())),\n        }\n    }\n\n    pub async fn emit(\n        \u0026self,\n        event: FrontendEvent,\n    ) -\u003e Result\u003cEmitOutcome, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        match event.delivery_mode() {\n            DeliveryMode::MustDeliver =\u003e {\n                self.tx.send(event).await?;\n                Ok(EmitOutcome::Delivered)\n            }\n            DeliveryMode::BestEffort =\u003e self.try_emit_best_effort(event).await,\n        }\n    }\n\n    async fn try_emit_best_effort(\n        \u0026self,\n        event: FrontendEvent,\n    ) -\u003e Result\u003cEmitOutcome, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        match self.tx.try_send(event) {\n            Ok(()) =\u003e Ok(EmitOutcome::Delivered),\n            Err(mpsc::error::TrySendError::Full(event)) =\u003e {\n                self.backlog.lock().await.push(event);\n                Ok(EmitOutcome::Coalesced)\n            }\n            Err(mpsc::error::TrySendError::Closed(event)) =\u003e Err(mpsc::error::SendError(event)),\n        }\n    }\n\n    pub async fn flush_best_effort(\u0026self) -\u003e Result\u003cusize, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        let mut flushed = 0;\n\n        loop {\n            let next_event = {\n                let mut backlog = self.backlog.lock().await;\n                backlog.pop_next()\n            };\n\n            let Some(event) = next_event else {\n                break;\n            };\n\n            match self.tx.try_send(event) {\n                Ok(()) =\u003e flushed += 1,\n                Err(mpsc::error::TrySendError::Full(event)) =\u003e {\n                    self.backlog.lock().await.push(event);\n                    break;\n                }\n                Err(mpsc::error::TrySendError::Closed(event)) =\u003e {\n                    return Err(mpsc::error::SendError(event));\n                }\n            }\n        }\n\n        Ok(flushed)\n    }\n}\n\n/// Commands are always sent with `send().await` so adapters backpressure user input\n/// instead of dropping it.\npub async fn send_frontend_command(\n    tx: \u0026FrontendCommandSender,\n    command: FrontendCommand,\n) -\u003e Result\u003c(), mpsc::error::SendError\u003cFrontendCommand\u003e\u003e {\n    tx.send(command).await\n}\n\npub fn frontend_command_channel(\n    capacity: usize,\n) -\u003e (FrontendCommandSender, FrontendCommandReceiver) {\n    mpsc::channel(capacity)\n}\n\npub fn frontend_event_channel(capacity: usize) -\u003e (FrontendEventSender, FrontendEventReceiver) {\n    let (tx, rx) = mpsc::channel(capacity);\n    (FrontendEventSender::new(tx), rx)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tokio::time::{timeout, Duration};\n\n    #[test]\n    fn command_and_event_types_are_constructible() {\n        let command = FrontendCommand::Interrupt;\n        assert!(matches!(command, FrontendCommand::Interrupt));\n\n        let started = FrontendEvent::ToolCallStarted {\n            turn_id: 7,\n            call_id: \"tool-1\".to_string(),\n            name: \"read\".to_string(),\n            args_preview: \"README.md\".to_string(),\n        };\n        assert!(matches!(started, FrontendEvent::ToolCallStarted { .. }));\n\n        let finished = FrontendEvent::ToolCallFinished {\n            turn_id: 7,\n            call_id: \"tool-1\".to_string(),\n            name: \"read\".to_string(),\n            result_preview: \"done\".to_string(),\n            is_error: false,\n        };\n        assert!(matches!(finished, FrontendEvent::ToolCallFinished { .. }));\n\n        let snapshot = FrontendEvent::TodoSnapshot {\n            turn_id: SESSION_START_TURN_ID,\n            items: vec![FrontendTodoItem {\n                id: 1,\n                text: \"Ship protocol\".to_string(),\n                status: FrontendTodoStatus::InProgress,\n            }],\n        };\n        assert!(matches!(snapshot, FrontendEvent::TodoSnapshot { .. }));\n    }\n\n    #[test]\n    fn protocol_module_is_cli_framework_agnostic() {\n        let source = include_str!(\"protocol.rs\");\n        let production_source = source.split(\"#[cfg(test)]\").next().unwrap_or(source);\n        let forbidden_terms = [\n            [\"rata\", \"tui\"].concat(),\n            [\"reed\", \"line\"].concat(),\n            [\"std\", \"out\"].concat(),\n            [\"std\", \"err\"].concat(),\n            \"crossterm\".to_string(),\n        ];\n\n        for forbidden in forbidden_terms {\n            assert!(!production_source.contains(\u0026forbidden));\n        }\n    }\n\n    #[test]\n    fn todo_snapshot_is_must_deliver() {\n        assert_eq!(\n            FrontendEvent::TodoSnapshot {\n                turn_id: SESSION_START_TURN_ID,\n                items: Vec::new(),\n            }\n            .delivery_mode(),\n            DeliveryMode::MustDeliver\n        );\n    }\n\n    #[tokio::test]\n    async fn best_effort_events_do_not_block_when_channel_is_full() {\n        let (sender, mut receiver) = frontend_event_channel(1);\n\n        sender\n            .emit(FrontendEvent::SessionStarted {\n                provider: \"anthropic\".to_string(),\n                model: \"claude\".to_string(),\n                working_directory: \"/test\".to_string(),\n                version: \"0.1.0\".to_string(),\n            })\n            .await\n            .expect(\"must-deliver event should fit\");\n\n        let result = timeout(\n            Duration::from_millis(50),\n            sender.emit(FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"busy\".to_string(),\n            }),\n        )\n        .await;\n\n        let outcome = result.expect(\"best-effort emit should not block\");\n        assert_eq!(outcome.expect(\"channel open\"), EmitOutcome::Coalesced);\n\n        let first = receiver.recv().await.expect(\"first event should be queued\");\n        assert!(matches!(first, FrontendEvent::SessionStarted { .. }));\n\n        let flushed = sender\n            .flush_best_effort()\n            .await\n            .expect(\"flush should succeed\");\n        assert_eq!(flushed, 1);\n\n        let second = receiver.recv().await.expect(\"coalesced event should flush\");\n        assert_eq!(\n            second,\n            FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"busy\".to_string(),\n            }\n        );\n    }\n}\n","traces":[{"line":134,"address":[],"length":0,"stats":{"Line":56}},{"line":135,"address":[],"length":0,"stats":{"Line":56}},{"line":139,"address":[],"length":0,"stats":{"Line":8}},{"line":149,"address":[],"length":0,"stats":{"Line":48}},{"line":169,"address":[],"length":0,"stats":{"Line":2}},{"line":170,"address":[],"len _channel, frontend_event_channel, send_frontend_command, FrontendCommand,\n    FrontendCommandReceiver, FrontendCommandSender, FrontendEvent, FrontendEventReceiver,\n    FrontendEventSender, FrontendSessionSummary, FrontendTodoItem, FrontendTodoStatus,\n    SESSION_START_TURN_ID,\n};\npub use llm::{create_parent_provider, create_provider, LlmProvider, ProviderType};\npub use session::{SessionRuntime, SessionRuntimeConfig, SessionRuntimeOutcome, SessionSummary};\npub use subagent::{SubagentConfig, SubagentError, SubagentTool, TaskArgs};\npub use tools::BashTool;\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","src","llm","mod.rs"],"content":"mod provider;\n\npub use provider::{create_parent_provider, create_provider, LlmProvider, ProviderType};\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","src","llm","provider.rs"],"content":"use crate::agent::TodoUsageHook;\nuse crate::error::ProviderError;\nuse crate::planning::TodoManager;\nuse crate::subagent::{SubagentConfig, SubagentTool};\nuse crate::tools::{BashTool, EditTool, GlobTool, GrepTool, ReadTool, TodoTool, WriteTool};\nuse rig::agent::{Agent, AgentBuilder, PromptRequest};\nuse rig::client::CompletionClient;\nuse rig::completion::{Chat, Message, PromptError};\nuse rig::providers::openai::responses_api::ResponsesCompletionModel;\nuse rig::providers::{anthropic, openai};\nuse std::sync::Arc;\nuse tokio::sync::Mutex;\n\n/// System prompt for the agent\nconst SYSTEM_PROMPT: \u0026str = r#\"You are an AI agent with access to tools for interacting with the system.\n\nAvailable tools:\n- bash: Execute shell commands\n- read: Read file contents\n- write: Create or overwrite files\n- edit: Perform precise string replacements in files\n- glob: Find files matching patterns\n- grep: Search file contents with regex\n- todo: Track progress on multi-step tasks\n\nUse these tools to interact with the system and accomplish tasks.\"#;\n\n/// System prompt for the parent agent (includes the task tool)\nconst PARENT_SYSTEM_PROMPT: \u0026str = r#\"You are an AI agent with access to tools for interacting with the system.\n\nAvailable tools:\n- bash: Execute shell commands\n- read: Read file contents\n- write: Create or overwrite files\n- edit: Perform precise string replacements in files\n- glob: Find files matching patterns\n- grep: Search file contents with regex\n- todo: Track progress on multi-step tasks\n- task: Spawn a subagent with fresh context to handle a subtask\n\nUse these tools to interact with the system and accomplish tasks. Use the task tool to delegate subtasks when parallel or isolated work is beneficial.\"#;\n\n/// Maximum number of tool-calling turns before returning to the user\nconst DEFAULT_MAX_TURNS: usize = 50;\n\n/// Maximum number of tool-calling turns for child agents (safety limit)\nconst CHILD_MAX_TURNS: usize = 30;\n\n/// Supported LLM provider types\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum ProviderType {\n    Anthropic,\n    Openai,\n    Ollama,\n}\n\nimpl std::fmt::Display for ProviderType {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            ProviderType::Anthropic =\u003e write!(f, \"anthropic\"),\n            ProviderType::Openai =\u003e write!(f, \"openai\"),\n            ProviderType::Ollama =\u003e write!(f, \"ollama\"),\n        }\n    }\n}\n\nimpl std::str::FromStr for ProviderType {\n    type Err = ProviderError;\n\n    fn from_str(s: \u0026str) -\u003e Result\u003cSelf, Self::Err\u003e {\n        match s.to_lowercase().as_str() {\n            \"anthropic\" =\u003e Ok(ProviderType::Anthropic),\n            \"openai\" =\u003e Ok(ProviderType::Openai),\n            \"ollama\" =\u003e Ok(ProviderType::Ollama),\n            _ =\u003e Err(ProviderError::UnknownProvider(s.to_string())),\n        }\n    }\n}\n\n/// Enum-based LLM provider supporting multiple backends\n///\n/// Uses enum dispatch instead of trait objects for:\n/// - Zero-cost abstraction (no vtable overhead)\n/// - Type-safe with compile-time exhaustiveness checking\n/// - All providers known at compile time\npub enum LlmProvider {\n    Anthropic(Agent\u003canthropic::completion::CompletionModel\u003e),\n    Openai(Agent\u003cResponsesCompletionModel\u003e),\n    // Ollama support will be added when rig-core supports it natively\n    // Currently using placeholder for future implementation\n    Ollama,\n}\n\nimpl LlmProvider {\n    /// Send a chat message with conversation history (rig Message type)\n    ///\n    /// # Arguments\n    /// * `prompt` - The prompt message to send\n    /// * `chat_history` - Previous conversation history as rig Messages\n    ///\n    /// # Returns\n    /// The LLM's response as a string\n    ///\n    /// # Errors\n    /// Returns PromptError if the request fails\n    pub async fn chat_with_history(\n        \u0026self,\n        prompt: impl Into\u003cString\u003e,\n        chat_history: Vec\u003cMessage\u003e,\n    ) -\u003e Result\u003cString, PromptError\u003e {\n        match self {\n            LlmProvider::Anthropic(agent) =\u003e agent.chat(prompt.into(), chat_history).await,\n            LlmProvider::Openai(agent) =\u003e agent.chat(prompt.into(), chat_history).await,\n            LlmProvider::Ollama =\u003e Err(PromptError::CompletionError(\n                rig::completion::CompletionError::ResponseError(\n                    \"Ollama provider not yet implemented\".to_string(),\n                ),\n            )),\n        }\n    }\n\n    /// Send a chat message with history and a hook for observing tool calls\n    ///\n    /// This method uses rig's PromptRequest API with hook support and\n    /// extended_details to capture token usage data.\n    ///\n    /// # Arguments\n    /// * `prompt` - The prompt message to send\n    /// * `chat_history` - Previous conversation history as rig Messages\n    /// * `hook` - Hook for observing tool calls and forwarding structured events\n    ///\n    /// # Returns\n    /// A tuple of (response text, optional token usage) from the LLM\n    ///\n    /// # Errors\n    /// Returns PromptError if the request fails\n    pub async fn chat_with_history_and_hook(\n        \u0026self,\n        prompt: impl Into\u003cString\u003e,\n        chat_history: Vec\u003cMessage\u003e,\n        hook: TodoUsageHook,\n    ) -\u003e Result\u003c(String, Option\u003crig::completion::Usage\u003e), PromptError\u003e {\n        match self {\n            LlmProvider::Anthropic(agent) =\u003e {\n                let response = PromptRequest::from_agent(agent, prompt.into())\n                    .with_history(\u0026mut chat_history.clone())\n                    .with_hook(hook)\n                    .extended_details()\n                    .await?;\n                Ok((response.output, Some(response.total_usage)))\n            }\n            LlmProvider::Openai(agent) =\u003e {\n                let response = PromptRequest::from_agent(agent, prompt.into())\n                    .with_history(\u0026mut chat_history.clone())\n                    .with_hook(hook)\n                    .extended_details()\n                    .await?;\n                Ok((response.output, Some(response.total_usage)))\n            }\n            LlmProvider::Ollama =\u003e Err(PromptError::CompletionError(\n                rig::completion::CompletionError::ResponseError(\n                    \"Ollama provider not yet implemented\".to_string(),\n                ),\n            )),\n        }\n    }\n}\n\n/// Create an LLM provider based on provider type and model\n///\n/// # Arguments\n/// * `provider_type` - The provider type (Anthropic, Openai, Ollama)\n/// * `model` - The model identifier (provider-specific)\n/// * `base_url` - Optional custom base URL (for proxies or custom endpoints)\n/// * `thinking` - Enable extended thinking/reasoning (Anthropic only)\n/// * `thinking_budget` - Budget tokens for extended thinking\n/// * `todo_manager` - Shared TodoManager for the todo tool\n///\n/// # Returns\n/// An LlmProvider enum variant that can be used to interact with the LLM\n///\n/// # Errors\n/// Returns ProviderError if the provider is unknown or API key is missing\npub fn create_provider(\n    provider_type: ProviderType,\n    model: \u0026str,\n    base_url: Option\u003c\u0026str\u003e,\n    thinking: bool,\n    thinking_budget: u64,\n    todo_manager: Arc\u003cMutex\u003cTodoManager\u003e\u003e,\n) -\u003e Result\u003cLlmProvider, ProviderError\u003e {\n    match provider_type {\n        ProviderType::Anthropic =\u003e {\n            // Check for API key before calling builder\n            let api_key = std::env::var(\"HARNESS_ANTHROPIC_KEY\")\n                .map_err(|_| ProviderError::MissingApiKey(\"anthropic\".to_string()))?;\n\n            let mut builder = anthropic::Client::builder().api_key(api_key);\n\n            // Check for base URL: CLI arg \u003e HARNESS_ANTHROPIC_URL env\n            if let Some(url) = base_url {\n                builder = builder.base_url(url);\n            } else if let Ok(env_url) = std::env::var(\"HARNESS_ANTHROPIC_URL\") {\n                builder = builder.base_url(\u0026env_url);\n            }\n\n            let client = builder.build().map_err(|e| {\n                ProviderError::RequestFailed(format!(\"Failed to build client: {}\", e))\n            })?;\n\n            // Create completion model\n            let completion_model = client.completion_model(model);\n\n            // Create TodoTool with shared TodoManager\n            let todo_tool = TodoTool::new(todo_manager.clone());\n\n            // Build agent with tools using AgentBuilder\n            // Note: max_tokens is required for Anthropic API\n            let mut agent_builder = AgentBuilder::new(completion_model)\n                .preamble(SYSTEM_PROMPT)\n                .tool(BashTool)\n                .tool(ReadTool)\n                .tool(WriteTool)\n                .tool(EditTool)\n                .tool(GlobTool)\n                .tool(GrepTool)\n                .tool(todo_tool)\n                .default_max_turns(DEFAULT_MAX_TURNS)\n                .max_tokens(4096);\n\n            // Enable extended thinking if requested\n            if thinking {\n                let thinking_config = serde_json::json!({\n                    \"thinking\": {\n                        \"type\": \"enabled\",\n                        \"budget_tokens\": thinking_budget\n                    }\n                });\n                agent_builder = agent_builder.additional_params(thinking_config);\n            }\n\n            let agent = agent_builder.build();\n\n            Ok(LlmProvider::Anthropic(agent))\n        }\n        ProviderType::Openai =\u003e {\n            // Check for API key before calling builder\n            let api_key = std::env::var(\"HARNESS_OPENAI_KEY\")\n                .map_err(|_| ProviderError::MissingApiKey(\"openai\".to_string()))?;\n\n            let mut builder = openai::Client::builder().api_key(api_key);\n\n            // Check for base URL: CLI arg \u003e HARNESS_OPENAI_URL env\n            if let Some(url) = base_url {\n                builder = builder.base_url(url);\n            } else if let Ok(env_url) = std::env::var(\"HARNESS_OPENAI_URL\") {\n                builder = builder.base_url(\u0026env_url);\n            }\n\n            let client = builder.build().map_err(|e| {\n                ProviderError::RequestFailed(format!(\"Failed to build client: {}\", e))\n            })?;\n\n            // Create completion model using Responses API (default for openai::Client)\n            let completion_model = client.completion_model(model);\n\n            // Create TodoTool with shared TodoManager\n            let todo_tool = TodoTool::new(todo_manager.clone());\n\n            // Build agent with tools using AgentBuilder\n            let agent = AgentBuilder::new(completion_model)\n                .preamble(SYSTEM_PROMPT)\n                .tool(BashTool)\n                .tool(ReadTool)\n                .tool(WriteTool)\n                .tool(EditTool)\n                .tool(GlobTool)\n                .tool(GrepTool)\n                .tool(todo_tool)\n                .default_max_turns(DEFAULT_MAX_TURNS)\n                .build();\n\n            Ok(LlmProvider::Openai(agent))\n        }\n        ProviderType::Ollama =\u003e {\n            // Ollama support pending - rig-core 0.31 doesn't have native Ollama client\n            // Will be implemented when rig-core adds Ollama support\n            Ok(LlmProvider::Ollama)\n        }\n    }\n}\n\n/// Create an LLM provider with subagent capability (8 tools: 7 base + task).\n///\n/// This is used by the parent agent so it can delegate subtasks to child agents.\n/// Child agents created by SubagentTool use the regular create_provider() (7 tools, no task).\npub fn create_parent_provider(\n    provider_type: ProviderType,\n    model: \u0026str,\n    base_url: Option\u003c\u0026str\u003e,\n    thinking: bool,\n    thinking_budget: u64,\n    todo_manager: Arc\u003cMutex\u003cTodoManager\u003e\u003e,\n) -\u003e Result\u003cLlmProvider, ProviderError\u003e {\n    // Build SubagentConfig from the same parameters\n    let subagent_config = SubagentConfig {\n        provider_type,\n        model: model.to_string(),\n        base_url: base_url.map(|s| s.to_string()),\n        thinking,\n        thinking_budget,\n        max_turns: CHILD_MAX_TURNS,\n    };\n    let subagent_tool = SubagentTool::new(subagent_config);\n\n    match provider_type {\n        ProviderType::Anthropic =\u003e {\n            let api_key = std::env::var(\"HARNESS_ANTHROPIC_KEY\")\n                .map_err(|_| ProviderError::MissingApiKey(\"anthropic\".to_string()))?;\n\n            let mut builder = anthropic::Client::builder().api_key(api_key);\n\n            if let Some(url) = base_url {\n                builder = builder.base_url(url);\n            } else if let Ok(env_url) = std::env::var(\"HARNESS_ANTHROPIC_URL\") {\n                builder = builder.base_url(\u0026env_url);\n            }\n\n            let client = builder.build().map_err(|e| {\n                ProviderError::RequestFailed(format!(\"Failed to build client: {}\", e))\n            })?;\n\n            let completion_model = client.completion_model(model);\n            let todo_tool = TodoTool::new(todo_manager.clone());\n\n            let mut agent_builder = AgentBuilder::new(completion_model)\n                .preamble(PARENT_SYSTEM_PROMPT)\n                .tool(BashTool)\n                .tool(ReadTool)\n                .tool(WriteTool)\n                .tool(EditTool)\n                .tool(GlobTool)\n                .tool(GrepTool)\n                .tool(todo_tool)\n                .tool(subagent_tool)\n                .default_max_turns(DEFAULT_MAX_TURNS)\n                .max_tokens(4096);\n\n            if thinking {\n                let thinking_config = serde_json::json!({\n                    \"thinking\": {\n                        \"type\": \"enabled\",\n                        \"budget_tokens\": thinking_budget\n                    }\n                });\n                agent_builder = agent_builder.additional_params(thinking_config);\n            }\n\n            Ok(LlmProvider::Anthropic(agent_builder.build()))\n        }\n        ProviderType::Openai =\u003e {\n            let api_key = std::env::var(\"HARNESS_OPENAI_KEY\")\n                .map_err(|_| ProviderError::MissingApiKey(\"openai\".to_string()))?;\n\n            let mut builder = openai::Client::builder().api_key(api_key);\n\n            if let Some(url) = base_url {\n                builder = builder.base_url(url);\n            } else if let Ok(env_url) = std::env::var(\"HARNESS_OPENAI_URL\") {\n                builder = builder.base_url(\u0026env_url);\n            }\n\n            let client = builder.build().map_err(|e| {\n                ProviderError::RequestFailed(format!(\"Failed to build client: {}\", e))\n            })?;\n\n            let completion_model = client.completion_model(model);\n            let todo_tool = TodoTool::new(todo_manager.clone());\n\n            let agent = AgentBuilder::new(completion_model)\n                .preamble(PARENT_SYSTEM_PROMPT)\n                .tool(BashTool)\n                .tool(ReadTool)\n                .tool(WriteTool)\n                .tool(EditTool)\n                .tool(GlobTool)\n                .tool(GrepTool)\n                .tool(todo_tool)\n                .tool(subagent_tool)\n                .default_max_turns(DEFAULT_MAX_TURNS)\n                .build();\n\n            Ok(LlmProvider::Openai(agent))\n        }\n        ProviderType::Ollama =\u003e Ok(LlmProvider::Ollama),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::planning::TodoManager;\n\n    #[test]\n    fn test_provider_type_display() {\n        assert_eq!(ProviderType::Anthropic.to_string(), \"anthropic\");\n        assert_eq!(ProviderType::Openai.to_string(), \"openai\");\n        assert_eq!(ProviderType::Ollama.to_string(), \"ollama\");\n    }\n\n    #[test]\n    fn test_provider_type_from_str() {\n        assert_eq!(\n            \"anthropic\".parse::\u003cProviderType\u003e().unwrap(),\n            ProviderType::Anthropic\n        );\n        assert_eq!(\n            \"openai\".parse::\u003cProviderType\u003e().unwrap(),\n            ProviderType::Openai\n        );\n        assert_eq!(\n            \"ollama\".parse::\u003cProviderType\u003e().unwrap(),\n            ProviderType::Ollama\n        );\n        assert_eq!(\n            \"ANTHROPIC\".parse::\u003cProviderType\u003e().unwrap(),\n            ProviderType::Anthropic\n        );\n    }\n\n    #[test]\n    fn test_unknown_provider() {\n        let result: Result\u003cProviderType, _\u003e = \"unknown\".parse();\n        assert!(result.is_err());\n        matches!(result.unwrap_err(), ProviderError::UnknownProvider(_));\n    }\n\n    #[tokio::test]\n    async fn test_create_anthropic_provider_with_custom_model() {\n        // Test that create_provider works with non-standard model names\n        // This verifies max_tokens is set correctly (not dependent on model name)\n        use std::env;\n\n        // Save original API key\n        let original_key = env::var(\"HARNESS_ANTHROPIC_KEY\");\n\n        // Set a dummy API key for testing\n        env::set_var(\"HARNESS_ANTHROPIC_KEY\", \"test-key-12345\");\n\n        // Create a fresh TodoManager for the test\n        let todo_manager = Arc::new(Mutex::new(TodoManager::new()));\n\n        // Test with a custom model name (not standard Claude model)\n        let result = create_provider(\n            ProviderType::Anthropic,\n            \"custom-model-name\",\n            None,\n            false,\n            10000,\n            todo_manager,\n        );\n\n        // Restore original API key\n        match original_key {\n            Ok(val) =\u003e env::set_var(\"HARNESS_ANTHROPIC_KEY\", val),\n            Err(_) =\u003e env::remove_var(\"HARNESS_ANTHROPIC_KEY\"),\n        }\n\n        // Provider creation should succeed (max_tokens is set to 4096)\n        assert!(\n            result.is_ok(),\n            \"Provider creation should succeed with custom model name\"\n        );\n    }\n}\n","traces":[{"line":58,"address":[],"length":0,"stats":{"Line":9}},{"line":59,"address":[],"length":0,"stats":{"Line":9}},{"line":60,"address":[],"length":0,"stats":{"Line":6}},{"line":61,"address":[],"length":0,"stats":{"Line":6}},{"line":62,"address":[],"length":0,"stats":{"Line":6}},{"line":70,"address":[],"length":0,"stats":{"Line":19}},{"line":71,"address":[],"length":0,"stats":{"Line":19}},{"line":72,"address":[],"length":0,"stats":{"Line":25}},{"line":73,"address":[],"length":0,"stats":{"Line":18}},{"line":74,"address":[],"length":0,"stats":{"Line":13}},{"line":75,"address":[],"length":0,"stats":{"Line":3}},{"line":106," \n\n    // Setup tracing with verbosity level\n    // Guards must be kept alive for the duration of the program\n    let _guards = setup_tracing(args.tracing_level());\n\n    tracing::info!(\"Starting Agent Harness v0.1.0\");\n    tracing::info!(\"Log file: {}/harness.log\", get_log_dir().display());\n    tracing::debug!(\n        \"Provider: {:?}, Model: {}, Verbose: {}\",\n        args.provider,\n        args.model,\n        args.verbose\n    );\n\n    // Convert CLI Provider to LLM ProviderType\n    let provider_type = match args.provider {\n        Provider::Anthropic =\u003e ProviderType::Anthropic,\n        Provider::Openai =\u003e ProviderType::Openai,\n        Provider::Ollama =\u003e ProviderType::Ollama,\n    };\n\n    // Use default model if user specified a different provider but not model\n    let model =\n        if args.model == \"claude-3-5-sonnet-20241022\" \u0026\u0026 args.provider != Provider::Anthropic {\n            tracing::info!(\"Using default model for {:?}\", args.provider);\n            Args::default_model(args.provider)\n        } else {\n            \u0026args.model\n        };\n\n    // Create and run session\n    let mut session = Session::new();\n\n    if let Err(e) = session\n        .run(\n            provider_type,\n            model,\n            args.base_url.as_deref(),\n            args.thinking,\n            args.thinking_budget,\n        )\n        .await\n    {\n        tracing::error!(\"Session error: {}\", e);\n        eprintln!(\"Error: {}\", e);\n        std::process::exit(1);\n    }\n\n    Ok(())\n}\n","traces":[{"line":8,"address":[],"length":0,"stats":{"Line":0}},{"line":9,"address":[],"length":0,"stats":{"Line":0}},{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"address":[],"length":0,"stats":{"Line":0}},{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":21,"address":[],"length alidStatus(String),\n    #[error(\"Item #{0}: text is required\")]\n    MissingText(u32),\n    #[error(\"Invalid item ID: {0} (must be 1-20)\")]\n    InvalidId(u32),\n    #[error(\"Duplicate item ID: {0}\")]\n    DuplicateId(u32),\n}\n\n/// Manager for todo items with constraint validation\n#[derive(Debug, Clone, Default)]\npub struct TodoManager {\n    items: Vec\u003cTodoItem\u003e,\n}\n\nimpl TodoManager {\n    /// Create a new empty TodoManager\n    pub fn new() -\u003e Self {\n        Self { items: Vec::new() }\n    }\n\n    /// Check if the manager has no items\n    pub fn is_empty(\u0026self) -\u003e bool {\n        self.items.is_empty()\n    }\n\n    /// Return a clone of the current todo state for typed frontend snapshots.\n    pub fn snapshot(\u0026self) -\u003e Vec\u003cTodoItem\u003e {\n        self.items.clone()\n    }\n\n    /// Update the todo list with new items\n    /// Validates constraints:\n    /// - Max 20 items\n    /// - Only one in_progress at a time\n    pub fn update(\u0026mut self, items: Vec\u003cTodoItem\u003e) -\u003e Result\u003cString, TodoError\u003e {\n        // Validate max 20 items\n        if items.len() \u003e MAX_ITEMS {\n            return Err(TodoError::TooManyItems(items.len()));\n        }\n\n        // Validate text is not empty\n        for item in \u0026items {\n            if item.text.trim().is_empty() {\n                return Err(TodoError::MissingText(item.id));\n            }\n        }\n\n        // Validate only one in_progress\n        let in_progress_count = items\n            .iter()\n            .filter(|i| i.status == TodoStatus::InProgress)\n            .count();\n        if in_progress_count \u003e 1 {\n            return Err(TodoError::MultipleInProgress(in_progress_count));\n        }\n\n        self.items = items;\n        Ok(self.render())\n    }\n\n    /// Render todos as formatted string\n    /// Format:\n    /// [ ] #1: Task description\n    /// [\u003e] #2: In progress task\n    /// [x] #3: Completed task\n    ///\n    /// (done/total)\n    pub fn render(\u0026self) -\u003e String {\n        if self.items.is_empty() {\n            return \"No todos.\".to_string();\n        }\n\n        let mut lines: Vec\u003cString\u003e = self\n            .items\n            .iter()\n            .map(|item| {\n                let marker = match item.status {\n                    TodoStatus::Pending =\u003e \"[ ]\",\n                    TodoStatus::InProgress =\u003e \"[\u003e]\",\n                    TodoStatus::Completed =\u003e \"[x]\",\n                };\n                format!(\"{} #{}: {}\", marker, item.id, item.text)\n            })\n            .collect();\n\n        let done = self\n            .items\n            .iter()\n            .filter(|i| i.status == TodoStatus::Completed)\n            .count();\n        lines.push(format!(\"\\n({}/{})\", done, self.items.len()));\n\n        lines.join(\"\\n\")\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_todo_manager_new() {\n        let manager = TodoManager::new();\n        assert!(manager.is_empty());\n        assert_eq!(manager.render(), \"No todos.\");\n    }\n\n    #[test]\n    fn test_todo_manager_update_valid_items() {\n        let mut manager = TodoManager::new();\n        let items = vec![\n            TodoItem::new(1, \"First task\".to_string(), TodoStatus::Pending),\n            TodoItem::new(2, \"Second task\".to_string(), TodoStatus::InProgress),\n        ];\n\n        let result = manager.update(items).unwrap();\n        assert!(result.contains(\"[ ] #1: First task\"));\n        assert!(result.contains(\"[\u003e] #2: Second task\"));\n        assert!(result.contains(\"(0/2)\"));\n    }\n\n    #[test]\n    fn test_todo_manager_update_too_many_items() {\n        let mut manager = TodoManager::new();\n        let items: Vec\u003cTodoItem\u003e = (1..=21)\n            .map(|i| TodoItem::new(i, format!(\"Task {}\", i), TodoStatus::Pending))\n            .collect();\n\n        let result = manager.update(items);\n        assert!(matches!(result, Err(TodoError::TooManyItems(21))));\n    }\n\n    #[test]\n    fn test_todo_manager_update_multiple_in_progress() {\n        let mut manager = TodoManager::new();\n        let items = vec![\n            TodoItem::new(1, \"Task 1\".to_string(), TodoStatus::InProgress),\n            TodoItem::new(2, \"Task 2\".to_string(), TodoStatus::InProgress),\n            TodoItem::new(3, \"Task 3\".to_string(), TodoStatus::Pending),\n        ];\n\n        let result = manager.update(items);\n        assert!(matches!(result, Err(TodoError::MultipleInProgress(2))));\n    }\n\n    #[test]\n    fn test_todo_manager_render_markers() {\n        let mut manager = TodoManager::new();\n        let items = vec![\n            TodoItem::new(1, \"Pending task\".to_string(), TodoStatus::Pending),\n            TodoItem::new(2, \"In progress task\".to_string(), TodoStatus::InProgress),\n            TodoItem::new(3, \"Completed task\".to_string(), TodoStatus::Completed),\n        ];\n\n        let result = manager.update(items).unwrap();\n        assert!(result.contains(\"[ ] #1: Pending task\"));\n        assert!(result.contains(\"[\u003e] #2: In progress task\"));\n        assert!(result.contains(\"[x] #3: Completed task\"));\n    }\n\n    #[test]\n    fn test_todo_manager_render_progress_count() {\n        let mut manager = TodoManager::new();\n        let items = vec![\n            TodoItem::new(1, \"Task 1\".to_string(), TodoStatus::Completed),\n            TodoItem::new(2, \"Task 2\".to_string(), TodoStatus::Completed),\n            TodoItem::new(3, \"Task 3\".to_string(), TodoStatus::Pending),\n        ];\n\n        let result = manager.update(items).unwrap();\n        assert!(result.contains(\"(2/3)\"));\n    }\n\n    #[test]\n    fn runtime_snapshot_returns_cloned_items() {\n        let mut manager = TodoManager::new();\n        manager\n            .update(vec![TodoItem::new(\n                1,\n                \"Keep runtime snapshots typed\".to_string(),\n                TodoStatus::InProgress,\n            )])\n            .unwrap();\n\n        let mut snapshot = manager.snapshot();\n        snapshot[0].text = \"Mutated copy\".to_string();\n        snapshot.push(TodoItem::new(\n            2,\n            \"Local only\".to_string(),\n            TodoStatus::Pending,\n        ));\n\n        assert_eq!(\n            manager.snapshot(),\n            vec![TodoItem::new(\n                1,\n                \"Keep runtime snapshots typed\".to_string(),\n                TodoStatus::InProgress,\n            )]\n        );\n    }\n\n    #[test]\n    fn test_todo_status_from_str_valid() {\n        assert_eq!(\"pending\".parse::\u003cTodoStatus\u003e(), Ok(TodoStatus::Pending));\n        assert_eq!(\"PENDING\".parse::\u003cTodoStatus\u003e(), Ok(TodoStatus::Pending));\n        assert_eq!(\n            \"in_progress\".parse::\u003cTodoStatus\u003e(),\n            Ok(TodoStatus::InProgress)\n        );\n        assert_eq!(\n            \"IN_PROGRESS\".parse::\u003cTodoStatus\u003e(),\n            Ok(TodoStatus::InProgress)\n        );\n        assert_eq!(\n            \"in-progress\".parse::\u003cTodoStatus\u003e(),\n            Ok(TodoStatus::InProgress)\n        );\n        assert_eq!(\"completed\".parse::\u003cTodoStatus\u003e(), Ok(TodoStatus::Completed));\n        assert_eq!(\"COMPLETED\".parse::\u003cTodoStatus\u003e(), Ok(TodoStatus::Completed));\n    }\n\n    #[test]\n    fn test_todo_status_from_str_invalid() {\n        let result = \"invalid\".parse::\u003cTodoStatus\u003e();\n        assert!(matches!(result, Err(TodoError::InvalidStatus(_))));\n\n        let result = \"done\".parse::\u003cTodoStatus\u003e();\n        assert!(matches!(result, Err(TodoError::InvalidStatus(_))));\n    }\n\n    #[test]\n    fn test_todo_manager_empty_text() {\n        let mut manager = TodoManager::new();\n        let items = vec![TodoItem::new(1, \"\".to_string(), TodoStatus::Pending)];\n\n        let result = manager.update(items);\n        assert!(matches!(result, Err(TodoError::MissingText(1))));\n    }\n}\n","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":9}},{"line":22,"address":[],"length":0,"stats":{"Line":9}},{"line":23,"address":[],"length":0,"stats":{"Line":11}},{"line":24,"address":[],"length":0,"stats":{"Line":15}},{"line":25,"address":[],"length":0,"stats":{"Line":6}},{"line":26,"address":[],"length":0,"stats":{"Line":2}},{"line":41,"address":[],"length":0,"stats":{"Line":38}},{"line":71,"address":[],"length":0,"stats":{"Line":40}},{"line":72,"address":[],"length":0,"stats":{"Line":40}},{"line":76,"address":[],"length":0,"stats":{"Line":4}},{"line":77,"address":[],"length":0,"stats":{"Line":8}},{"line":81,"address":[],"length":0,"stats":{"Line":22}},{"line":82,"address":[],"length":0,"stats":{"Line":44}},{"line":89,"address":[],"length":0,"stats":{"Line":13}},{"line":91,"address":[],"length":0,"stats":{"Line":13}},{"line":92,"address":[],"length":0,"stats":{"Line":2}},{"line":96,"address":[],"length":0,"stats":{"Line":31}},{"line":97,"address":[],"length":0,"stats":{"Line":40}},{"line":98,"address":[],"length":0,"stats":{"Line":1}},{"line":103,"address":[],"length":0,"stats":{"Line":20}},{"line":105,"address":[],"length":0,"stats":{"Line":48}},{"line":107,"address":[],"length":0,"stats":{"Line":10}},{"line":108,"address":[],"length":0,"stats":{"Line":2}},{"line":111,"address":[],"length":0,"stats":{"Line":16}},{"line":112,"address":[],"length":0,"stats":{"Line":8}},{"line":122,"address":[],"length":0,"stats":{"Line":9}},{"line":123,"address":[],"length":0,"stats":{"Line":18}},{"line":124,"address":[],"length":0,"stats":{"Line":2}},{"line":127,"address":[],"length":0,"stats":{"Line":24}},{"line":128,"address":[],"length":0,"stats":{"Line":8}},{"line":130,"address":[],"length":0,"stats":{"Line":22}},{"line":131,"address":[],"length":0,"stats":{"Line":28}},{"line":132,"address":[],"length":0,"stats":{"Line":6}},{"line":133," ProviderType,\n    pub model: String,\n    pub base_url: Option\u003cString\u003e,\n    pub thinking: bool,\n    pub thinking_budget: u64,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum SessionRuntimeOutcome {\n    Continue,\n    Interrupted,\n    Exit(FrontendSessionSummary),\n}\n\n/// Headless runtime that owns conversation state independently of any UI.\npub struct SessionRuntime {\n    messages: Vec\u003cMessage\u003e,\n    turn_count: u32,\n    todo_manager: Arc\u003cMutex\u003cTodoManager\u003e\u003e,\n    rounds_since_todo: u32,\n    provider: Option\u003cLlmProvider\u003e,\n}\n\nimpl SessionRuntime {\n    pub fn new() -\u003e Self {\n        Self {\n            messages: vec![Message::system(SYSTEM_PROMPT)],\n            turn_count: 0,\n            todo_manager: Arc::new(Mutex::new(TodoManager::new())),\n            rounds_since_todo: 0,\n            provider: None,\n        }\n    }\n\n    pub fn messages(\u0026self) -\u003e \u0026[Message] {\n        \u0026self.messages\n    }\n\n    pub fn turn_count(\u0026self) -\u003e u32 {\n        self.turn_count\n    }\n\n    pub fn rounds_since_todo(\u0026self) -\u003e u32 {\n        self.rounds_since_todo\n    }\n\n    pub fn message_count(\u0026self) -\u003e u32 {\n        self.messages.len() as u32\n    }\n\n    pub fn todo_manager(\u0026self) -\u003e Arc\u003cMutex\u003cTodoManager\u003e\u003e {\n        self.todo_manager.clone()\n    }\n\n    pub fn summary(\u0026self) -\u003e SessionSummary {\n        SessionSummary {\n            turns: self.turn_count,\n            messages: self.messages.len(),\n        }\n    }\n\n    pub async fn start(\n        \u0026mut self,\n        config: SessionRuntimeConfig,\n        event_tx: \u0026FrontendEventSender,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        let provider = match create_parent_provider(\n            config.provider_type,\n            \u0026config.model,\n            config.base_url.as_deref(),\n            config.thinking,\n            config.thinking_budget,\n            self.todo_manager(),\n        ) {\n            Ok(provider) =\u003e provider,\n            Err(error) =\u003e {\n                let _ = self\n                    .emit_event(\n                        event_tx,\n                        FrontendEvent::Error {\n                            turn_id: SESSION_START_TURN_ID,\n                            message: error.to_string(),\n                        },\n                    )\n                    .await;\n                return Err(error.into());\n            }\n        };\n\n        self.start_with_provider(\n            provider,\n            config.provider_type.to_string(),\n            config.model,\n            event_tx,\n        )\n        .await\n    }\n\n    pub async fn start_with_provider(\n        \u0026mut self,\n        provider: LlmProvider,\n        provider_name: impl Into\u003cString\u003e,\n        model: impl Into\u003cString\u003e,\n        event_tx: \u0026FrontendEventSender,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        self.provider = Some(provider);\n        let working_directory = std::env::current_dir()\n            .map(|p| p.to_string_lossy().to_string())\n            .unwrap_or_else(|_| \".\".to_string());\n        self.emit_event(\n            event_tx,\n            FrontendEvent::SessionStarted {\n                provider: provider_name.into(),\n                model: model.into(),\n                working_directory,\n                version: HARNESS_VERSION.to_string(),\n            },\n        )\n        .await?;\n        self.emit_todo_snapshot(event_tx, SESSION_START_TURN_ID)\n            .await\n    }\n\n    pub async fn handle_command(\n        \u0026mut self,\n        command: FrontendCommand,\n        event_tx: \u0026FrontendEventSender,\n    ) -\u003e Result\u003cSessionRuntimeOutcome, AgentError\u003e {\n        match command {\n            FrontendCommand::SubmitMessage(text) =\u003e {\n                let error_turn_id = self.active_turn_id();\n                if let Err(error) = self.submit_message(text, event_tx).await {\n                    self.emit_event(\n                        event_tx,\n                        FrontendEvent::Error {\n                            turn_id: error_turn_id,\n                            message: error.to_string(),\n                        },\n                    )\n                    .await?;\n                }\n                Ok(SessionRuntimeOutcome::Continue)\n            }\n            FrontendCommand::Interrupt =\u003e {\n                self.emit_event(\n                    event_tx,\n                    FrontendEvent::Status {\n                        message: \"Interrupt requested but not yet implemented\".to_string(),\n                    },\n                )\n                .await?;\n                Ok(SessionRuntimeOutcome::Interrupted)\n            }\n            FrontendCommand::Exit =\u003e Ok(SessionRuntimeOutcome::Exit(self.end(event_tx).await?)),\n        }\n    }\n\n    pub async fn submit_message(\n        \u0026mut self,\n        current_input: impl Into\u003cString\u003e,\n        event_tx: \u0026FrontendEventSender,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        self.submit_message_with(\n            current_input.into(),\n            event_tx,\n            |history, current_input, provider, hook| {\n                Box::pin(agent_loop(history, current_input, provider, hook))\n            },\n        )\n        .await\n    }\n\n    pub async fn end(\n        \u0026mut self,\n        event_tx: \u0026FrontendEventSender,\n    ) -\u003e Result\u003cFrontendSessionSummary, AgentError\u003e {\n        let summary = FrontendSessionSummary {\n            turns: self.turn_count,\n            message_count: self.message_count(),\n        };\n        self.emit_event(\n            event_tx,\n            FrontendEvent::SessionEnded {\n                summary: summary.clone(),\n            },\n        )\n        .await?;\n        Ok(summary)\n    }\n\n    async fn submit_message_with\u003cF\u003e(\n        \u0026mut self,\n        current_input: String,\n        event_tx: \u0026FrontendEventSender,\n        executor: F,\n    ) -\u003e Result\u003c(), AgentError\u003e\n    where\n        F: for\u003c'a\u003e FnOnce(\u0026'a [Message], \u0026'a str, \u0026'a LlmProvider, TodoUsageHook) -\u003e TurnFuture\u003c'a\u003e,\n    {\n        let provider = self.provider.as_ref().ok_or_else(not_started_error)?;\n        let turn_id = self.next_turn_id();\n        let previous_todos = self.todo_snapshot().await;\n        self.emit_event(\n            event_tx,\n            FrontendEvent::UserMessageCommitted {\n                turn_id,\n                text: current_input.clone(),\n            },\n        )\n        .await?;\n\n        let (hook, used_todo_flag) = TodoUsageHook::new(turn_id, Some(event_tx.clone()));\n        let turn = executor(\u0026self.messages, \u0026current_input, provider, hook).await?;\n        let todo_used = used_todo_flag.load(Ordering::SeqCst);\n\n        if todo_used {\n            self.rounds_since_todo = 0;\n        }\n\n        let current_todos = self.todo_snapshot().await;\n        let todo_snapshot_changed = current_todos != previous_todos;\n        let reminder = self.todo_reminder_message().await;\n\n        self.emit_event(\n            event_tx,\n            FrontendEvent::AssistantMessageCompleted {\n                turn_id,\n                text: turn.response.clone(),\n            },\n        )\n        .await?;\n\n        if let Some(usage) = \u0026turn.usage {\n            self.emit_event(\n                event_tx,\n                FrontendEvent::TokenUsage {\n                    turn_id,\n                    input_tokens: usage.input_tokens,\n                    output_tokens: usage.output_tokens,\n                    total_tokens: usage.total_tokens,\n                },\n            )\n            .await?;\n        }\n\n        if let Some(ref message) = reminder {\n            self.emit_event(\n                event_tx,\n                FrontendEvent::Reminder {\n                    turn_id,\n                    message: message.clone(),\n                },\n            )\n            .await?;\n        }\n\n        if todo_snapshot_changed || (reminder.is_some() \u0026\u0026 !current_todos.is_empty()) {\n            self.emit_todo_snapshot_items(event_tx, turn_id, current_todos)\n                .await?;\n        }\n\n        self.commit_turn(turn);\n        Ok(())\n    }\n\n    fn commit_turn(\u0026mut self, turn: AgentTurn) {\n        self.messages.push(Message::user(turn.user_input));\n        self.messages.push(Message::assistant(turn.response));\n        self.turn_count += 1;\n        self.rounds_since_todo += 1;\n    }\n\n    async fn todo_reminder_message(\u0026self) -\u003e Option\u003cString\u003e {\n        if self.rounds_since_todo \u003c 3 {\n            return None;\n        }\n\n        let manager = self.todo_manager.lock().await;\n        if manager.is_empty() {\n            None\n        } else {\n            Some(TODO_REMINDER.to_string())\n        }\n    }\n\n    async fn emit_event(\n        \u0026self,\n        event_tx: \u0026FrontendEventSender,\n        event: FrontendEvent,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        event_tx\n            .emit(event)\n            .await\n            .map(|_| ())\n            .map_err(frontend_channel_closed)\n    }\n\n    fn next_turn_id(\u0026self) -\u003e u64 {\n        self.turn_count as u64 + 1\n    }\n\n    fn active_turn_id(\u0026self) -\u003e u64 {\n        if self.provider.is_some() {\n            self.next_turn_id()\n        } else {\n            SESSION_START_TURN_ID\n        }\n    }\n\n    async fn emit_todo_snapshot(\n        \u0026self,\n        event_tx: \u0026FrontendEventSender,\n        turn_id: u64,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        let items = self.todo_snapshot().await;\n        self.emit_todo_snapshot_items(event_tx, turn_id, items)\n            .await\n    }\n\n    async fn emit_todo_snapshot_items(\n        \u0026self,\n        event_tx: \u0026FrontendEventSender,\n        turn_id: u64,\n        items: Vec\u003cTodoItem\u003e,\n    ) -\u003e Result\u003c(), AgentError\u003e {\n        let items = items.into_iter().map(map_todo_item).collect::\u003cVec\u003c_\u003e\u003e();\n\n        self.emit_event(event_tx, FrontendEvent::TodoSnapshot { turn_id, items })\n            .await\n    }\n\n    async fn todo_snapshot(\u0026self) -\u003e Vec\u003cTodoItem\u003e {\n        let manager = self.todo_manager.lock().await;\n        manager.snapshot()\n    }\n}\n\nimpl Default for SessionRuntime {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nfn not_started_error() -\u003e AgentError {\n    AgentError::Provider(ProviderError::RequestFailed(\n        \"Session runtime has not been started\".to_string(),\n    ))\n}\n\nfn frontend_channel_closed\u003cT\u003e(error: tokio::sync::mpsc::error::SendError\u003cT\u003e) -\u003e AgentError {\n    AgentError::Provider(ProviderError::RequestFailed(format!(\n        \"Frontend event channel closed: {}\",\n        error\n    )))\n}\n\nfn map_todo_item(item: TodoItem) -\u003e FrontendTodoItem {\n    FrontendTodoItem {\n        id: item.id,\n        text: item.text,\n        status: match item.status {\n            TodoStatus::Pending =\u003e FrontendTodoStatus::Pending,\n            TodoStatus::InProgress =\u003e FrontendTodoStatus::InProgress,\n            TodoStatus::Completed =\u003e FrontendTodoStatus::Completed,\n        },\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::agent::TodoUsageHook;\n    use crate::frontend::{frontend_event_channel, FrontendTodoItem, FrontendTodoStatus};\n    use crate::planning::{TodoItem, TodoStatus};\n    use rig::agent::PromptHook;\n    use rig::providers::openai::responses_api::ResponsesCompletionModel;\n    use tokio::time::{timeout, Duration};\n\n    #[test]\n    fn runtime_initial_state_matches_session_defaults() {\n        let runtime = SessionRuntime::new();\n\n        assert_eq!(runtime.message_count(), 1);\n        assert_eq!(runtime.turn_count(), 0);\n        assert_eq!(runtime.rounds_since_todo(), 0);\n    }\n\n    #[tokio::test]\n    async fn turn_counter_updates_only_for_successful_turns() {\n        let (event_tx, _event_rx) = frontend_event_channel(8);\n        let mut runtime = SessionRuntime::new();\n        runtime\n            .start_with_provider(LlmProvider::Ollama, \"test\", \"model\", \u0026event_tx)\n            .await\n            .unwrap();\n\n        let error = runtime\n            .submit_message_with(\n                \"hello\".to_string(),\n                \u0026event_tx,\n                |_history, _input, _provider, _hook| {\n                    Box::pin(async { Err(AgentError::ToolsNotImplemented) })\n                },\n            )\n            .await;\n        assert!(error.is_err());\n        assert_eq!(runtime.turn_count(), 0);\n\n        runtime\n            .submit_message_with(\n                \"hello\".to_string(),\n                \u0026event_tx,\n                |_history, _input, _provider, _hook| {\n                    Box::pin(async {\n                        Ok(AgentTurn {\n                            user_input: \"hello\".to_string(),\n                            response: \"world\".to_string(),\n                            usage: None,\n                        })\n                    })\n                },\n            )\n            .await\n            .unwrap();\n\n        assert_eq!(runtime.turn_count(), 1);\n        assert_eq!(runtime.message_count(), 3);\n    }\n\n    #[tokio::test]\n    async fn session_end_emits_summary_payload() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let mut runtime = SessionRuntime::new();\n        runtime\n            .start_with_provider(LlmProvider::Ollama, \"test\", \"model\", \u0026event_tx)\n            .await\n            .unwrap();\n\n        let summary = runtime.end(\u0026event_tx).await.unwrap();\n        assert_eq!(\n            summary,\n            FrontendSessionSummary {\n                turns: 0,\n                message_count: 1,\n            }\n        );\n\n        let _ = event_rx.recv().await;\n        let _ = event_rx.recv().await;\n        let ended = event_rx\n            .recv()\n            .await\n            .expect(\"session ended event should be emitted\");\n        assert_eq!(\n            ended,\n            FrontendEvent::SessionEnded {\n                summary: FrontendSessionSummary {\n                    turns: 0,\n                    message_count: 1,\n                },\n            }\n        );\n    }\n\n    #[tokio::test]\n    async fn reminder_emission_stays_runtime_owned() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let mut runtime = SessionRuntime::new();\n        runtime\n            .start_with_provider(LlmProvider::Ollama, \"test\", \"model\", \u0026event_tx)\n            .await\n            .unwrap();\n\n        runtime.rounds_since_todo = 3;\n        {\n            let mut manager = runtime.todo_manager.lock().await;\n            manager\n                .update(vec![TodoItem::new(\n                    1,\n                    \"Implement runtime\".to_string(),\n                    TodoStatus::Pending,\n                )])\n                .unwrap();\n        }\n\n        runtime\n            .submit_message_with(\n                \"status\".to_string(),\n                \u0026event_tx,\n                |_history, _input, _provider, _hook| {\n                    Box::pin(async {\n                        Ok(AgentTurn {\n                            user_input: \"status\".to_string(),\n                            response: \"Working on it\".to_string(),\n                            usage: None,\n                        })\n                    })\n                },\n            )\n            .await\n            .unwrap();\n\n        let mut saw_reminder = false;\n        let mut saw_embedded_reminder = false;\n\n        while let Some(event) = event_rx.recv().await {\n            match event {\n                FrontendEvent::Reminder { message, .. } =\u003e {\n                    saw_reminder = message.contains(\"pending todos\");\n                }\n                FrontendEvent::AssistantMessageCompleted { text, .. } =\u003e {\n                    saw_embedded_reminder = text.contains(\"\u003creminder\u003e\");\n                }\n                FrontendEvent::TodoSnapshot { items, .. } =\u003e {\n                    if !items.is_empty() {\n                        assert_eq!(\n                            items,\n                            vec![FrontendTodoItem {\n                                id: 1,\n                                text: \"Implement runtime\".to_string(),\n                                status: FrontendTodoStatus::Pending,\n                            }]\n                        );\n                        break;\n                    }\n                }\n                _ =\u003e {}\n            }\n        }\n\n        assert!(saw_reminder);\n        assert!(!saw_embedded_reminder);\n    }\n\n    #[tokio::test]\n    async fn runtime_does_not_emit_todo_snapshot_without_state_change() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let mut runtime = SessionRuntime::new();\n        runtime\n            .start_with_provider(LlmProvider::Ollama, \"test\", \"model\", \u0026event_tx)\n            .await\n            .unwrap();\n\n        {\n            let mut manager = runtime.todo_manager.lock().await;\n            manager\n                .update(vec![TodoItem::new(\n                    1,\n                    \"Pinned footer stays stable\".to_string(),\n                    TodoStatus::Pending,\n                )])\n                .unwrap();\n        }\n\n        let _ = event_rx.recv( nking: bool,\n    pub thinking_budget: u64,\n    pub max_turns: usize,\n}\n\n/// System prompt for child agents.\n///\n/// Deliberately does NOT mention the `task` tool to prevent\n/// recursive subagent spawning. Will be used by create_parent_provider()\n/// in the next plan to override the default SYSTEM_PROMPT for child agents.\n#[allow(dead_code)]\nconst CHILD_SYSTEM_PROMPT: \u0026str = r#\"You are a subagent. Complete the assigned task using available tools.\nYou have access to bash, read, write, edit, glob, grep, and todo tools.\nReturn a clear summary of what you did and what you found.\"#;\n\n/// Maximum length of result text returned to parent agent.\nconst MAX_RESULT_LENGTH: usize = 10_000;\nconst TRUNCATION_SUFFIX: \u0026str = \"\\n... (truncated)\";\n\n/// Tool that spawns an isolated child agent to handle a subtask.\n///\n/// When the parent LLM calls the `task` tool, this creates a fresh child\n/// `LlmProvider` with only the 7 base tools (no `task`), runs an isolated\n/// agent loop with empty history, and returns the final text response.\npub struct SubagentTool {\n    config: SubagentConfig,\n}\n\nimpl SubagentTool {\n    /// Create a new SubagentTool with the given configuration.\n    pub fn new(config: SubagentConfig) -\u003e Self {\n        Self { config }\n    }\n}\n\nimpl Tool for SubagentTool {\n    const NAME: \u0026'static str = \"task\";\n\n    type Error = SubagentError;\n    type Args = TaskArgs;\n    type Output = String;\n\n    async fn definition(\u0026self, _prompt: String) -\u003e ToolDefinition {\n        ToolDefinition {\n            name: \"task\".to_string(),\n            description: \"Spawn a subagent with fresh context to handle a subtask. \\\n                The subagent has access to bash, read, write, edit, glob, grep, and todo tools \\\n                but cannot spawn further subagents. Only the final summary is returned.\"\n                .to_string(),\n            parameters: serde_json::to_value(schemars::schema_for!(TaskArgs))\n                .expect(\"Failed to generate schema for TaskArgs\"),\n        }\n    }\n\n    async fn call(\u0026self, args: Self::Args) -\u003e Result\u003cSelf::Output, Self::Error\u003e {\n        let preview_len = args.prompt.len().min(80);\n        tracing::info!(\n            \"Subagent spawned for prompt: {}...\",\n            \u0026args.prompt[..preview_len]\n        );\n\n        // Create a fresh TodoManager for the child agent.\n        // CRITICAL: Child must NOT share parent's TodoManager (Pitfall #2).\n        let child_todo = Arc::new(Mutex::new(TodoManager::new()));\n\n        // Create a fresh child provider with only 7 base tools (no task tool).\n        let provider = create_provider(\n            self.config.provider_type,\n            \u0026self.config.model,\n            self.config.base_url.as_deref(),\n            self.config.thinking,\n            self.config.thinking_budget,\n            child_todo,\n        )\n        .map_err(|e| SubagentError::ProviderError(e.to_string()))?;\n\n        // Run agent_loop with empty history -- key context isolation (CROSS-03).\n        // Child starts with no parent context, only its assigned prompt.\n        match agent_loop(\u0026[], \u0026args.prompt, \u0026provider, TodoUsageHook::default()).await {\n            Ok(turn) =\u003e {\n                // Log child token usage if available\n                if let Some(usage) = \u0026turn.usage {\n                    tracing::info!(\n                        \"Subagent token usage: input={}, output={}\",\n                        usage.input_tokens,\n                        usage.output_tokens\n                    );\n                }\n\n                // Truncate result if too long to prevent context explosion\n                let result = if turn.response.len() \u003e MAX_RESULT_LENGTH {\n                    let mut truncated: String =\n                        turn.response.chars().take(MAX_RESULT_LENGTH).collect();\n                    truncated.push_str(TRUNCATION_SUFFIX);\n                    truncated\n                } else {\n                    turn.response\n                };\n\n                Ok(result)\n            }\n            Err(e) =\u003e {\n                // Error isolation pattern (CROSS-02):\n                // Return Ok() with error text so parent LLM can decide what to do.\n                // Never propagate Err() which would crash the parent's tool loop.\n                tracing::warn!(\"Subagent failed: {}\", e);\n                Ok(format!(\"Subagent error: {}\", e))\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_task_args_deserialize() {\n        let json = r#\"{\"prompt\": \"do something\"}\"#;\n        let args: TaskArgs = serde_json::from_str(json).expect(\"deserialization should succeed\");\n        assert_eq!(args.prompt, \"do something\");\n    }\n\n    #[test]\n    fn test_task_args_schema_generation() {\n        let schema = schemars::schema_for!(TaskArgs);\n        let schema_value = serde_json::to_value(\u0026schema).expect(\"schema serialization\");\n        assert!(schema_value.is_object());\n    }\n\n    #[test]\n    fn test_subagent_config_fields() {\n        let config = SubagentConfig {\n            provider_type: ProviderType::Anthropic,\n            model: \"claude-3-5-sonnet-20241022\".to_string(),\n            base_url: None,\n            thinking: false,\n            thinking_budget: 0,\n            max_turns: 30,\n        };\n        assert_eq!(config.provider_type, ProviderType::Anthropic);\n        assert_eq!(config.model, \"claude-3-5-sonnet-20241022\");\n        assert!(config.base_url.is_none());\n        assert_eq!(config.max_turns, 30);\n    }\n\n    #[test]\n    fn test_subagent_config_clone() {\n        let config = SubagentConfig {\n            provider_type: ProviderType::Anthropic,\n            model: \"claude-3-5-sonnet-20241022\".to_string(),\n            base_url: Some(\"http://localhost:8080\".to_string()),\n            thinking: true,\n            thinking_budget: 5000,\n            max_turns: 30,\n        };\n        let cloned = config.clone();\n        assert_eq!(config, cloned);\n    }\n\n    #[test]\n    fn test_subagent_error_display() {\n        let err = SubagentError::ExecutionFailed(\"test error\".to_string());\n        assert!(err.to_string().contains(\"test error\"));\n\n        let err = SubagentError::ProviderError(\"bad config\".to_string());\n        assert!(err.to_string().contains(\"bad config\"));\n    }\n\n    #[tokio::test]\n    async fn test_subagent_tool_definition() {\n        let config = SubagentConfig {\n            provider_type: ProviderType::Anthropic,\n            model: \"claude-3-5-sonnet-20241022\".to_string(),\n            base_url: None,\n            thinking: false,\n            thinking_budget: 0,\n            max_turns: 30,\n        };\n        let tool = SubagentTool::new(config);\n        let definition = tool.definition(\"test\".to_string()).await;\n        assert_eq!(definition.name, \"task\");\n        assert!(definition.description.contains(\"subagent\"));\n        assert!(definition.parameters.is_object());\n    }\n\n    #[test]\n    fn test_truncation_constants() {\n        assert_eq!(MAX_RESULT_LENGTH, 10_000);\n        assert_eq!(TRUNCATION_SUFFIX, \"\\n... (truncated)\");\n    }\n\n    #[test]\n    fn test_result_truncation_logic() {\n        // Simulate truncation logic\n        let long_response: String = \"x\".repeat(15_000);\n        let result = if long_response.len() \u003e MAX_RESULT_LENGTH {\n            let mut truncated: String = long_response.chars().take(MAX_RESULT_LENGTH).collect();\n            truncated.push_str(TRUNCATION_SUFFIX);\n            truncated\n        } else {\n            long_response\n        };\n        assert!(result.len() \u003e MAX_RESULT_LENGTH);\n        assert!(result.len() \u003c 15_000);\n        assert!(result.ends_with(TRUNCATION_SUFFIX));\n    } n        kept_lines,\n        total_lines,\n        output.len() - truncated.len()\n    )\n}\n\n/// Bash tool for executing shell commands\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct BashTool;\n\nimpl Tool for BashTool {\n    const NAME: \u0026'static str = \"bash\";\n\n    type Error = BashError;\n    type Args = BashArgs;\n    type Output = String;\n\n    async fn definition(\u0026self, _prompt: String) -\u003e ToolDefinition {\n        ToolDefinition {\n            name: \"bash\".to_string(),\n            description: r#\"\nExecute bash commands on the system.\n\nUsage notes:\n- Use this tool to run shell commands for file operations, system info, etc.\n- Commands run in the current working directory\n- Output includes both stdout and stderr\n- Use timeout for long-running commands (default: 30 seconds)\n\"#\n            .to_string(),\n            parameters: serde_json::to_value(schemars::schema_for!(BashArgs))\n                .expect(\"Failed to generate schema for BashArgs\"),\n        }\n    }\n\n    async fn call(\u0026self, args: Self::Args) -\u003e Result\u003cSelf::Output, Self::Error\u003e {\n        tracing::info!(\n            \"Executing bash command: {} (timeout: {}s)\",\n            args.command,\n            args.timeout\n        );\n\n        // Safety blacklist check\n        let dangerous_patterns = [\n            \"rm -rf /\",\n            \"rm -rf /*\",\n            \"sudo\",\n            \"mkfs\",\n            \"fdisk\",\n            \"shutdown\",\n            \"reboot\",\n            \"halt\",\n            \"dd if=\",\n            \"\u003e /dev/sd\",\n        ];\n\n        for pattern in \u0026dangerous_patterns {\n            if args.command.contains(pattern) {\n                return Err(BashError::Blocked(format!(\n                    \"contains '{}'. This operation requires explicit user confirmation.\",\n                    pattern\n                )));\n            }\n        }\n\n        // Execute with timeout.\n        // stdin is set to null to prevent the child from inheriting the parent's\n        // raw-mode stdin, which can cause hangs (e.g. crossterm and the child\n        // both reading from the same fd).\n        let mut cmd = Command::new(\"bash\");\n        cmd.arg(\"-c\").arg(\u0026args.command);\n        cmd.stdin(Stdio::null());\n\n        let result = tokio::time::timeout(Duration::from_secs(args.timeout), cmd.output()).await;\n\n        let output = match result {\n            Ok(Ok(output)) =\u003e output,\n            Ok(Err(e)) =\u003e return Err(BashError::ExecutionFailed(e.to_string())),\n            Err(_) =\u003e return Err(BashError::Timeout(args.timeout)),\n        };\n\n        let stdout = String::from_utf8_lossy(\u0026output.stdout);\n        let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n        let combined = if !stdout.is_empty() \u0026\u0026 !stderr.is_empty() {\n            format!(\"{}\\n{}\", stdout.trim(), stderr.trim())\n        } else if !stdout.is_empty() {\n            stdout.trim().to_string()\n        } else if !stderr.is_empty() {\n            stderr.trim().to_string()\n        } else {\n            String::new()\n        };\n\n        let result = if output.status.success() {\n            if combined.is_empty() {\n                \"Command completed successfully (no output)\".to_string()\n            } else {\n                truncate_output(\u0026combined)\n            }\n        } else {\n            let truncated = truncate_output(\u0026combined);\n            match output.status.code() {\n                Some(code) =\u003e {\n                    return Err(BashError::ExecutionFailed(format!(\n                        \"exit code {}: {}\",\n                        code, truncated\n                    )));\n                }\n                None =\u003e return Err(BashError::Terminated),\n            }\n        };\n\n        tracing::debug!(\n            \"Command output ({} bytes): {}\",\n            result.len(),\n            \u0026result[..result.len().min(200)]\n        );\n        Ok(result)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[tokio::test]\n    async fn test_bash_tool_echo() {\n        let tool = BashTool;\n        let args = BashArgs {\n            command: \"echo 'Hello, World!'\".to_string(),\n            timeout: 10,\n        };\n        let result = tool.call(args).await.unwrap();\n        assert_eq!(result, \"Hello, World!\");\n    }\n\n    #[tokio::test]\n    async fn test_bash_tool_pwd() {\n        let tool = BashTool;\n        let args = BashArgs {\n            command: \"pwd\".to_string(),\n            timeout: 10,\n        };\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains('/'));\n    }\n\n    #[tokio::test]\n    async fn test_bash_tool_failure() {\n        let tool = BashTool;\n        let args = BashArgs {\n            command: \"exit 1\".to_string(),\n            timeout: 10,\n        };\n        let result = tool.call(args).await;\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            BashError::ExecutionFailed(msg) =\u003e assert!(msg.contains(\"exit code 1\")),\n            other =\u003e panic!(\"Expected ExecutionFailed, got {:?}\", other),\n        }\n    }\n\n    #[tokio::test]\n    async fn test_bash_tool_definition() {\n        let tool = BashTool;\n        let definition = tool.definition(\"test\".to_string()).await;\n        assert_eq!(definition.name, \"bash\");\n        assert!(definition.description.contains(\"Execute bash\"));\n    }\n\n    #[tokio::test]\n    async fn test_bash_tool_blocks_rm_rf_root() {\n        let tool = BashTool;\n        let args = BashArgs {\n            command: \"rm -rf /\".to_string(),\n            timeout: 10,\n        };\n        let result = tool.call(args).await;\n        assert!(result.is_err());\n        let err = result.unwrap_err();\n        assert!(err.to_string().contains(\"blocked by safety filter\"));\n
