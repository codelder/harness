<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

    <script>
        var data = {"files":[{"path":["/","Users","wangyue","workspace","codelder","harness","src","agent","loop_.rs"],"content":"use super::{AgentTurn, Message, Role};\nuse crate::error::{classify_prompt_error, AgentError};\nuse crate::frontend::{\n    FrontendEvent, FrontendEventSender, FrontendTodoItem, FrontendTodoStatus, SESSION_START_TURN_ID,\n};\nuse rig::agent::{HookAction, PromptHook, ToolCallHookAction};\nuse rig::completion::{AssistantContent, CompletionModel};\nuse rig::message::ReasoningContent;\nuse serde::Deserialize;\nuse std::sync::atomic::{AtomicBool, Ordering};\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tokio::time::sleep;\n\n/// Maximum number of retries for retryable errors\nconst MAX_RETRIES: u32 = 3;\n\n/// Initial delay for exponential backoff (1 second)\nconst INITIAL_DELAY: Duration = Duration::from_secs(1);\n\n/// Hook that tracks whether the todo tool was called during agent execution.\n///\n/// This implements direct tool call detection (per Python reference implementation)\n/// instead of indirect detection via TodoManager state changes.\n///\n/// The PromptHook trait is implemented generically for all CompletionModel types,\n/// allowing this hook to work with both Anthropic and OpenAI providers.\n#[derive(Clone)]\npub struct TodoUsageHook {\n    /// Flag set to true when todo tool is called\n    used_todo: Arc\u003cAtomicBool\u003e,\n    /// Turn context for every emitted event during the active provider call.\n    turn_id: u64,\n    /// Optional side channel for structured runtime/frontend events.\n    event_tx: Option\u003cFrontendEventSender\u003e,\n}\n\nimpl TodoUsageHook {\n    /// Create a new hook with a shared flag.\n    ///\n    /// Returns the hook and a clone of the flag that can be checked\n    /// after agent execution completes.\n    pub fn new(turn_id: u64, event_tx: Option\u003cFrontendEventSender\u003e) -\u003e (Self, Arc\u003cAtomicBool\u003e) {\n        let used_todo = Arc::new(AtomicBool::new(false));\n        let hook = Self {\n            used_todo: used_todo.clone(),\n            turn_id,\n            event_tx,\n        };\n        (hook, used_todo)\n    }\n\n    async fn record_tool_call(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n    ) {\n        if tool_name == \"todo\" {\n            self.used_todo.store(true, Ordering::SeqCst);\n        }\n\n        let call_id = tool_call_id.unwrap_or_else(|| internal_call_id.to_string());\n        let args_preview = args.to_string();\n\n        self.emit_event(FrontendEvent::ToolCallStarted {\n            turn_id: self.turn_id,\n            call_id,\n            name: tool_name.to_string(),\n            args_preview,\n        })\n        .await;\n    }\n\n    async fn record_tool_result(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n        result: \u0026str,\n    ) {\n        tracing::debug!(\n            tool_name,\n            result_len = result.len(),\n            result_preview_80 = truncate_preview(result, 80),\n            \"Raw tool result received by hook\"\n        );\n\n        let decoded_result =\n            serde_json::from_str::\u003cString\u003e(result).unwrap_or_else(|_| result.to_string());\n\n        tracing::debug!(\n            tool_name,\n            decoded_len = decoded_result.len(),\n            decoded_lines = decoded_result.lines().count(),\n            decoded_preview_80 = truncate_preview(\u0026decoded_result, 80),\n            \"Decoded tool result for UI\"\n        );\n\n        let call_id = tool_call_id.unwrap_or_else(|| internal_call_id.to_string());\n        let mut result_preview = if decoded_result.is_empty() {\n            \"(empty)\".to_string()\n        } else {\n            decoded_result\n        };\n        let is_error = result_preview.starts_with(\"Toolset error: \")\n            || result_preview.starts_with(\"ToolCallError: \");\n        if is_error {\n            result_preview = strip_error_chain(\u0026result_preview);\n        }\n\n        self.emit_event(FrontendEvent::ToolCallFinished {\n            turn_id: self.turn_id,\n            call_id,\n            name: tool_name.to_string(),\n            result_preview,\n            is_error,\n        })\n        .await;\n\n        if tool_name == \"todo\" \u0026\u0026 !is_error {\n            if let Some(items) = parse_todo_snapshot_args(args) {\n                self.emit_event(FrontendEvent::TodoSnapshot {\n                    turn_id: self.turn_id,\n                    items,\n                })\n                .await;\n            }\n        }\n    }\n\n    async fn record_thinking(\u0026self, thinking_text: String) {\n        if thinking_text.is_empty() {\n            return;\n        }\n\n        self.emit_event(FrontendEvent::Thinking {\n            turn_id: self.turn_id,\n            text: thinking_text,\n        })\n        .await;\n    }\n\n    async fn record_text_delta(\u0026self, text_delta: \u0026str) {\n        if text_delta.is_empty() {\n            return;\n        }\n\n        self.emit_event(FrontendEvent::AssistantMessageDelta {\n            turn_id: self.turn_id,\n            delta: text_delta.to_string(),\n        })\n        .await;\n    }\n\n    pub async fn emit_retry_scheduled(\n        \u0026self,\n        attempt: u32,\n        max_retries: u32,\n        delay: Duration,\n        reason: String,\n    ) {\n        self.emit_event(FrontendEvent::RetryScheduled {\n            turn_id: self.turn_id,\n            attempt,\n            max_retries,\n            delay_ms: delay.as_millis() as u64,\n            reason,\n        })\n        .await;\n    }\n\n    async fn emit_event(\u0026self, event: FrontendEvent) {\n        if let Some(event_tx) = \u0026self.event_tx {\n            let _ = event_tx.emit(event).await;\n        }\n    }\n}\n\nimpl Default for TodoUsageHook {\n    fn default() -\u003e Self {\n        Self::new(SESSION_START_TURN_ID, None).0\n    }\n}\n\nimpl\u003cM\u003e PromptHook\u003cM\u003e for TodoUsageHook\nwhere\n    M: CompletionModel,\n{\n    /// Called before a tool is invoked - display tool call in real-time\n    async fn on_tool_call(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n    ) -\u003e ToolCallHookAction {\n        self.record_tool_call(tool_name, tool_call_id, internal_call_id, args)\n            .await;\n        ToolCallHookAction::cont()\n    }\n\n    /// Called after a tool is invoked - display tool result\n    async fn on_tool_result(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n        result: \u0026str,\n    ) -\u003e HookAction {\n        self.record_tool_result(tool_name, tool_call_id, internal_call_id, args, result)\n            .await;\n        HookAction::cont()\n    }\n\n    /// Called after receiving a completion response - display thinking content\n    async fn on_completion_response(\n        \u0026self,\n        _prompt: \u0026rig::message::Message,\n        response: \u0026rig::completion::CompletionResponse\u003cM::Response\u003e,\n    ) -\u003e HookAction {\n        // Extract and display reasoning/thinking content\n        for content in response.choice.iter() {\n            if let AssistantContent::Reasoning(reasoning) = content {\n                // Get the reasoning text\n                let thinking_text: String = reasoning\n                    .content\n                    .iter()\n                    .filter_map(|c| match c {\n                        ReasoningContent::Text { text, .. } =\u003e Some(text.clone()),\n                        _ =\u003e None,\n                    })\n                    .collect::\u003cVec\u003c_\u003e\u003e()\n                    .join(\"\\n\");\n\n                self.record_thinking(thinking_text).await;\n            }\n        }\n        HookAction::cont()\n    }\n\n    /// Called when receiving text delta (streaming) - optional real-time text display\n    async fn on_text_delta(\u0026self, text_delta: \u0026str, _aggregated_text: \u0026str) -\u003e HookAction {\n        self.record_text_delta(text_delta).await;\n        HookAction::cont()\n    }\n}\n\n/// Execute an operation with automatic retry on retryable errors\n///\n/// For rate limiting: uses the retry-after duration specified by the API\n/// For other errors: uses exponential backoff: 1s, 2s, 4s delays between retries\n///\n/// # Arguments\n/// * `max_retries` - Maximum number of retry attempts\n/// * `operation` - Async operation to execute\n///\n/// # Returns\n/// The result of the operation if successful, or the final error if all retries exhausted\npub async fn with_retry\u003cT, F, Fut, N, NFut\u003e(\n    max_retries: u32,\n    mut operation: F,\n    mut on_retry: N,\n) -\u003e Result\u003cT, AgentError\u003e\nwhere\n    F: FnMut() -\u003e Fut,\n    Fut: std::future::Future\u003cOutput = Result\u003cT, AgentError\u003e\u003e,\n    N: FnMut(u32, u32, Duration, \u0026AgentError) -\u003e NFut,\n    NFut: std::future::Future\u003cOutput = ()\u003e,\n{\n    let mut backoff_delay = INITIAL_DELAY;\n\n    for attempt in 0..=max_retries {\n        match operation().await {\n            Ok(result) =\u003e return Ok(result),\n            Err(e) if e.is_retryable() \u0026\u0026 attempt \u003c max_retries =\u003e {\n                // Use API-specified retry-after for rate limiting, otherwise exponential backoff\n                let retry_delay = match \u0026e {\n                    AgentError::RateLimited(duration) =\u003e *duration,\n                    _ =\u003e backoff_delay,\n                };\n\n                on_retry(attempt + 1, max_retries, retry_delay, \u0026e).await;\n                sleep(retry_delay).await;\n\n                // Only increase backoff for non-rate-limit errors\n                if !matches!(e, AgentError::RateLimited(_)) {\n                    backoff_delay *= 2;\n                }\n            }\n            Err(e) =\u003e return Err(e),\n        }\n    }\n\n    // This should never be reached due to loop logic, but satisfies type checker\n    Err(AgentError::Network(\"Max retries exceeded\".to_string()))\n}\n\n/// Core agent loop that processes LLM responses until text output\n///\n/// This is the foundational agent pattern that transforms an LLM into an agent.\n/// The tool loop is handled internally by rig-core's Agent when tools are configured.\n///\n/// # Arguments\n/// * `history` - Conversation history (read-only, not modified)\n/// * `current_input` - The user's current input\n/// * `provider` - LLM provider to use for chat completions\n/// * `hook` - Hook for observing tool calls (e.g., TodoUsageHook)\n///\n/// # Returns\n/// An `AgentTurn` containing the user input and agent response, or an error\n///\n/// # Errors\n/// - AgentError on provider failures\n///\n/// # Note\n/// The provider parameter uses LlmProvider enum instead of \u0026dyn Chat because\n/// rig-core's Chat trait is not object-safe (uses impl Trait in return types).\n/// System messages are handled via agent preamble in rig, so we skip them here.\n/// Tool calling is handled internally by rig-core's Agent with multi-turn support.\npub async fn agent_loop(\n    history: \u0026[Message],\n    current_input: \u0026str,\n    provider: \u0026crate::llm::LlmProvider,\n    hook: TodoUsageHook,\n) -\u003e Result\u003cAgentTurn, AgentError\u003e {\n    // Convert history to rig's Message type for chat history.\n    // Note: chat_history should NOT include the current input because it is\n    // passed separately as the prompt parameter.\n    let rig_messages: Vec\u003crig::completion::Message\u003e = history\n        .iter()\n        .filter_map(|m| match m.role {\n            Role::User =\u003e Some(rig::completion::Message::user(\u0026m.content)),\n            Role::Assistant =\u003e Some(rig::completion::Message::assistant(\u0026m.content)),\n            Role::System =\u003e None,\n        })\n        .collect();\n\n    let retry_hook = hook.clone();\n    let (response_text, usage) = with_retry(\n        MAX_RETRIES,\n        || {\n            let hook_clone = hook.clone();\n            async {\n                provider\n                    .chat_with_history_and_hook(\n                        current_input.to_string(),\n                        rig_messages.clone(),\n                        hook_clone,\n                    )\n                    .await\n                    .map_err(classify_prompt_error)\n            }\n        },\n        move |attempt, max_retries, retry_delay, error| {\n            let hook = retry_hook.clone();\n            let reason = error.to_string();\n            async move {\n                hook.emit_retry_scheduled(attempt, max_retries, retry_delay, reason)\n                    .await;\n            }\n        },\n    )\n    .await?;\n\n    Ok(AgentTurn {\n        user_input: current_input.to_string(),\n        response: response_text,\n        usage,\n    })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::frontend::{frontend_event_channel, FrontendEvent, SESSION_START_TURN_ID};\n    use std::sync::atomic::{AtomicU32, Ordering};\n    use std::sync::Arc;\n\n    #[tokio::test]\n    async fn test_retry_success_on_first_try() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Ok::\u003c_, AgentError\u003e(42)\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert_eq!(result.unwrap(), 42);\n        assert_eq!(counter.load(Ordering::SeqCst), 1);\n    }\n\n    #[tokio::test]\n    async fn test_retry_succeeds_after_failures() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    let attempt = counter.fetch_add(1, Ordering::SeqCst);\n                    if attempt \u003c 2 {\n                        Err(AgentError::Network(\"timeout\".to_string()))\n                    } else {\n                        Ok::\u003c_, AgentError\u003e(42)\n                    }\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert_eq!(result.unwrap(), 42);\n        assert_eq!(counter.load(Ordering::SeqCst), 3);\n    }\n\n    #[tokio::test]\n    async fn test_retry_non_retryable_error_fails_immediately() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Err(AgentError::Auth(\"invalid key\".to_string()))\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert!(result.is_err());\n        matches!(result.unwrap_err(), AgentError::Auth(_));\n        assert_eq!(counter.load(Ordering::SeqCst), 1); // Only called once\n    }\n\n    #[tokio::test]\n    async fn test_retry_exhausts_max_retries() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            2,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Err(AgentError::Network(\"timeout\".to_string()))\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert!(result.is_err());\n        assert_eq!(counter.load(Ordering::SeqCst), 3); // Initial + 2 retries\n    }\n\n    #[tokio::test]\n    async fn test_rate_limit_uses_retry_after_duration() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n        let start = std::time::Instant::now();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            1,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    let attempt = counter.fetch_add(1, Ordering::SeqCst);\n                    if attempt == 0 {\n                        Err(AgentError::RateLimited(Duration::from_millis(100)))\n                    } else {\n                        Ok(42)\n                    }\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        let elapsed = start.elapsed();\n        assert_eq!(result.unwrap(), 42);\n        // Should have waited at least 100ms (the retry-after duration)\n        assert!(\n            elapsed \u003e= Duration::from_millis(100),\n            \"Expected at least 100ms wait, got {:?}\",\n            elapsed\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_emits_tool_and_retry_events() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, used_todo) = TodoUsageHook::new(7, Some(event_tx));\n\n        hook.record_tool_call(\n            \"todo\",\n            Some(\"tool-call\".to_string()),\n            \"internal-1\",\n            \"{\\\"items\\\":[]}\",\n        )\n        .await;\n        hook.record_tool_result(\n            \"todo\",\n            Some(\"tool-call\".to_string()),\n            \"internal-1\",\n            \"{\\\"items\\\":[]}\",\n            \"\\\"updated\\\"\",\n        )\n        .await;\n        hook.emit_retry_scheduled(\n            1,\n            3,\n            Duration::from_millis(250),\n            \"temporary network issue\".to_string(),\n        )\n        .await;\n\n        assert!(used_todo.load(Ordering::SeqCst));\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallStarted {\n                turn_id: 7,\n                call_id: \"tool-call\".to_string(),\n                name: \"todo\".to_string(),\n                args_preview: \"{\\\"items\\\":[]}\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallFinished {\n                turn_id: 7,\n                call_id: \"tool-call\".to_string(),\n                name: \"todo\".to_string(),\n                result_preview: \"updated\".to_string(),\n                is_error: false,\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::TodoSnapshot {\n                turn_id: 7,\n                items: vec![],\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::RetryScheduled {\n                turn_id: 7,\n                attempt: 1,\n                max_retries: 3,\n                delay_ms: 250,\n                reason: \"temporary network issue\".to_string(),\n            })\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_falls_back_to_internal_call_ids() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, _used_todo) = TodoUsageHook::new(9, Some(event_tx));\n\n        hook.record_tool_call(\"read\", None, \"internal-call\", \"{\\\"path\\\":\\\"README.md\\\"}\")\n            .await;\n        hook.record_tool_result(\n            \"read\",\n            None,\n            \"internal-call\",\n            \"{\\\"path\\\":\\\"README.md\\\"}\",\n            \"\\\"contents\\\"\",\n        )\n        .await;\n\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallStarted {\n                turn_id: 9,\n                call_id: \"internal-call\".to_string(),\n                name: \"read\".to_string(),\n                args_preview: \"{\\\"path\\\":\\\"README.md\\\"}\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallFinished {\n                turn_id: 9,\n                call_id: \"internal-call\".to_string(),\n                name: \"read\".to_string(),\n                result_preview: \"contents\".to_string(),\n                is_error: false,\n            })\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_emits_turn_scoped_streaming_events() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, _used_todo) = TodoUsageHook::new(5, Some(event_tx));\n\n        hook.record_thinking(\"reasoning\".to_string()).await;\n        hook.record_text_delta(\"delta\").await;\n\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::Thinking {\n                turn_id: 5,\n                text: \"reasoning\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"delta\".to_string(),\n            })\n        );\n    }\n\n    #[test]\n e ratatui::layout::{Constraint, Direction, Layout};\nuse ratatui::prelude::{Frame, Line, Span};\nuse ratatui::widgets::{Block, Borders, Paragraph, Wrap};\nuse serde::Deserialize;\nuse the_other_tui_markdown::{into_text_with_renderer as render_markdown, RendererBuilder};\n\nconst TOOL_PANEL_MAX_ROWS: u16 = 2;\nconst COMPOSER_ROWS: u16 = 3;\nconst STATUS_ROWS: u16 = 1;\n\n#[derive(Debug, Clone, PartialEq, Eq)]\nstruct ToolBlock {\n    turn_id: u64,\n    call_id: String,\n    name: String,\n    args_preview: String,\n    result_preview: Option\u003cString\u003e,\n    is_error: bool,\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nenum NoteKind {\n    Reminder,\n    Error,\n    Status,\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\nenum TimelineBlock {\n    UserMessage {\n        turn_id: u64,\n        text: String,\n    },\n    AssistantMessage {\n        turn_id: u64,\n        text: String,\n    },\n    Thinking {\n        turn_id: u64,\n        text: String,\n    },\n    Note {\n        turn_id: Option\u003cu64\u003e,\n        kind: NoteKind,\n        message: String,\n    },\n    Tool(ToolBlock),\n}\n\n#[derive(Debug, Clone, PartialEq, Eq)]\nstruct StreamingAssistant {\n    turn_id: u64,\n    text: String,\n}\n\n/// Reducer-owned UI state for the terminal adapter.\npub struct CliApp {\n    timeline: Vec\u003cTimelineBlock\u003e,\n    todo_footer: Vec\u003cFrontendTodoItem\u003e,\n    todo_was_active: bool,\n    composer: String,\n    status: String,\n    provider: Option\u003cString\u003e,\n    model: Option\u003cString\u003e,\n    version: Option\u003cString\u003e,\n    working_directory: Option\u003cString\u003e,\n    streaming_assistant: Option\u003cStreamingAssistant\u003e,\n    should_exit: bool,\n    exit_requested: bool,\n    theme: CliTheme,\n    spinner: Spinner,\n    input_tokens: u64,\n    output_tokens: u64,\n    /// Index of the next timeline block to insert above the viewport.\n    last_inserted_index: usize,\n    /// Result lines for tool blocks that were already drained before their result arrived.\n    pending_tool_result_lines: Vec\u003cLine\u003c'static\u003e\u003e,\n}\n\nimpl CliApp {\n    pub fn new() -\u003e Self {\n        Self {\n            timeline: Vec::new(),\n            todo_footer: Vec::new(),\n            todo_was_active: false,\n            composer: String::new(),\n            status: \"Starting session...\".to_string(),\n            provider: None,\n            model: None,\n            version: None,\n            working_directory: None,\n            streaming_assistant: None,\n            should_exit: false,\n            exit_requested: false,\n            theme: CliTheme::default(),\n            spinner: Spinner::new(),\n            input_tokens: 0,\n            output_tokens: 0,\n            last_inserted_index: 0,\n            pending_tool_result_lines: Vec::new(),\n        }\n    }\n\n    pub fn apply_event(\u0026mut self, event: FrontendEvent) {\n        match event {\n            FrontendEvent::SessionStarted {\n                provider,\n                model,\n                working_directory,\n                version,\n            } =\u003e {\n                self.provider = Some(provider);\n                self.model = Some(model.clone());\n                self.working_directory = Some(working_directory.clone());\n                self.version = Some(version.clone());\n                self.status = self.connection_label();\n            }\n            FrontendEvent::UserMessageCommitted { turn_id, text } =\u003e {\n                self.streaming_assistant = None;\n                self.timeline\n                    .push(TimelineBlock::UserMessage { turn_id, text });\n                self.status = \"Waiting for assistant...\".to_string();\n            }\n            FrontendEvent::AssistantMessageDelta { turn_id, delta } =\u003e {\n                if delta.is_empty() {\n                    return;\n                }\n\n                match \u0026mut self.streaming_assistant {\n                    Some(streaming) if streaming.turn_id == turn_id =\u003e {\n                        streaming.text.push_str(\u0026delta);\n                    }\n                    _ =\u003e {\n                        self.streaming_assistant = Some(StreamingAssistant {\n                            turn_id,\n                            text: delta,\n                        });\n                    }\n                }\n            }\n            FrontendEvent::AssistantMessageCompleted { turn_id, text } =\u003e {\n                self.streaming_assistant = None;\n                self.spinner.reset();\n                self.timeline\n                    .push(TimelineBlock::AssistantMessage { turn_id, text });\n                self.status = self.connection_label();\n            }\n            FrontendEvent::Thinking { turn_id, text } =\u003e {\n                self.timeline\n                    .push(TimelineBlock::Thinking { turn_id, text });\n            }\n            FrontendEvent::ToolCallStarted {\n                turn_id,\n                call_id,\n                name,\n                args_preview,\n            } =\u003e {\n                self.timeline.push(TimelineBlock::Tool(ToolBlock {\n                    turn_id,\n                    call_id,\n                    name,\n                    args_preview,\n                    result_preview: None,\n                    is_error: false,\n                }));\n            }\n            FrontendEvent::ToolCallFinished {\n                turn_id,\n                call_id,\n                name,\n                result_preview,\n                is_error,\n            } =\u003e {\n                // Find matching tool block index\n                let found_index = self\n                    .timeline\n                    .iter()\n                    .rev()\n                    .position(|block| {\n                        matches!(block, TimelineBlock::Tool(t)\n                        if t.turn_id == turn_id \u0026\u0026 t.call_id == call_id)\n                    })\n                    .map(|rev_idx| self.timeline.len() - 1 - rev_idx);\n\n                if let Some(idx) = found_index {\n                    let was_drained = idx \u003c self.last_inserted_index;\n                    // Update result in-place\n                    if let TimelineBlock::Tool(tool) = \u0026mut self.timeline[idx] {\n                        tool.result_preview = Some(result_preview);\n                        tool.is_error = is_error;\n                    }\n                    // If already printed, queue result lines for next drain\n                    if was_drained {\n                        let tool_clone = match \u0026self.timeline[idx] {\n                            TimelineBlock::Tool(t) =\u003e t.clone(),\n                            _ =\u003e unreachable!(),\n                        };\n                        let result_lines = self.tool_result_only_lines(\u0026tool_clone);\n                        self.pending_tool_result_lines.extend(result_lines);\n                    }\n                } else {\n                    self.timeline.push(TimelineBlock::Tool(ToolBlock {\n                        turn_id,\n                        call_id,\n                        name,\n                        args_preview: String::new(),\n                        result_preview: Some(result_preview),\n                        is_error,\n                    }));\n                }\n            }\n            FrontendEvent::RetryScheduled {\n                turn_id,\n                attempt,\n                max_retries,\n                delay_ms,\n                reason,\n            } =\u003e {\n                self.timeline.push(TimelineBlock::Note {\n                    turn_id: Some(turn_id),\n                    kind: NoteKind::Status,\n                    message: format!(\n                        \"Retry {}/{} in {}ms: {}\",\n                        attempt, max_retries, delay_ms, reason\n                    ),\n                });\n                self.status = \"Retry scheduled...\".to_string();\n            }\n            FrontendEvent::Reminder { turn_id, message } =\u003e {\n                self.timeline.push(TimelineBlock::Note {\n                    turn_id: Some(turn_id),\n                    kind: NoteKind::Reminder,\n                    message,\n                });\n            }\n            FrontendEvent::TokenUsage {\n                input_tokens,\n                output_tokens,\n                ..\n            } =\u003e {\n                self.input_tokens = input_tokens;\n                self.output_tokens = output_tokens;\n            }\n            FrontendEvent::TodoSnapshot { items, .. } =\u003e {\n                let all_completed = !items.is_empty()\n                    \u0026\u0026 items\n                        .iter()\n                        .all(|item| item.status == FrontendTodoStatus::Completed);\n                let was_showing = self.todo_was_active \u0026\u0026 !self.todo_footer.is_empty();\n\n                if all_completed \u0026\u0026 was_showing {\n                    let summary: String = items\n                        .iter()\n                        .map(|item| format!(\"[x] #{} {}\", item.id, item.text))\n                        .collect::\u003cVec\u003c_\u003e\u003e()\n                        .join(\"\\n\");\n\n                    self.timeline.push(TimelineBlock::Note {\n                        turn_id: None,\n                        kind: NoteKind::Status,\n                        message: format!(\"Completed todos:\\n{}\", summary),\n                    });\n\n                    self.todo_footer = Vec::new();\n                    self.todo_was_active = false;\n                } else if all_completed {\n                    self.todo_footer = items;\n                    self.todo_was_active = false;\n                } else {\n                    self.todo_was_active = !items.is_empty();\n                    self.todo_footer = items;\n                }\n            }\n            FrontendEvent::Status { message } =\u003e {\n                self.timeline.push(TimelineBlock::Note {\n                    turn_id: None,\n                    kind: NoteKind::Status,\n                    message: message.clone(),\n                });\n                self.status = message;\n            }\n            FrontendEvent::Error { turn_id, message } =\u003e {\n                self.timeline.push(TimelineBlock::Note {\n                    turn_id: Some(turn_id),\n                    kind: NoteKind::Error,\n                    message,\n                });\n                self.status = \"Error\".to_string();\n            }\n            FrontendEvent::SessionEnded { summary } =\u003e {\n                self.status = format!(\n                    \"Session ended after {} turns / {} messages\",\n                    summary.turns, summary.message_count\n                );\n                self.should_exit = true;\n            }\n        }\n    }\n\n    /// Return new timeline blocks since last call as styled Lines, ready for\n    /// `terminal.insert_before()`.\n    pub fn drain_new_lines(\u0026mut self) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        let mut all_lines = std::mem::take(\u0026mut self.pending_tool_result_lines);\n        let timeline_len = self.timeline.len();\n        while self.last_inserted_index \u003c timeline_len {\n            let block = \u0026self.timeline[self.last_inserted_index];\n            // Delay rendering tool blocks until they have a result.\n            // This ensures the green completion dot appears on the first line.\n            if let TimelineBlock::Tool(tool) = block {\n                if tool.result_preview.is_none() {\n                    break; // Stop here — wait for result before rendering\n                }\n            }\n            all_lines.extend(self.block_to_lines(block));\n            self.last_inserted_index += 1;\n        }\n        all_lines\n    }\n\n    pub fn handle_key_event(\u0026mut self, key: KeyEvent) -\u003e Option\u003cFrontendCommand\u003e {\n        match (key.code, key.modifiers) {\n            (KeyCode::Esc, _) =\u003e Some(FrontendCommand::Exit),\n            (KeyCode::Char('c'), modifiers) if modifiers.contains(KeyModifiers::CONTROL) =\u003e {\n                Some(FrontendCommand::Interrupt)\n            }\n            (KeyCode::Enter, _) =\u003e {\n                let message = self.composer.trim().to_string();\n                if message.is_empty() {\n                    None\n                } else {\n                    self.composer.clear();\n                    Some(FrontendCommand::SubmitMessage(message))\n                }\n            }\n            (KeyCode::Backspace, _) =\u003e {\n                self.composer.pop();\n                None\n            }\n            (KeyCode::Char(ch), modifiers)\n                if !modifiers.contains(KeyModifiers::CONTROL)\n                    \u0026\u0026 !modifiers.contains(KeyModifiers::ALT) =\u003e\n            {\n                self.composer.push(ch);\n                None\n            }\n            _ =\u003e None,\n        }\n    }\n\n    /// Number of tool blocks currently executing (no result yet).\n    pub fn executing_tool_count(\u0026self) -\u003e u16 {\n        self.timeline\n            .iter()\n            .filter(|block| {\n                matches!(\n                    block,\n                    TimelineBlock::Tool(ToolBlock {\n                        name,\n                        result_preview: None,\n                        ..\n                    }) if name != \"todo\"\n                )\n            })\n            .count() as u16\n    }\n\n    fn visible_tool_rows(\u0026self) -\u003e u16 {\n        self.executing_tool_count().min(TOOL_PANEL_MAX_ROWS)\n    }\n\n    fn visible_todo_rows(\u0026self) -\u003e u16 {\n        if !self.should_show_todo_footer() {\n            return 0;\n        }\n\n        1 + u16::try_from(self.todo_footer.len()).unwrap_or(u16::MAX.saturating_sub(1))\n    }\n\n    fn tool_todo_gap_rows(\u0026self) -\u003e u16 {\n        if self.visible_tool_rows() \u003e 0 \u0026\u0026 self.visible_todo_rows() \u003e 0 {\n            1\n        } else {\n            0\n        }\n    }\n\n    /// Desired viewport height: composer + status, plus only the rows currently needed\n    /// for executing tools and the pinned todo panel.\n    pub fn desired_viewport_height(\u0026self) -\u003e u16 {\n        COMPOSER_ROWS\n            + STATUS_ROWS\n            + self.visible_tool_rows()\n            + self.tool_todo_gap_rows()\n            + self.visible_todo_rows()\n    }\n\n    /// Render executing tools as stable viewport lines.\n    pub fn render_executing_tools_lines(\u0026mut self, max_lines: usize) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        // Collect executing tools info\n        let executing: Vec\u003c(String, String)\u003e = self\n            .timeline\n            .iter()\n            .filter_map(|block| match block {\n                TimelineBlock::Tool(t) if t.result_preview.is_none() \u0026\u0026 t.name != \"todo\" =\u003e {\n                    let args = if t.args_preview.is_empty() {\n                        String::new()\n                    } else {\n                        format!(\"({})\", summarize_tool_args(\u0026t.name, \u0026t.args_preview, 40))\n                    };\n                    Some((capitalize_first(\u0026t.name), args))\n                }\n                _ =\u003e None,\n            })\n            .take(max_lines)\n            .collect();\n\n        if executing.is_empty() {\n            return Vec::new();\n        }\n\n        let spinner_frame = self.spinner.frame();\n        let mut lines = Vec::new();\n\n        for (tool_name, args) in \u0026executing {\n            lines.push(Line::from(vec![\n                Span::styled(\n                    format!(\"{} \", spinner_frame),\n                    self.theme.tool_executing_indicator,\n                ),\n                Span::styled(tool_name.clone(), self.theme.tool),\n                Span::styled(args.clone(), self.theme.tool_result),\n            ]));\n        }\n\n        lines\n    }\n\n    /// Render executing tools as ANSI escape sequence string.\n    /// Kept for experiments/debugging; the interactive UI renders these in-viewport.\n    /// Returns the number of lines rendered.\n    #[allow(dead_code)]\n    pub fn render_executing_tools_ansi(\u0026mut self, width: u16) -\u003e (String, u16) {\n        // Collect executing tools info first to avoid borrow issues\n        let executing: Vec\u003c(String, String)\u003e = self\n            .timeline\n            .iter()\n            .filter_map(|block| match block {\n                TimelineBlock::Tool(t) if t.result_preview.is_none() \u0026\u0026 t.name != \"todo\" =\u003e {\n                    let args = if t.args_preview.is_empty() {\n                        String::new()\n                    } else {\n                        format!(\"({})\", summarize_tool_args(\u0026t.name, \u0026t.args_preview, 40))\n                    };\n                    Some((capitalize_first(\u0026t.name), args))\n                }\n                _ =\u003e None,\n            })\n            .take(3)\n            .collect();\n\n        if executing.is_empty() {\n            return (String::new(), 0);\n        }\n\n        let spinner_frame = self.spinner.frame();\n        let mut output = String::new();\n\n        for (tool_name, args) in \u0026executing {\n            // Use ANSI color codes matching the theme\n            // Dim gray for spinner, bright blue for tool name, default for args\n            let line = format!(\n                \"\\x1b[2m{}\\x1b[0m \\x1b[1;38;5;75m{}\\x1b[0m\\x1b[2m{}\\x1b[0m\",\n                spinner_frame, tool_name, args\n            );\n\n            // Pad to width and ensure proper line\n            let padded = format!(\"{:width$}\", line, width = width as usize);\n            output.push_str(\u0026padded);\n            output.push_str(\"\\r\\n\");\n        }\n\n        let lines_count = executing.len() as u16;\n        (output, lines_count)\n    }\n}\n\nimpl CliApp {\n    pub fn render(\u0026mut self, frame: \u0026mut Frame) {\n        let tool_rows = self.visible_tool_rows();\n        let gap_rows = self.tool_todo_gap_rows();\n        let todo_rows = self.visible_todo_rows();\n\n        let mut constraints = Vec::new();\n        if tool_rows \u003e 0 {\n            constraints.push(Constraint::Length(tool_rows));\n        }\n        if gap_rows \u003e 0 {\n            constraints.push(Constraint::Length(gap_rows));\n        }\n        if todo_rows \u003e 0 {\n            constraints.push(Constraint::Length(todo_rows));\n        }\n        constraints.push(Constraint::Length(COMPOSER_ROWS));\n        constraints.push(Constraint::Length(STATUS_ROWS));\n\n        let areas = Layout::default()\n            .direction(Direction::Vertical)\n            .constraints(constraints)\n            .split(frame.area());\n\n        let mut area_index = 0;\n        if tool_rows \u003e 0 {\n            let tool_area = areas[area_index];\n            let tool_lines = self.render_executing_tools_lines(tool_area.height as usize);\n            let tools = Paragraph::new(tool_lines).wrap(Wrap { trim: false });\n            frame.render_widget(tools, tool_area);\n            area_index += 1;\n        }\n\n        if gap_rows \u003e 0 {\n            area_index += 1;\n        }\n\n        if todo_rows \u003e 0 {\n            let todo_area = areas[area_index];\n            let todo_lines = self.render_todo_footer_lines(todo_area.height as usize);\n            let todos = Paragraph::new(todo_lines).wrap(Wrap { trim: false });\n            frame.render_widget(todos, todo_area);\n            area_index += 1;\n        }\n\n        // Composer\n        let composer_area = areas[area_index];\n        let composer = if let Some(streaming) = \u0026self.streaming_assistant {\n            Paragraph::new(streaming.text.clone())\n                .style(self.theme.assistant)\n                .block(Block::default().borders(Borders::TOP))\n                .wrap(Wrap { trim: false })\n        } else {\n            Paragraph::new(self.composer_text())\n                .style(self.theme.composer)\n                .block(Block::default().borders(Borders::TOP))\n                .wrap(Wrap { trim: false })\n        };\n        frame.render_widget(composer, composer_area);\n\n        // Status\n        let status_area = areas[area_index + 1];\n        let status = Paragraph::new(self.status_line());\n        frame.render_widget(status, status_area);\n    }\n\n    pub fn should_exit(\u0026self) -\u003e bool {\n        self.should_exit\n    }\n\n    pub fn exit_requested(\u0026self) -\u003e bool {\n        self.exit_requested\n    }\n\n    pub fn mark_exit_requested(\u0026mut self) {\n        self.exit_requested = true;\n        self.status = \"Exiting session...\".to_string();\n    }\n\n    fn connection_label(\u0026self) -\u003e String {\n        match (\u0026self.provider, \u0026self.model) {\n            (Some(provider), Some(model)) =\u003e format!(\"Connected: {} / {}\", provider, model),\n            _ =\u003e \"Session active\".to_string(),\n        }\n    }\n\n    fn status_line(\u0026mut self) -\u003e Line\u003c'static\u003e {\n        let token_info = if self.input_tokens \u003e 0 || self.output_tokens \u003e 0 {\n            format!(\"{} in / {} out | \", self.input_tokens, self.output_tokens)\n        } else {\n            String::new()\n        };\n\n        let status = if self.streaming_assistant.is_some() {\n            self.spinner.status_text()\n        } else {\n            self.status.clone()\n        };\n\n        Line::from(format!(\n            \"{}{} | Enter submit | Ctrl+C interrupt | Esc exit\",\n            token_info, status\n        ))\n    }\n\n    fn composer_text(\u0026self) -\u003e String {\n        if self.composer.is_empty() {\n            \"\u003e Type a message...\".to_string()\n        } else {\n            format!(\"\u003e {}\", self.composer)\n        }\n    }\n\n    fn should_show_todo_footer(\u0026self) -\u003e bool {\n        self.todo_was_active \u0026\u0026 !self.todo_footer.is_empty()\n    }\n\n    fn render_todo_footer_lines(\u0026self, max_lines: usize) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        if !self.should_show_todo_footer() || max_lines == 0 {\n            return Vec::new();\n        }\n\n        let completed = self\n            .todo_footer\n            .iter()\n            .filter(|item| item.status == FrontendTodoStatus::Completed)\n            .count();\n        let total = self.todo_footer.len();\n\n        let mut lines = vec![Line::styled(\n            format!(\"Tasks ({completed}/{total})\"),\n            self.theme.footer,\n        )];\n\n        let item_rows = max_lines.saturating_sub(1);\n        for item in self.todo_footer.iter().take(item_rows) {\n            lines.push(Line::styled(\n                format!(\"  {}\", format_todo_item(item)),\n                self.theme.footer,\n            ));\n        }\n\n        lines\n    }\n\n    fn block_to_lines(\u0026self, block: \u0026TimelineBlock) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        match block {\n            TimelineBlock::UserMessage { text, .. } =\u003e {\n                let mut lines = Vec::new();\n                for line in text.lines() {\n                    lines.push(Line::styled(format!(\"\u003e {}\", line), self.theme.user));\n                }\n                lines.push(Line::raw(\"\"));\n                lines\n            }\n            TimelineBlock::AssistantMessage { text, .. } =\u003e {\n                let mut lines = self.render_assistant_markdown(text);\n                lines.push(Line::raw(\"\"));\n                lines\n            }\n            TimelineBlock::Thinking { text, .. } =\u003e {\n                let mut lines = vec![Line::raw(\"\")];\n                lines.push(Line::styled(\n                    \"\\u{2234} Thinking\".to_string(),\n                    self.theme.thinking,\n                ));\n                lines.push(Line::raw(\"\"));\n                for line in text.lines() {\n                    lines.push(Line::styled(format!(\"  {}\", line), self.theme.thinking));\n                }\n                lines.push(Line::raw(\"\"));\n                lines\n            }\n            TimelineBlock::Note { kind, message, .. } =\u003e {\n                let style = match kind {\n                    NoteKind::Error =\u003e self.theme.error,\n                    NoteKind::Reminder =\u003e self.theme.status,\n                    NoteKind::Status =\u003e self.theme.status,\n                };\n                let mut lines = Vec::new();\n                let mut first = true;\n                for line in message.lines() {\n                    if first {\n                        lines.push(Line::styled(format!(\"\\u{25cf} {}\", line), style));\n                        first = false;\n                    } else {\n                        lines.push(Line::styled(format!(\"  {}\", line), style));\n                    }\n                }\n                lines.push(Line::raw(\"\"));\n                lines\n            }\n            TimelineBlock::Tool(tool) =\u003e self.tool_to_lines(tool),\n        }\n    }\n\n    fn render_assistant_markdown(\u0026self, text: \u0026str) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        let renderer = RendererBuilder::new()\n            .with_heading(|_level, spans| vec![Line::from(spans)])\n            .build();\n        render_markdown(text, \u0026renderer).lines\n    }\n\n    fn tool_to_lines(\u0026self, tool: \u0026ToolBlock) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        if tool.name == \"todo\" {\n            return Vec::new();\n        }\n\n        let mut lines = vec![Line::raw(\"\")];\n        let tool_name = capitalize_first(\u0026tool.name);\n        if tool.name == \"read\" {\n            let file_path = serde_json::from_str::\u003cserde_json::Value\u003e(\u0026tool.args_preview)\n                .ok()\n                .and_then(|v| {\n                    v.get(\"file_path\")\n                        .and_then(|f| f.as_str())\n                        .map(String::from)\n                })\n                .unwrap_or_else(|| tool.args_preview.clone());\n\n            let is_err = tool.is_error;\n            let (indicator_char, indicator_style) = if is_err {\n                (\"\\u{25cf}\", self.theme.error)\n            } else if tool.result_preview.is_none() {\n                (\"\\u{25cf}\", self.theme.tool_executing_indicator)\n            } else {\n                (\"\\u{25cf}\", self.theme.tool_indicator)\n            };\n            lines.push(Line::from(vec![\n                Span::styled(format!(\"{} \", indicator_char), indicator_style),\n                Span::styled(tool_name, self.theme.tool),\n                Span::styled(format!(\"({})\", file_path), self.theme.tool_result),\n            ]));\n\n            if let Some(result) = \u0026tool.result_preview {\n                let line_count = result.lines().count();\n                let is_err = tool.is_error;\n                if is_err {\n                    // Error result — show in red\n                    for line in result.lines() {\n                        lines.push(Line::from(vec![\n                            Span::styled(\"  \\u{2514} \", self.theme.error),\n                            Span::styled(line.to_string(), self.theme.error),\n                        ]));\n                    }\n                } else if line_count \u003c= 2 {\n                    // Short result — show actual content\n                    for line in result.lines() {\n                        lines.push(Line::from(vec![\n                            Span::styled(\"  \\u{2514} \", self.theme.tool_result),\n                            Span::styled(line.to_string(), self.theme.tool_result),\n                        ]));\n                    }\n                } else {\n                    lines.push(Line::from(vec![\n                        Span::styled(\"  \\u{2514} \", self.theme.tool_result),\n                        Span::styled(\"Read \", self.theme.tool_result),\n                        Span::styled(format!(\"{}\", line_count), self.theme.tool_result_highlight),\n                        Span::styled(\" lines\", self.theme.tool_result),\n                    ]));\n                }\n            }\n        } else {\n            let args_display = if tool.args_preview.is_empty() {\n                String::new()\n            } else {\n                format!(\n                    \"({})\",\n                    summarize_tool_args(\u0026tool.name, \u0026tool.args_preview, 80)\n                )\n            };\n            let is_err = tool.is_error;\n            let (indicator_char, indicator_style) = if is_err {\n                (\"\\u{25cf}\", self.theme.error)\n            } else if tool.result_preview.is_none() {\n                (\"\\u{25cf}\", self.theme.tool_executing_indicator)\n            } else {\n                (\"\\u{25cf}\", self.theme.tool_indicator)\n            };\n            lines.push(Line::from(vec![\n                Span::styled(format!(\"{} \", indicator_char), indicator_style),\n                Span::styled(tool_name, self.theme.tool),\n                Span::styled(args_display, self.theme.tool_result),\n            ]));\n            if let Some(result) = \u0026tool.result_preview {\n                let result_style = if tool.is_error {\n                    self.theme.error\n                } else {\n                    self.theme.tool_result\n                };\n                for (i, line) in result.lines().enumerate() {\n                    if i == 0 {\n                        lines.push(Line::from(vec![\n                            Span::styled(\"  \\u{2514} \", result_style),\n                            Span::styled(line.to_string(), result_style),\n                        ]));\n                    } else {\n                        lines.push(Line::styled(format!(\"    {}\", line), result_style));\n                    }\n                }\n            }\n        }\n        // Only add trailing blank when result is present (complete block).\n        // If result arrives later, tool_result_only_lines adds the trailing blank.\n        if tool.result_preview.is_some() {\n            lines.push(Line::raw(\"\"));\n        }\n        lines\n    }\n    fn tool_result_only_lines(\u0026self, tool: \u0026ToolBlock) -\u003e Vec\u003cLine\u003c'static\u003e\u003e {\n        if tool.name == \"todo\" {\n            return Vec::new();\n        }\n\n        let mut lines = Vec::new();\n        if let Some(result) = \u0026tool.result_preview {\n            // Completion indicator: green dot for success, red for error\n            let completion_style = if tool.is_error {\n                self.theme.error\n            } else {\n                self.theme.tool_indicator\n            };\n            if tool.name == \"read\" {\n                let line_count = result.lines().count();\n                if line_count \u003c= 2 {\n                    for line in result.lines() {\n                        lines.push(Line::from(vec![\n                            Span::styled(\"  \\u{25cf} \", completion_style),\n                            Span::styled(line.to_string(), self.theme.tool_result),\n                        ]));\n                    }\n                } else {\n                    lines.push(Line::from(vec![\n                        Span::styled(\"  \\u{25cf} \", completion_style),\n                        Span::styled(\"Read \", self.theme.tool_result),\n                        Span::styled(format!(\"{}\", line_count), self.theme.tool_result_highlight),\n                        Span::styled(\" lines\", self.theme.tool_result),\n                    ]));\n                }\n            } else {\n                let result_style = if tool.is_error {\n                    self.theme.error\n                } else {\n                    self.theme.tool_result\n                };\n                for (i, line) in result.lines().enumerate() {\n                    if i == 0 {\n                        lines.push(Line::from(vec![\n                            Span::styled(\"  \\u{25cf} \", completion_style),\n                            Span::styled(line.to_string(), result_style),\n                        ]));\n                    } else {\n                        lines.push(Line::styled(format!(\"    {}\", line), result_style));\n                    }\n                }\n            }\n            lines.push(Line::raw(\"\"));\n        }\n        lines\n    }\n}\n\n/// Detect whether a tool result looks like an error message.\n\nfn capitalize_first(s: \u0026str) -\u003e String {\n    let mut chars = s.chars();\n    match chars.next() {\n        Some(c) =\u003e c.to_uppercase().collect::\u003cString\u003e() + chars.as_str(),\n        None =\u003e String::new(),\n    }\n}\n\nfn truncate_str(s: \u0026str, max: usize) -\u003e String {\n    if s.len() \u003c= max {\n        return s.to_string();\n    }\n    let end = s.floor_char_boundary(max.saturating_sub(3));\n    format!(\"{}...\", \u0026s[..end])\n}\n\n#[derive(Debug, Deserialize)]\nstruct TodoArgsPreview {\n    items: Vec\u003cTodoItemPreview\u003e,\n}\n\n#[derive(Debug, Deserialize)]\nstruct TodoItemPreview {\n    id: u32,\n    text: String,\n    status: TodoStatusPreview,\n}\n\n#[derive(Debug, Deserialize)]\n#[serde(rename_all = \"snake_case\")]\nenum TodoStatusPreview {\n    Pending,\n    InProgress,\n    Completed,\n}\n\nfn summarize_tool_args(tool_name: \u0026str, args: \u0026str, max: usize) -\u003e String {\n    let summary = match tool_name {\n        \"todo\" =\u003e summarize_todo_args(args),\n        _ =\u003e args.to_string(),\n    };\n    truncate_str(\u0026summary, max)\n}\n\nfn summarize_todo_args(args: \u0026str) -\u003e String {\n    let Ok(todo) = serde_json::from_str::\u003cTodoArgsPreview\u003e(args) else {\n        return args.to_string();\n    };\n\n    if todo.items.is_empty() {\n        return \"0 items\".to_string();\n    }\n\n    let mut parts = todo\n        .items\n        .iter()\n        .take(2)\n        .map(|item| {\n            format!(\n                \"#{} {} {}\",\n                item.id,\n                todo_status_label(\u0026item.status),\n                item.text.trim()\n            )\n        })\n        .collect::\u003cVec\u003c_\u003e\u003e();\n\n    if todo.items.len() \u003e 2 {\n        parts.push(format!(\"+{} more\", todo.items.len() - 2));\n    }\n\n    format!(\n        \"{} item{}: {}\",\n        todo.items.len(),\n        if todo.items.len() == 1 { \"\" } else { \"s\" },\n        parts.join(\"; \")\n    )\n}\n\nfn todo_status_label(status: \u0026TodoStatusPreview) -\u003e \u0026'static str {\n    match status {\n        TodoStatusPreview::Pending =\u003e \"pending\",\n        TodoStatusPreview::InProgress =\u003e \"in progress\",\n        TodoStatusPreview::Completed =\u003e \"done\",\n    }\n}\n\nfn format_todo_item(item: \u0026FrontendTodoItem) -\u003e String {\n    let status = match item.status {\n        FrontendTodoStatus::Pending =\u003e \"[ ]\",\n        FrontendTodoStatus::InProgress =\u003e \"[\u003e]\",\n        FrontendTodoStatus::Completed =\u003e \"[x]\",\n    };\n    format!(\"{status} #{}: {}\", item.id, item.text)\n}\n\nimpl Default for CliApp {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use ratatui::backend::TestBackend;\n    use ratatui::buffer::Buffer;\n    use ratatui::Terminal;\n\n    fn render_buffer(app: \u0026mut CliApp, width: u16, height: u16) -\u003e Buffer {\n        let backend = TestBackend::new(width, height);\n        let mut terminal = Terminal::new(backend).expect(\"test terminal\");\n        terminal\n            .draw(|frame| app.render(frame))\n            .expect(\"render should succeed\");\n        terminal.backend().buffer().clone()\n    }\n\n    fn buffer_text(buffer: \u0026Buffer) -\u003e Vec\u003cString\u003e {\n        (0..buffer.area.height)\n            .map(|row| {\n                (0..buffer.area.width)\n                    .map(|col| buffer[(col, row)].symbol())\n                    .collect::\u003cString\u003e()\n            })\n            .collect()\n    }\n\n    #[test]\n    fn tool_group_and_todo_footer() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::ToolCallStarted {\n            turn_id: 1,\n            call_id: \"read-1\".to_string(),\n            name: \"read\".to_string(),\n            args_preview: \"README.md\".to_string(),\n        });\n        app.apply_event(FrontendEvent::ToolCallFinished {\n            turn_id: 1,\n            call_id: \"read-1\".to_string(),\n            name: \"read\".to_string(),\n            result_preview: \"ok\".to_string(),\n            is_error: false,\n        });\n        app.apply_event(FrontendEvent::TodoSnapshot {\n            turn_id: 1,\n            items: vec![FrontendTodoItem {\n                id: 1,\n                text: \"Review output\".to_string(),\n                status: FrontendTodoStatus::Pending,\n            }],\n        });\n\n        assert_eq!(app.timeline.len(), 1);\n        assert!(matches!(\n            \u0026app.timeline[0],\n            TimelineBlock::Tool(ToolBlock {\n                turn_id: 1,\n                call_id,\n                result_preview: Some(result),\n                ..\n            }) if call_id == \"read-1\" \u0026\u0026 result == \"ok\"\n        ));\n        assert_eq!(app.todo_footer.len(), 1);\n    }\n\n    #[test]\n    fn same_turn_out_of_order_completion_updates_correct_tool_block() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::ToolCallStarted {\n            turn_id: 2,\n            call_id: \"a\".to_string(),\n            name: \"read\".to_string(),\n            args_preview: \"A\".to_string(),\n        });\n        app.apply_event(FrontendEvent::ToolCallStarted {\n            turn_id: 2,\n            call_id: \"b\".to_string(),\n            name: \"grep\".to_string(),\n            args_preview: \"B\".to_string(),\n        });\n        app.apply_event(FrontendEvent::ToolCallFinished {\n            turn_id: 2,\n            call_id: \"b\".to_string(),\n            name: \"grep\".to_string(),\n            result_preview: \"second\".to_string(),\n            is_error: false,\n        });\n        app.apply_event(FrontendEvent::ToolCallFinished {\n            turn_id: 2,\n            call_id: \"a\".to_string(),\n            name: \"read\".to_string(),\n            result_preview: \"first\".to_string(),\n            is_error: false,\n        });\n\n        let read_tool = app.timeline.iter().find_map(|block| match block {\n            TimelineBlock::Tool(t) if t.call_id == \"a\" =\u003e Some(t),\n            _ =\u003e None,\n        });\n        let grep_tool = app.timeline.iter().find_map(|block| match block {\n            TimelineBlock::Tool(t) if t.call_id == \"b\" =\u003e Some(t),\n            _ =\u003e None,\n        });\n\n        assert!(read_tool.is_some(), \"read tool should exist\");\n        assert!(grep_tool.is_some(), \"grep tool should exist\");\n        assert_eq!(read_tool.unwrap().result_preview.as_deref(), Some(\"first\"));\n        assert_eq!(grep_tool.unwrap().result_preview.as_deref(), Some(\"second\"));\n    }\n\n    #[test]\n    fn duplicate_call_ids_across_turns_stay_isolated() {\n        let mut app = CliApp::new();\n        for turn_id in [3, 4] {\n            app.apply_event(FrontendEvent::ToolCallStarted {\n                turn_id,\n                call_id: \"same\".to_string(),\n                name: \"read\".to_string(),\n                args_preview: format!(\"turn-{turn_id}\"),\n            });\n        }\n        app.apply_event(FrontendEvent::ToolCallFinished {\n            turn_id: 4,\n            call_id: \"same\".to_string(),\n            name: \"read\".to_string(),\n            result_preview: \"turn-4-result\".to_string(),\n            is_error: false,\n        });\n\n        let first = match \u0026app.timeline[0] {\n            TimelineBlock::Tool(tool) =\u003e tool,\n            other =\u003e panic!(\"expected tool block, got {other:?}\"),\n        };\n        let second = match \u0026app.timeline[1] {\n            TimelineBlock::Tool(tool) =\u003e tool,\n            other =\u003e panic!(\"expected tool block, got {other:?}\"),\n        };\n\n        assert_eq!(first.turn_id, 3);\n        assert_eq!(first.result_preview, None);\n        assert_eq!(second.turn_id, 4);\n        assert_eq!(second.result_preview.as_deref(), Some(\"turn-4-result\"));\n    }\n\n    #[test]\n    fn todo_auto_collapses_completed_items_into_timeline() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::UserMessageCommitted {\n            turn_id: 1,\n            text: \"hello\".to_string(),\n        });\n        let timeline_len = app.timeline.len();\n\n        app.apply_event(FrontendEvent::TodoSnapshot {\n            turn_id: 1,\n            items: vec![FrontendTodoItem {\n                id: 1,\n                text: \"First\".to_string(),\n                status: FrontendTodoStatus::Pending,\n            }],\n        });\n        assert!(app.todo_was_active);\n\n        app.apply_event(FrontendEvent::TodoSnapshot {\n            turn_id: 1,\n            items: vec![FrontendTodoItem {\n                id: 2,\n                text: \"Second\".to_string(),\n                status: FrontendTodoStatus::Completed,\n            }],\n        });\n\n        assert_eq!(app.timeline.len(), timeline_len + 1);\n        assert!(app.todo_footer.is_empty());\n    }\n\n    #[test]\n    fn key_handling_maps_interrupt_and_exit_commands() {\n        let mut app = CliApp::new();\n\n        assert_eq!(\n            app.handle_key_event(KeyEvent::new(KeyCode::Char('c'), KeyModifiers::CONTROL)),\n            Some(FrontendCommand::Interrupt)\n        );\n        assert_eq!(\n            app.handle_key_event(KeyEvent::new(KeyCode::Esc, KeyModifiers::NONE)),\n            Some(FrontendCommand::Exit)\n        );\n    }\n\n    #[test]\n    fn assistant_deltas_append_within_the_active_turn() {\n        let mut app = CliApp::new();\n\n        app.apply_event(FrontendEvent::AssistantMessageDelta {\n            turn_id: 7,\n            delta: \"hello\".to_string(),\n        });\n        app.apply_event(FrontendEvent::AssistantMessageDelta {\n            turn_id: 7,\n            delta: \" world\".to_string(),\n        });\n\n        assert_eq!(\n            app.streaming_assistant,\n            Some(StreamingAssistant {\n                turn_id: 7,\n                text: \"hello world\".to_string(),\n            })\n        );\n\n        app.apply_event(FrontendEvent::AssistantMessageCompleted {\n            turn_id: 7,\n            text: \"hello world\".to_string(),\n        });\n\n        assert_eq!(app.streaming_assistant, None);\n        assert!(matches!(\n            app.timeline.last(),\n            Some(TimelineBlock::AssistantMessage { turn_id: 7, text })\n                if text == \"hello world\"\n        ));\n    }\n\n    #[test]\n    fn render_shows_composer_and_status() {\n        let mut app = CliApp::new();\n        let height = app.desired_viewport_height();\n        let buffer = render_buffer(\u0026mut app, 40, height);\n        let lines = buffer_text(\u0026buffer);\n\n        assert!(lines\n            .iter()\n            .any(|line| line.contains(\"\u003e Type a message...\")));\n        assert!(lines.iter().any(|line| line.contains(\"Starting session\")));\n    }\n\n    #[test]\n    fn render_shows_streaming_text_in_composer_area() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::AssistantMessageDelta {\n            turn_id: 1,\n            delta: \"hello world\".to_string(),\n        });\n\n        let height = app.desired_viewport_height();\n        let buffer = render_buffer(\u0026mut app, 40, height);\n        let lines = buffer_text(\u0026buffer);\n\n        assert!(lines.iter().any(|line| line.contains(\"hello world\")));\n    }\n\n    #[test]\n    fn render_shows_executing_tools_in_viewport() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::ToolCallStarted {\n            turn_id: 1,\n            call_id: \"bash-1\".to_string(),\n            name: \"bash\".to_string(),\n            args_preview: \"{\\\"command\\\":\\\"cargo test\\\"}\".to_string(),\n        });\n\n        let height = app.desired_viewport_height();\n        let buffer = render_buffer(\u0026mut app, 60, height);\n        let lines = buffer_text(\u0026buffer);\n\n        assert!(lines.iter().any(|line| line.contains(\"Bash\")));\n        assert!(lines.iter().any(|line| line.contains(\"cargo test\")));\n        assert!(lines\n            .iter()\n            .any(|line| line.contains(\"\u003e Type a message...\")));\n    }\n\n    #[test]\n    fn assistant_markdown_tables_render_without_raw_rule_row() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::AssistantMessageCompleted {\n            turn_id: 1,\n            text: \"| Name | Value |\\n| --- | --- |\\n| Alpha | 1 |\\n| Beta | 22 |\".to_string(),\n        });\n\n        let lines = app.drain_new_lines();\n        let rendered: Vec\u003cString\u003e = lines\n            .iter()\n            .map(|line| {\n                line.spans\n                    .iter()\n                    .map(|span| span.content.as_ref())\n                    .collect()\n            })\n            .collect();\n\n        assert!(rendered.iter().any(|line| line.contains(\"Name\")));\n        assert!(rendered.iter().any(|line| line.contains(\"Alpha\")));\n        assert!(rendered.iter().any(|line| line.contains(\"Beta\")));\n        assert!(rendered.iter().any(|line| line.contains('│')));\n        assert!(rendered.iter().any(|line| line.contains('┼')));\n        assert!(!rendered.iter().any(|line| line.contains(\"| Alpha | 1 |\")));\n    }\n\n    #[test]\n    fn assistant_markdown_headings_render_without_hash_prefix() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::AssistantMessageCompleted {\n            turn_id: 1,\n            text: \"# Main Title\".to_string(),\n        });\n\n        let lines = app.drain_new_lines();\n        let rendered: Vec\u003cString\u003e = lines\n            .iter()\n            .map(|line| {\n                line.spans\n                    .iter()\n                    .map(|span| span.content.as_ref())\n                    .collect()\n            })\n            .collect();\n\n        assert!(rendered.iter().any(|line| line.contains(\"Main Title\")));\n        assert!(!rendered.iter().any(|line| line.contains(\"# Main Title\")));\n    }\n\n    #[test]\n    fn summarize_todo_args_produces_human_readable_summary() {\n        let summary = summarize_todo_args(\n            r#\"{\"items\":[{\"id\":1,\"text\":\"Write tests\",\"status\":\"pending\"},{\"id\":2,\"text\":\"Fix UI\",\"status\":\"in_progress\"},{\"id\":3,\"text\":\"Ship\",\"status\":\"completed\"}]}\"#,\n        );\n\n        assert!(summary.contains(\"3 items:\"));\n        assert!(summary.contains(\"Write tests\"));\n        assert!(!summary.contains(r#\"{\"items\":\"#));\n    }\n\n    #[test]\n    fn todo_tool_does_not_render_as_scrolling_history_block() {\n        let mut app = CliApp::new();\n        app.apply_event(FrontendEvent::ToolCallStarted {\n            turn_id: 1,\n            call_id: \"todo-1\".to_string(),\n            name: \"todo\".to_string(),\n            args_preview: r#\"{\"items\":[{\"id\":1,\"text\":\"Pinned footer\",\"status\":\"in_progress\"}]}\"#\n
