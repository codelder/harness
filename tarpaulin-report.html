ex\u003cTodoManager\u003e\u003e {\n        self.manager.clone()\n    }\n}\n\nimpl Tool for TodoTool {\n    const NAME: \u0026'static str = \"todo\";\n\n    type Error = TodoError;\n    type Args = TodoArgs;\n    type Output = String;\n\n    async fn definition(\u0026self, _prompt: String) -\u003e ToolDefinition {\n        ToolDefinition {\n            name: \"todo\".to_string(),\n            description: r#\"\nUpdate task list. Track progress on multi-step tasks.\n\nUsage notes:\n- Use this tool to track your progress on multi-step tasks\n- Each call replaces the entire todo list\n- Maximum 20 todos allowed\n- Only one task can be in_progress at a time\n- Status options: pending, in_progress, completed\n\"#\n            .to_string(),\n            parameters: serde_json::to_value(schemars::schema_for!(TodoArgs))\n                .expect(\"Failed to generate schema for TodoArgs\"),\n        }\n    }\n\n    async fn call(\u0026self, args: Self::Args) -\u003e Result\u003cSelf::Output, Self::Error\u003e {\n        tracing::info!(\"Todo tool called with {} items\", args.items.len());\n\n        // Validate and convert TodoItemInput to TodoItem\n        let mut items = Vec::with_capacity(args.items.len());\n        let mut seen_ids = std::collections::HashSet::new();\n\n        for input in args.items {\n            // Validate ID is positive\n            if input.id \u003c 1 {\n                return Err(TodoError::InvalidId(input.id));\n            }\n\n            // Validate ID uniqueness\n            if !seen_ids.insert(input.id) {\n                return Err(TodoError::DuplicateId(input.id));\n            }\n\n            // Validate text is not empty\n            let text = input.text.trim();\n            if text.is_empty() {\n                return Err(TodoError::MissingText(input.id));\n            }\n\n            items.push(TodoItem {\n                id: input.id,\n                text: text.to_string(),\n                status: input.status,\n            });\n        }\n\n        // Update the shared TodoManager\n        let mut manager = self.manager.lock().await;\n        manager.update(items)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[tokio::test]\n    async fn test_todo_tool_definition_name() {\n        let tool = TodoTool::with_fresh_manager();\n        let definition = tool.definition(\"test\".to_string()).await;\n        assert_eq!(definition.name, \"todo\");\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_definition_schema_has_items() {\n        let tool = TodoTool::with_fresh_manager();\n        let definition = tool.definition(\"test\".to_string()).await;\n        let params = definition.parameters.as_object().unwrap();\n        let properties = params.get(\"properties\").unwrap().as_object().unwrap();\n        assert!(properties.contains_key(\"items\"));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_valid_items() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![\n                TodoItemInput {\n                    id: 1,\n                    text: \"First task\".to_string(),\n                    status: TodoStatus::Pending,\n                },\n                TodoItemInput {\n                    id: 2,\n                    text: \"Second task\".to_string(),\n                    status: TodoStatus::InProgress,\n                },\n            ],\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"[ ] #1: First task\"));\n        assert!(result.contains(\"[\u003e] #2: Second task\"));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_too_many_items() {\n        let tool = TodoTool::with_fresh_manager();\n        let items: Vec\u003cTodoItemInput\u003e = (1..=21)\n            .map(|id| TodoItemInput {\n                id,\n                text: format!(\"Task {}\", id),\n                status: TodoStatus::Pending,\n            })\n            .collect();\n\n        let args = TodoArgs { items };\n        let result = tool.call(args).await;\n        assert!(matches!(result, Err(TodoError::TooManyItems(21))));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_multiple_in_progress() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![\n                TodoItemInput {\n                    id: 1,\n                    text: \"Task 1\".to_string(),\n                    status: TodoStatus::InProgress,\n                },\n                TodoItemInput {\n                    id: 2,\n                    text: \"Task 2\".to_string(),\n                    status: TodoStatus::InProgress,\n                },\n            ],\n        };\n\n        let result = tool.call(args).await;\n        assert!(matches!(result, Err(TodoError::MultipleInProgress(2))));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_completed_status() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![TodoItemInput {\n                id: 1,\n                text: \"Task 1\".to_string(),\n                status: TodoStatus::Completed,\n            }],\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"[x] #1: Task 1\"));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_new_with_manager() {\n        let manager = Arc::new(Mutex::new(TodoManager::new()));\n        let tool = TodoTool::new(manager.clone());\n\n        // Verify the tool shares the same manager\n        assert!(Arc::ptr_eq(\u0026tool.manager, \u0026manager));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_get_manager() {\n        let tool = TodoTool::with_fresh_manager();\n        let manager = tool.get_manager();\n\n        // Verify we can use the manager\n        let mgr = manager.lock().await;\n        assert!(mgr.is_empty());\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_invalid_id_zero() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![TodoItemInput {\n                id: 0, // Invalid: must be 1-20\n                text: \"Task 0\".to_string(),\n                status: TodoStatus::Pending,\n            }],\n        };\n\n        let result = tool.call(args).await;\n        assert!(matches!(result, Err(TodoError::InvalidId(0))));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_invalid_id_negative() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![TodoItemInput {\n                id: 0, // Invalid: must be \u003e= 1\n                text: \"Task 0\".to_string(),\n                status: TodoStatus::Pending,\n            }],\n        };\n\n        let result = tool.call(args).await;\n        assert!(matches!(result, Err(TodoError::InvalidId(0))));\n    }\n\n    #[tokio::test]\n    async fn test_todo_tool_call_duplicate_id() {\n        let tool = TodoTool::with_fresh_manager();\n        let args = TodoArgs {\n            items: vec![\n                TodoItemInput {\n                    id: 1,\n                    text: \"First task\".to_string(),\n                    status: TodoStatus::Pending,\n                },\n                TodoItemInput {\n                    id: 1, // Duplicate\n                    text: \"Duplicate task\".to_string(),\n                    status: TodoStatus::Pending,\n                },\n            ],\n        };\n\n        let result = tool.call(args).await;\n        assert!(matches!(result, Err(TodoError::DuplicateId(1))));\n    }\n}\n","traces":[{"line":36,"address":[],"length":0,"stats":{"Line":2}},{"line":41,"address":[],"length":0,"stats":{"Line":10}},{"line":43,"address":[],"length":0,"stats":{"Line":20}},{"line":49,"address":[],"length":0,"stats":{"Line":1}},{"line":50,"address":[],"length":0,"stats":{"Line":2}},{"line":61,"address":[]," ize)]\npub struct WriteTool;\n\nimpl Tool for WriteTool {\n    const NAME: \u0026'static str = \"write\";\n\n    type Error = WriteError;\n    type Args = WriteArgs;\n    type Output = String;\n\n    async fn definition(\u0026self, _prompt: String) -\u003e ToolDefinition {\n        ToolDefinition {\n            name: \"write\".to_string(),\n            description: r#\"\nWrite content to a file, creating or overwriting as needed.\n\nUsage notes:\n- Creates parent directories if they don't exist\n- Overwrites existing files completely\n- Use absolute paths for reliable operation\n\"#\n            .to_string(),\n            parameters: serde_json::to_value(schemars::schema_for!(WriteArgs))\n                .expect(\"Failed to generate schema for WriteArgs\"),\n        }\n    }\n\n    async fn call(\u0026self, args: Self::Args) -\u003e Result\u003cSelf::Output, Self::Error\u003e {\n        tracing::info!(\"Writing to file: {}\", args.file_path);\n\n        // Create parent directories if needed\n        if let Some(parent) = std::path::Path::new(\u0026args.file_path).parent() {\n            fs::create_dir_all(parent).await?;\n        }\n\n        fs::write(\u0026args.file_path, \u0026args.content).await?;\n\n        tracing::debug!(\"Successfully wrote to {}\", args.file_path);\n        Ok(format!(\"Successfully wrote to {}\", args.file_path))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[tokio::test]\n    async fn test_write_tool_create_file() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n        let content = \"Hello, World!\";\n\n        let args = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: content.to_string(),\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"Successfully wrote\"));\n        assert!(file_path.exists());\n\n        let read_content = fs::read_to_string(\u0026file_path).await.unwrap();\n        assert_eq!(read_content, content);\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_overwrite() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n\n        // Write initial content\n        let args1 = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"Initial content\".to_string(),\n        };\n        tool.call(args1).await.unwrap();\n\n        // Overwrite with new content\n        let args2 = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"New content\".to_string(),\n        };\n        tool.call(args2).await.unwrap();\n\n        let read_content = fs::read_to_string(\u0026file_path).await.unwrap();\n        assert_eq!(read_content, \"New content\");\n        assert_ne!(read_content, \"Initial content\");\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_create_parent_dirs() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"nested/dir/test.txt\");\n\n        let args = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"Content in nested dir\".to_string(),\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"Successfully wrote\"));\n        assert!(file_path.exists());\n        assert!(file_path.parent().unwrap().exists());\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_definition() {\n        let tool = WriteTool;\n        let definition = tool.definition(\"test\".to_string()).await;\n        assert_eq!(definition.name, \"write\");\n        assert!(definition.description.contains(\"Write content\"));\n    }\n}\n","traces":[{"line":34,"address":[],"length":0,"stats": \"\n    ));\n    let mut saw_session_end = false;\n    while let Some(event) = event_rx.recv().await {\n        if let FrontendEvent::SessionEnded {\n            summary:\n                FrontendSessionSummary {\n                    turns: 0,\n                    message_count: 1,\n                },\n        } = event\n        {\n            saw_session_end = true;\n            break;\n        }\n    }\n    assert!(saw_session_end, \"session exit should emit SessionEnded\");\n}\n\n#[tokio::test]\nasync fn interrupt_command_emits_status_event() {\n    let (event_tx, mut event_rx) = frontend_event_channel(8);\n    let mut runtime = SessionRuntime::new();\n\n    runtime\n        .start_with_provider(LlmProvider::Ollama, \"ollama\", \"test-model\", \u0026event_tx)\n        .await\n        .unwrap();\n    let _ = event_rx.recv().await;\n\n    let outcome = runtime\n        .handle_command(FrontendCommand::Interrupt, \u0026event_tx)\n        .await\n        .unwrap();\n\n    assert_eq!(outcome, SessionRuntimeOutcome::Interrupted);\n    let mut saw_status = false;\n    while let Some(event) = event_rx.recv().await {\n        match event {\n            FrontendEvent::Status { message }\n                if message == \"Interrupt requested but not yet implemented\" =\u003e\n            {\n                saw_status = true;\n                break;\n            }\n            _ =\u003e {}\n        }\n    }\n    assert!(saw_status, \"interrupt should emit status feedback\");\n}\n\n#[test]\nfn harness_help_smoke() {\n    let output = Command::new(env!(\"CARGO_BIN_EXE_harness\"))\n        .arg(\"--help\")\n        .output()\n        .expect(\"failed to run harness --help\");\n\n    assert!(output.status.success());\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    assert!(stdout.contains(\"Usage\") || stdout.contains(\"harness\"));\n}\n\n#[test]\nfn clean_exit_restore_smoke_without_live_terminal() {\n    let log = terminal_impl::tests::terminal_restore_smoke(\n        terminal_impl::tests::RestoreScenario::CleanExit,\n    )\n    .expect(\"clean exit smoke should succeed\");\n\n    assert_eq!(\n        log,\n        vec![\n            \"enable_raw_mode\",\n            \"create_inline_terminal\",\n            \"height_4\",\n            \"show_cursor\",\n            \"disable_raw_mode\",\n        ]\n    );\n}\n\n#[test]\nfn runtime_error_restore_smoke_without_live_model_call() {\n    let log = terminal_impl::tests::terminal_restore_smoke(\n        terminal_impl::tests::RestoreScenario::RuntimeError,\n    )\n    .expect(\"runtime error smoke should succeed\");\n\n    assert_eq!(\n        log,\n        vec![\n            \"enable_raw_mode\",\n            \"create_inline_terminal\",\n            \"height_4\",\n            \"runtime_error\",\n            \"show_cursor\",\n            \"disable_raw_mode\",\n        ]\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","integration_test.rs"],"content":"//! Integration tests for CLI behavior\n//!\n//! These tests require building the binary first and test actual process behavior.\n//!\n//! NOTE: These tests are ignored by default because they require interactive TTY.\n//! Run manually with: cargo test -- --ignored\n\nuse std::process::{Command, Stdio};\n\n/// Test that the CLI shows welcome message and prompt\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_cli_welcome_message() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Start the harness and immediately pipe in EOF\n    let output = Command::new(\"./target/release/harness\")\n        .env_remove(\"HARNESS_ANTHROPIC_KEY\")\n        .env_remove(\"HARNESS_OPENAI_KEY\")\n        .stdin(Stdio::piped())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    // Should show welcome message (or error about missing API key)\n    let combined = format!(\"{}{}\", stdout, stderr);\n    assert!(\n        combined.contains(\"Agent Harness\")\n            || combined.contains(\"API key\")\n            || combined.contains(\"error\"),\n        \"Expected welcome message or API key error, got: stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n\n/// Test that missing API key shows clear error message\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_missing_api_key_error() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Run without API key\n    let output = Command::new(\"./target/release/harness\")\n        .env_remove(\"HARNESS_ANTHROPIC_KEY\")\n        .env_remove(\"HARNESS_OPENAI_KEY\")\n        .stdin(Stdio::null())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    // Should show clear error about missing API key\n    assert!(\n        stderr.contains(\"API key\") || stderr.contains(\"Missing\"),\n        \"Expected API key error message, got: {}\",\n        stderr\n    );\n}\n\n/// Test that stdin EOF causes graceful exit with session summary\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_stdin_eof_graceful_exit() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Run with empty stdin (immediate EOF)\n    let output = Command::new(\"./target/release/harness\")\n        .env(\"HARNESS_ANTHROPIC_KEY\", \"sk-test-dummy-key\")\n        .stdin(Stdio::null()) // No input = immediate EOF\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n    let combined = format!(\"{}{}\", stdout, stderr);\n\n    // Should show session summary on EOF exit\n    assert!(\n        combined.contains(\"Session Summary\") || combined.contains(\"stdin closed\"),\n        \"Expected graceful exit with session summary on EOF. stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n\n/// Test that Ctrl+C at input prompt exits gracefully (requires expect)\n///\n/// This test verifies the fix for the bug where stdin.read_line() blocked\n/// the tokio runtime, preventing Ctrl+C from being handled at the \"You:\" prompt.\n///\n/// Note: This test requires 'expect' to be installed (available by default on macOS).\n#[test]\n#[ignore = \"requires interactive TTY and expect command\"]\n#[cfg(unix)]\nfn test_ctrl_c_graceful_exit() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Use expect to test interactive Ctrl+C handling\n    let expect_script = r#\"\nset timeout 10\nspawn -noecho env HARNESS_ANTHROPIC_KEY=sk-test-dummy ./target/release/harness\nexpect \"You:\"\nsend \"\\003\"\nexpect {\n    \"Session Summary\" { }\n    timeout { puts \"FAILED: Timeout waiting for session summary\"; exit 1 }\n}\nexpect eof\n\"#;\n\n    let output = Command::new(\"expect\")\n        .arg(\"-c\")\n        .arg(expect_script)\n        .output()\n        .expect(\"Failed to run expect (is it installed?)\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    assert!(\n        output.status.success(),\n        \"Ctrl+C test failed. stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","provider_test.rs"],"content":"use harness::{ProviderError, ProviderType};\n\n#[test]\nfn test_parse_anthropic_provider() {\n    let provider: ProviderType = \"anthropic\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Anthropic);\n}\n\n#[test]\nfn test_parse_openai_provider() {\n    let provider: ProviderType = \"openai\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Openai);\n}\n\n#[test]\nfn test_parse_ollama_provider() {\n    let provider: ProviderType = \"ollama\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Ollama);\n}\n\n#[test]\nfn test_parse_provider_case_insensitive() {\n    assert_eq!(\n        \"ANTHROPIC\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Anthropic\n    );\n    assert_eq!(\n        \"OpenAI\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Openai\n    );\n    assert_eq!(\n        \"OLLAMA\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Ollama\n    );\n}\n\n#[test]\nfn test_unknown_provider_error() {\n    let result: Result\u003cProviderType, ProviderError\u003e = \"unknown_provider\".parse();\n    assert!(result.is_err());\n\n    let error = result.unwrap_err();\n    match error {\n        ProviderError::UnknownProvider(name) =\u003e assert_eq!(name, \"unknown_provider\"),\n        _ =\u003e panic!(\"Expected UnknownProvider error\"),\n    }\n}\n\n#[test]\nfn test_provider_type_display() {\n    assert_eq!(format!(\"{}\", ProviderType::Anthropic), \"anthropic\");\n    assert_eq!(format!(\"{}\", ProviderType::Openai), \"openai\");\n    assert_eq!(format!(\"{}\", ProviderType::Ollama), \"ollama\");\n}\n\n// Note: Actual provider creation tests require API keys\n// Those are manual tests documented in VALIDATION.md\n","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      },
    };
  });

  return [...folders, ...files.filter(file => file.path.length === 1)];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener('hashchange', () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.slice(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(
      ({current}) => {
        return {current: [...current, file.path[0]]};
      },
      () => this.updateHash(),
    );
  }

  back(file) {
    this.setState(
      ({current}) => {
        return {current: current.slice(0, current.length - 1)};
      },
      () => this.updateHash(),
    );
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e(
    'div',
    {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e(
      'table',
      {className: 'files-list'},
      e('thead', {className: 'files-list__head'}, e('tr', null, e('th', null, 'Path'), e('th', null, 'Coverage'))),
      e(
        'tbody',
        {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile})),
      ),
    ),
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? (file.covered / file.coverable) * 100 : -1;
  const coverageDelta =
    file.prevRun && (file.covered / file.coverable) * 100 - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'tr',
    {
      className:
        'files-list__file' +
        (coverage >= 0 && coverage < 50 ? ' files-list__file_low' : '') +
        (coverage >= 50 && coverage < 80 ? ' files-list__file_medium' : '') +
        (coverage >= 80 ? ' files-list__file_high' : '') +
        (file.is_folder ? ' files-list__file_folder' : ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e(
      'td',
      null,
      file.covered + ' / ' + file.coverable + (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
    ),
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'}, e(FileHeader, {file, onBack}), e(FileContent, {file}));
}

function FileHeader({file, onBack}) {
  const coverage = (file.covered / file.coverable) * 100;
  const coverageDelta = file.prevRun && coverage - (file.prevRun.covered / file.prevRun.coverable) * 100;

  return e(
    'div',
    {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e(
      'div',
      {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable + (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e(
        'span',
        {title: 'Change from the previous run'},
        coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : '',
      ),
      e('input', {id: 'theme-toggle', type: 'checkbox', hidden: true}),
      e('label', {for: 'theme-toggle', id: 'theme-toggle-label'}, '🌙'),
    ),
  );
}

function FileContent({file}) {
  return e(
    'pre',
    {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;

      return e(
        'code',
        {
          className: 'code-line' + (covered ? ' code-line_covered' : '') + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        },
        line,
      );
    }),
  );
}

    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    },
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));

  const toggle = document.getElementById('theme-toggle');
  const label = document.getElementById('theme-toggle-label');
  label.textContent = '🌙';

  toggle.addEventListener('change', () => {
    if (toggle.checked) {
      document.documentElement.setAttribute('data-theme', 'dark');
      label.textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      label.textContent = '🌙';
    }
  });
})();
</script>
</body>
</html>
