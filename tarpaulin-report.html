verwriting files\n#[derive(Debug, Clone, serde::Serialize, serde::Deserialize)]\npub struct WriteTool;\n\nimpl Tool for WriteTool {\n    const NAME: \u0026'static str = \"write\";\n\n    type Error = WriteError;\n    type Args = WriteArgs;\n    type Output = String;\n\n    async fn definition(\u0026self, _prompt: String) -\u003e ToolDefinition {\n        ToolDefinition {\n            name: \"write\".to_string(),\n            description: r#\"\nWrite content to a file, creating or overwriting as needed.\n\nUsage notes:\n- Creates parent directories if they don't exist\n- Overwrites existing files completely\n- Use absolute paths for reliable operation\n\"#\n            .to_string(),\n            parameters: serde_json::to_value(schemars::schema_for!(WriteArgs))\n                .expect(\"Failed to generate schema for WriteArgs\"),\n        }\n    }\n\n    async fn call(\u0026self, args: Self::Args) -\u003e Result\u003cSelf::Output, Self::Error\u003e {\n        tracing::info!(\"Writing to file: {}\", args.file_path);\n\n        // Create parent directories if needed\n        if let Some(parent) = std::path::Path::new(\u0026args.file_path).parent() {\n            fs::create_dir_all(parent).await?;\n        }\n\n        fs::write(\u0026args.file_path, \u0026args.content).await?;\n\n        tracing::debug!(\"Successfully wrote to {}\", args.file_path);\n        Ok(format!(\"Successfully wrote to {}\", args.file_path))\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::TempDir;\n\n    #[tokio::test]\n    async fn test_write_tool_create_file() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n        let content = \"Hello, World!\";\n\n        let args = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: content.to_string(),\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"Successfully wrote\"));\n        assert!(file_path.exists());\n\n        let read_content = fs::read_to_string(\u0026file_path).await.unwrap();\n        assert_eq!(read_content, content);\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_overwrite() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n\n        // Write initial content\n        let args1 = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"Initial content\".to_string(),\n        };\n        tool.call(args1).await.unwrap();\n\n        // Overwrite with new content\n        let args2 = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"New content\".to_string(),\n        };\n        tool.call(args2).await.unwrap();\n\n        let read_content = fs::read_to_string(\u0026file_path).await.unwrap();\n        assert_eq!(read_content, \"New content\");\n        assert_ne!(read_content, \"Initial content\");\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_create_parent_dirs() {\n        let tool = WriteTool;\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"nested/dir/test.txt\");\n\n        let args = WriteArgs {\n            file_path: file_path.to_str().unwrap().to_string(),\n            content: \"Content in nested dir\".to_string(),\n        };\n\n        let result = tool.call(args).await.unwrap();\n        assert!(result.contains(\"Successfully wrote\"));\n        assert!(file_path.exists());\n        assert!(file_path.parent().unwrap().exists());\n    }\n\n    #[tokio::test]\n    async fn test_write_tool_definition() {\n        let tool = WriteTool;\n        let definition = tool.definition(\"test\".to_string()).await;\n        assert_eq!(definition.name, \"write\");\n        assert!(definition.description.contains(\"Write content\"));\n    }\n}\n","traces":[{"line":34,"address":[],"length":0,"stats":{"Line":2}},{"line":36,"address":[],"length":0,"stats":{"Line":3}},{"line":37,"address":[],"length":0,"stats":{"Line":2}},{"line":46,"address":[],"length":0,"stats":{"Line":3}},{"line":51,"address":[],"length":0,"stats":{"Line":8}},{"line":52,"address":[],"length":0,"stats":{"Line":4}},{"line":55,"address":[],"length":0,"stats":{"Line":8}},{"line":56,"address":[],"length":0,"stats":{"Line":8}},{"line":59,"address":[],"length":0,"stats":{"Line":12}},{"line":61,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":4}}],"covered":11,"coverable":11},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","agent_loop_test.rs"],"content":"use harness::{with_retry, AgentError, Message, Role};\n\n#[test]\nfn test_message_types() {\n    let system = Message::system(\"System prompt\");\n    assert_eq!(system.role, Role::System);\n\n    let user = Message::user(\"User message\");\n    assert_eq!(user.role, Role::User);\n\n    let assistant = Message::assistant(\"Assistant response\");\n    assert_eq!(assistant.role, Role::Assistant);\n}\n\n#[test]\nfn test_message_cloning() {\n    let original = Message::user(\"Test message\");\n    let cloned = original.clone();\n    assert_eq!(original.content, cloned.content);\n    assert_eq!(original.role, cloned.role);\n}\n\n#[tokio::test]\nasync fn test_with_retry_immediate_success() {\n    let result = with_retry(\n        3,\n        || async { Ok::\u003c_, AgentError\u003e(42) },\n        |_a, _m, _d, _e| async {},\n    )\n    .await;\n    assert_eq!(result.unwrap(), 42);\n}\n\n#[tokio::test]\nasync fn test_with_retry_non_retryable_error() {\n    let result: Result\u003ci32, AgentError\u003e = with_retry(\n        3,\n        || async { Err(AgentError::Auth(\"invalid\".to_string())) },\n        |_a, _m, _d, _e| async {},\n    )\n    .await;\n\n    assert!(result.is_err());\n    matches!(result.unwrap_err(), AgentError::Auth(_));\n}\n\n// Note: Actual agent_loop tests require a mock provider\n// Those tests will be added in the CLI integration phase\n// For now, we verify that the types are accessible\n\n#[test]\nfn test_agent_loop_types_exist() {\n    // This is a compile-time check - if this compiles, the types exist\n    let _msg = Message::user(\"test\");\n    let _role = Role::User;\n\n    // Verify agent_loop is in scope (compile-time check)\n    // The function signature is: async fn agent_loop(\u0026mut Vec\u003cMessage\u003e, \u0026LlmProvider) -\u003e Result\u003cString, AgentError\u003e\n    // We can't call it without a real provider, but we can verify it's exported\n    use harness::agent_loop;\n    let _ = agent_loop;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","cli_integration_test.rs"],"content":"use harness::{\n    frontend_event_channel, FrontendCommand, FrontendEvent, FrontendSessionSummary, LlmProvider,\n    SessionRuntime, SessionRuntimeOutcome,\n};\nuse std::process::Command;\n\n#[allow(dead_code)]\n#[path = \"../src/cli/terminal.rs\"]\nmod terminal_impl;\n\n#[tokio::test]\nasync fn session_start_and_exit_emit_metadata_events() {\n    let (event_tx, mut event_rx) = frontend_event_channel(8);\n    let mut runtime = SessionRuntime::new();\n\n    runtime\n        .start_with_provider(LlmProvider::Ollama, \"ollama\", \"test-model\", \u0026event_tx)\n        .await\n        .unwrap();\n\n    let outcome = runtime\n        .handle_command(FrontendCommand::Exit, \u0026event_tx)\n        .await\n        .unwrap();\n\n    assert_eq!(\n        outcome,\n        SessionRuntimeOutcome::Exit(FrontendSessionSummary {\n            turns: 0,\n            message_count: 1,\n        })\n    );\n    assert!(matches!(\n        event_rx.recv().await,\n        Some(FrontendEvent::SessionStarted {\n            provider,\n            model,\n            working_directory: _,\n            version: _,\n        }) if provider == \"ollama\" \u0026\u0026 model == \"test-model\"\n    ));\n    let mut saw_session_end = false;\n    while let Some(event) = event_rx.recv().await {\n        if let FrontendEvent::SessionEnded {\n            summary:\n                FrontendSessionSummary {\n                    turns: 0,\n                    message_count: 1,\n                },\n        } = event\n        {\n            saw_session_end = true;\n            break;\n        }\n    }\n    assert!(saw_session_end, \"session exit should emit SessionEnded\");\n}\n\n#[tokio::test]\nasync fn interrupt_command_emits_status_event() {\n    let (event_tx, mut event_rx) = frontend_event_channel(8);\n    let mut runtime = SessionRuntime::new();\n\n    runtime\n        .start_with_provider(LlmProvider::Ollama, \"ollama\", \"test-model\", \u0026event_tx)\n        .await\n        .unwrap();\n    let _ = event_rx.recv().await;\n\n    let outcome = runtime\n        .handle_command(FrontendCommand::Interrupt, \u0026event_tx)\n        .await\n        .unwrap();\n\n    assert_eq!(outcome, SessionRuntimeOutcome::Interrupted);\n    let mut saw_status = false;\n    while let Some(event) = event_rx.recv().await {\n        match event {\n            FrontendEvent::Status { message }\n                if message == \"Interrupt requested but not yet implemented\" =\u003e\n            {\n                saw_status = true;\n                break;\n            }\n            _ =\u003e {}\n        }\n    }\n    assert!(saw_status, \"interrupt should emit status feedback\");\n}\n\n#[test]\nfn harness_help_smoke() {\n    let output = Command::new(env!(\"CARGO_BIN_EXE_harness\"))\n        .arg(\"--help\")\n        .output()\n        .expect(\"failed to run harness --help\");\n\n    assert!(output.status.success());\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    assert!(stdout.contains(\"Usage\") || stdout.contains(\"harness\"));\n}\n\n#[test]\nfn clean_exit_restore_smoke_without_live_terminal() {\n    let log = terminal_impl::tests::terminal_restore_smoke(\n        terminal_impl::tests::RestoreScenario::CleanExit,\n    )\n    .expect(\"clean exit smoke should succeed\");\n\n    assert_eq!(\n        log,\n        vec![\n            \"enable_raw_mode\",\n            \"create_inline_terminal\",\n            \"height_4\",\n            \"show_cursor\",\n            \"disable_raw_mode\",\n        ]\n    );\n}\n\n#[test]\nfn runtime_error_restore_smoke_without_live_model_call() {\n    let log = terminal_impl::tests::terminal_restore_smoke(\n        terminal_impl::tests::RestoreScenario::RuntimeError,\n    )\n    .expect(\"runtime error smoke should succeed\");\n\n    assert_eq!(\n        log,\n        vec![\n            \"enable_raw_mode\",\n            \"create_inline_terminal\",\n            \"height_4\",\n            \"runtime_error\",\n            \"show_cursor\",\n            \"disable_raw_mode\",\n        ]\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","integration_test.rs"],"content":"//! Integration tests for CLI behavior\n//!\n//! These tests require building the binary first and test actual process behavior.\n//!\n//! NOTE: These tests are ignored by default because they require interactive TTY.\n//! Run manually with: cargo test -- --ignored\n\nuse std::process::{Command, Stdio};\n\n/// Test that the CLI shows welcome message and prompt\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_cli_welcome_message() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Start the harness and immediately pipe in EOF\n    let output = Command::new(\"./target/release/harness\")\n        .env_remove(\"HARNESS_ANTHROPIC_KEY\")\n        .env_remove(\"HARNESS_OPENAI_KEY\")\n        .stdin(Stdio::piped())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    // Should show welcome message (or error about missing API key)\n    let combined = format!(\"{}{}\", stdout, stderr);\n    assert!(\n        combined.contains(\"Agent Harness\")\n            || combined.contains(\"API key\")\n            || combined.contains(\"error\"),\n        \"Expected welcome message or API key error, got: stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n\n/// Test that missing API key shows clear error message\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_missing_api_key_error() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Run without API key\n    let output = Command::new(\"./target/release/harness\")\n        .env_remove(\"HARNESS_ANTHROPIC_KEY\")\n        .env_remove(\"HARNESS_OPENAI_KEY\")\n        .stdin(Stdio::null())\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    // Should show clear error about missing API key\n    assert!(\n        stderr.contains(\"API key\") || stderr.contains(\"Missing\"),\n        \"Expected API key error message, got: {}\",\n        stderr\n    );\n}\n\n/// Test that stdin EOF causes graceful exit with session summary\n#[test]\n#[ignore = \"requires interactive TTY\"]\nfn test_stdin_eof_graceful_exit() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Run with empty stdin (immediate EOF)\n    let output = Command::new(\"./target/release/harness\")\n        .env(\"HARNESS_ANTHROPIC_KEY\", \"sk-test-dummy-key\")\n        .stdin(Stdio::null()) // No input = immediate EOF\n        .stdout(Stdio::piped())\n        .stderr(Stdio::piped())\n        .output()\n        .expect(\"Failed to run harness\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n    let combined = format!(\"{}{}\", stdout, stderr);\n\n    // Should show session summary on EOF exit\n    assert!(\n        combined.contains(\"Session Summary\") || combined.contains(\"stdin closed\"),\n        \"Expected graceful exit with session summary on EOF. stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n\n/// Test that Ctrl+C at input prompt exits gracefully (requires expect)\n///\n/// This test verifies the fix for the bug where stdin.read_line() blocked\n/// the tokio runtime, preventing Ctrl+C from being handled at the \"You:\" prompt.\n///\n/// Note: This test requires 'expect' to be installed (available by default on macOS).\n#[test]\n#[ignore = \"requires interactive TTY and expect command\"]\n#[cfg(unix)]\nfn test_ctrl_c_graceful_exit() {\n    // Build the binary first\n    let build_status = Command::new(\"cargo\")\n        .args([\"build\", \"--release\"])\n        .status()\n        .expect(\"Failed to build harness\");\n    assert!(build_status.success(), \"Build failed\");\n\n    // Use expect to test interactive Ctrl+C handling\n    let expect_script = r#\"\nset timeout 10\nspawn -noecho env HARNESS_ANTHROPIC_KEY=sk-test-dummy ./target/release/harness\nexpect \"You:\"\nsend \"\\003\"\nexpect {\n    \"Session Summary\" { }\n    timeout { puts \"FAILED: Timeout waiting for session summary\"; exit 1 }\n}\nexpect eof\n\"#;\n\n    let output = Command::new(\"expect\")\n        .arg(\"-c\")\n        .arg(expect_script)\n        .output()\n        .expect(\"Failed to run expect (is it installed?)\");\n\n    let stdout = String::from_utf8_lossy(\u0026output.stdout);\n    let stderr = String::from_utf8_lossy(\u0026output.stderr);\n\n    assert!(\n        output.status.success(),\n        \"Ctrl+C test failed. stdout='{}', stderr='{}'\",\n        stdout,\n        stderr\n    );\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","wangyue","workspace","codelder","harness","tests","provider_test.rs"],"content":"use harness::{ProviderError, ProviderType};\n\n#[test]\nfn test_parse_anthropic_provider() {\n    let provider: ProviderType = \"anthropic\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Anthropic);\n}\n\n#[test]\nfn test_parse_openai_provider() {\n    let provider: ProviderType = \"openai\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Openai);\n}\n\n#[test]\nfn test_parse_ollama_provider() {\n    let provider: ProviderType = \"ollama\".parse().unwrap();\n    assert_eq!(provider, ProviderType::Ollama);\n}\n\n#[test]\nfn test_parse_provider_case_insensitive() {\n    assert_eq!(\n        \"ANTHROPIC\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Anthropic\n    );\n    assert_eq!(\n        \"OpenAI\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Openai\n    );\n    assert_eq!(\n        \"OLLAMA\".parse::\u003cProviderType\u003e().unwrap(),\n        ProviderType::Ollama\n    );\n}\n\n#[test]\nfn test_unknown_provider_error() {\n    let result: Result\u003cProviderType, ProviderError\u003e = \"unknown_provider\".parse();\n    assert!(result.is_err());\n\n    let error = result.unwrap_err();\n    match error {\n        ProviderError::UnknownProvider(name) =\u003e assert_eq!(name, \"unknown_provider\"),\n        _ =\u003e panic!(\"Expected UnknownProvider error\"),\n    }\n}\n\n#[test]\nfn test_provid         var previousData = {"files":[{"path":["/","Users","wangyue","workspace","codelder","harness","src","agent","loop_.rs"],"content":"use super::{AgentTurn, Message, Role};\nuse crate::error::{classify_prompt_error, AgentError};\nuse crate::frontend::{\n    FrontendEvent, FrontendEventSender, FrontendTodoItem, FrontendTodoStatus, SESSION_START_TURN_ID,\n};\nuse rig::agent::{HookAction, PromptHook, ToolCallHookAction};\nuse rig::completion::{AssistantContent, CompletionModel};\nuse rig::message::ReasoningContent;\nuse serde::Deserialize;\nuse std::sync::atomic::{AtomicBool, Ordering};\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tokio::time::sleep;\n\n/// Maximum number of retries for retryable errors\nconst MAX_RETRIES: u32 = 3;\n\n/// Initial delay for exponential backoff (1 second)\nconst INITIAL_DELAY: Duration = Duration::from_secs(1);\n\n/// Hook that tracks whether the todo tool was called during agent execution.\n///\n/// This implements direct tool call detection (per Python reference implementation)\n/// instead of indirect detection via TodoManager state changes.\n///\n/// The PromptHook trait is implemented generically for all CompletionModel types,\n/// allowing this hook to work with both Anthropic and OpenAI providers.\n#[derive(Clone)]\npub struct TodoUsageHook {\n    /// Flag set to true when todo tool is called\n    used_todo: Arc\u003cAtomicBool\u003e,\n    /// Turn context for every emitted event during the active provider call.\n    turn_id: u64,\n    /// Optional side channel for structured runtime/frontend events.\n    event_tx: Option\u003cFrontendEventSender\u003e,\n}\n\nimpl TodoUsageHook {\n    /// Create a new hook with a shared flag.\n    ///\n    /// Returns the hook and a clone of the flag that can be checked\n    /// after agent execution completes.\n    pub fn new(turn_id: u64, event_tx: Option\u003cFrontendEventSender\u003e) -\u003e (Self, Arc\u003cAtomicBool\u003e) {\n        let used_todo = Arc::new(AtomicBool::new(false));\n        let hook = Self {\n            used_todo: used_todo.clone(),\n            turn_id,\n            event_tx,\n        };\n        (hook, used_todo)\n    }\n\n    async fn record_tool_call(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n    ) {\n        if tool_name == \"todo\" {\n            self.used_todo.store(true, Ordering::SeqCst);\n        }\n\n        let call_id = tool_call_id.unwrap_or_else(|| internal_call_id.to_string());\n        let args_preview = args.to_string();\n\n        self.emit_event(FrontendEvent::ToolCallStarted {\n            turn_id: self.turn_id,\n            call_id,\n            name: tool_name.to_string(),\n            args_preview,\n        })\n        .await;\n    }\n\n    async fn record_tool_result(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n        result: \u0026str,\n    ) {\n        tracing::debug!(\n            tool_name,\n            result_len = result.len(),\n            result_preview_80 = truncate_preview(result, 80),\n            \"Raw tool result received by hook\"\n        );\n\n        let decoded_result =\n            serde_json::from_str::\u003cString\u003e(result).unwrap_or_else(|_| result.to_string());\n\n        tracing::debug!(\n            tool_name,\n            decoded_len = decoded_result.len(),\n            decoded_lines = decoded_result.lines().count(),\n            decoded_preview_80 = truncate_preview(\u0026decoded_result, 80),\n            \"Decoded tool result for UI\"\n        );\n\n        let call_id = tool_call_id.unwrap_or_else(|| internal_call_id.to_string());\n        let mut result_preview = if decoded_result.is_empty() {\n            \"(empty)\".to_string()\n        } else {\n            decoded_result\n        };\n        let is_error = result_preview.starts_with(\"Toolset error: \")\n            || result_preview.starts_with(\"ToolCallError: \");\n        if is_error {\n            result_preview = strip_error_chain(\u0026result_preview);\n        }\n\n        self.emit_event(FrontendEvent::ToolCallFinished {\n            turn_id: self.turn_id,\n            call_id,\n            name: tool_name.to_string(),\n            result_preview,\n            is_error,\n        })\n        .await;\n\n        if tool_name == \"todo\" \u0026\u0026 !is_error {\n            if let Some(items) = parse_todo_snapshot_args(args) {\n                self.emit_event(FrontendEvent::TodoSnapshot {\n                    turn_id: self.turn_id,\n                    items,\n                })\n                .await;\n            }\n        }\n    }\n\n    async fn record_thinking(\u0026self, thinking_text: String) {\n        if thinking_text.is_empty() {\n            return;\n        }\n\n        self.emit_event(FrontendEvent::Thinking {\n            turn_id: self.turn_id,\n            text: thinking_text,\n        })\n        .await;\n    }\n\n    async fn record_text_delta(\u0026self, text_delta: \u0026str) {\n        if text_delta.is_empty() {\n            return;\n        }\n\n        self.emit_event(FrontendEvent::AssistantMessageDelta {\n            turn_id: self.turn_id,\n            delta: text_delta.to_string(),\n        })\n        .await;\n    }\n\n    pub async fn emit_retry_scheduled(\n        \u0026self,\n        attempt: u32,\n        max_retries: u32,\n        delay: Duration,\n        reason: String,\n    ) {\n        self.emit_event(FrontendEvent::RetryScheduled {\n            turn_id: self.turn_id,\n            attempt,\n            max_retries,\n            delay_ms: delay.as_millis() as u64,\n            reason,\n        })\n        .await;\n    }\n\n    async fn emit_event(\u0026self, event: FrontendEvent) {\n        if let Some(event_tx) = \u0026self.event_tx {\n            let _ = event_tx.emit(event).await;\n        }\n    }\n}\n\nimpl Default for TodoUsageHook {\n    fn default() -\u003e Self {\n        Self::new(SESSION_START_TURN_ID, None).0\n    }\n}\n\nimpl\u003cM\u003e PromptHook\u003cM\u003e for TodoUsageHook\nwhere\n    M: CompletionModel,\n{\n    /// Called before a tool is invoked - display tool call in real-time\n    async fn on_tool_call(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n    ) -\u003e ToolCallHookAction {\n        self.record_tool_call(tool_name, tool_call_id, internal_call_id, args)\n            .await;\n        ToolCallHookAction::cont()\n    }\n\n    /// Called after a tool is invoked - display tool result\n    async fn on_tool_result(\n        \u0026self,\n        tool_name: \u0026str,\n        tool_call_id: Option\u003cString\u003e,\n        internal_call_id: \u0026str,\n        args: \u0026str,\n        result: \u0026str,\n    ) -\u003e HookAction {\n        self.record_tool_result(tool_name, tool_call_id, internal_call_id, args, result)\n            .await;\n        HookAction::cont()\n    }\n\n    /// Called after receiving a completion response - display thinking content\n    async fn on_completion_response(\n        \u0026self,\n        _prompt: \u0026rig::message::Message,\n        response: \u0026rig::completion::CompletionResponse\u003cM::Response\u003e,\n    ) -\u003e HookAction {\n        // Extract and display reasoning/thinking content\n        for content in response.choice.iter() {\n            if let AssistantContent::Reasoning(reasoning) = content {\n                // Get the reasoning text\n                let thinking_text: String = reasoning\n                    .content\n                    .iter()\n                    .filter_map(|c| match c {\n                        ReasoningContent::Text { text, .. } =\u003e Some(text.clone()),\n                        _ =\u003e None,\n                    })\n                    .collect::\u003cVec\u003c_\u003e\u003e()\n                    .join(\"\\n\");\n\n                self.record_thinking(thinking_text).await;\n            }\n        }\n        HookAction::cont()\n    }\n\n    /// Called when receiving text delta (streaming) - optional real-time text display\n    async fn on_text_delta(\u0026self, text_delta: \u0026str, _aggregated_text: \u0026str) -\u003e HookAction {\n        self.record_text_delta(text_delta).await;\n        HookAction::cont()\n    }\n}\n\n/// Execute an operation with automatic retry on retryable errors\n///\n/// For rate limiting: uses the retry-after duration specified by the API\n/// For other errors: uses exponential backoff: 1s, 2s, 4s delays between retries\n///\n/// # Arguments\n/// * `max_retries` - Maximum number of retry attempts\n/// * `operation` - Async operation to execute\n///\n/// # Returns\n/// The result of the operation if successful, or the final error if all retries exhausted\npub async fn with_retry\u003cT, F, Fut, N, NFut\u003e(\n    max_retries: u32,\n    mut operation: F,\n    mut on_retry: N,\n) -\u003e Result\u003cT, AgentError\u003e\nwhere\n    F: FnMut() -\u003e Fut,\n    Fut: std::future::Future\u003cOutput = Result\u003cT, AgentError\u003e\u003e,\n    N: FnMut(u32, u32, Duration, \u0026AgentError) -\u003e NFut,\n    NFut: std::future::Future\u003cOutput = ()\u003e,\n{\n    let mut backoff_delay = INITIAL_DELAY;\n\n    for attempt in 0..=max_retries {\n        match operation().await {\n            Ok(result) =\u003e return Ok(result),\n            Err(e) if e.is_retryable() \u0026\u0026 attempt \u003c max_retries =\u003e {\n                // Use API-specified retry-after for rate limiting, otherwise exponential backoff\n                let retry_delay = match \u0026e {\n                    AgentError::RateLimited(duration) =\u003e *duration,\n                    _ =\u003e backoff_delay,\n                };\n\n                on_retry(attempt + 1, max_retries, retry_delay, \u0026e).await;\n                sleep(retry_delay).await;\n\n                // Only increase backoff for non-rate-limit errors\n                if !matches!(e, AgentError::RateLimited(_)) {\n                    backoff_delay *= 2;\n                }\n            }\n            Err(e) =\u003e return Err(e),\n        }\n    }\n\n    // This should never be reached due to loop logic, but satisfies type checker\n    Err(AgentError::Network(\"Max retries exceeded\".to_string()))\n}\n\n/// Core agent loop that processes LLM responses until text output\n///\n/// This is the foundational agent pattern that transforms an LLM into an agent.\n/// The tool loop is handled internally by rig-core's Agent when tools are configured.\n///\n/// # Arguments\n/// * `history` - Conversation history (read-only, not modified)\n/// * `current_input` - The user's current input\n/// * `provider` - LLM provider to use for chat completions\n/// * `hook` - Hook for observing tool calls (e.g., TodoUsageHook)\n///\n/// # Returns\n/// An `AgentTurn` containing the user input and agent response, or an error\n///\n/// # Errors\n/// - AgentError on provider failures\n///\n/// # Note\n/// The provider parameter uses LlmProvider enum instead of \u0026dyn Chat because\n/// rig-core's Chat trait is not object-safe (uses impl Trait in return types).\n/// System messages are handled via agent preamble in rig, so we skip them here.\n/// Tool calling is handled internally by rig-core's Agent with multi-turn support.\npub async fn agent_loop(\n    history: \u0026[Message],\n    current_input: \u0026str,\n    provider: \u0026crate::llm::LlmProvider,\n    hook: TodoUsageHook,\n) -\u003e Result\u003cAgentTurn, AgentError\u003e {\n    // Convert history to rig's Message type for chat history.\n    // Note: chat_history should NOT include the current input because it is\n    // passed separately as the prompt parameter.\n    let rig_messages: Vec\u003crig::completion::Message\u003e = history\n        .iter()\n        .filter_map(|m| match m.role {\n            Role::User =\u003e Some(rig::completion::Message::user(\u0026m.content)),\n            Role::Assistant =\u003e Some(rig::completion::Message::assistant(\u0026m.content)),\n            Role::System =\u003e None,\n        })\n        .collect();\n\n    let retry_hook = hook.clone();\n    let (response_text, usage) = with_retry(\n        MAX_RETRIES,\n        || {\n            let hook_clone = hook.clone();\n            async {\n                provider\n                    .chat_with_history_and_hook(\n                        current_input.to_string(),\n                        rig_messages.clone(),\n                        hook_clone,\n                    )\n                    .await\n                    .map_err(classify_prompt_error)\n            }\n        },\n        move |attempt, max_retries, retry_delay, error| {\n            let hook = retry_hook.clone();\n            let reason = error.to_string();\n            async move {\n                hook.emit_retry_scheduled(attempt, max_retries, retry_delay, reason)\n                    .await;\n            }\n        },\n    )\n    .await?;\n\n    Ok(AgentTurn {\n        user_input: current_input.to_string(),\n        response: response_text,\n        usage,\n    })\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::frontend::{frontend_event_channel, FrontendEvent, SESSION_START_TURN_ID};\n    use std::sync::atomic::{AtomicU32, Ordering};\n    use std::sync::Arc;\n\n    #[tokio::test]\n    async fn test_retry_success_on_first_try() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Ok::\u003c_, AgentError\u003e(42)\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert_eq!(result.unwrap(), 42);\n        assert_eq!(counter.load(Ordering::SeqCst), 1);\n    }\n\n    #[tokio::test]\n    async fn test_retry_succeeds_after_failures() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    let attempt = counter.fetch_add(1, Ordering::SeqCst);\n                    if attempt \u003c 2 {\n                        Err(AgentError::Network(\"timeout\".to_string()))\n                    } else {\n                        Ok::\u003c_, AgentError\u003e(42)\n                    }\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert_eq!(result.unwrap(), 42);\n        assert_eq!(counter.load(Ordering::SeqCst), 3);\n    }\n\n    #[tokio::test]\n    async fn test_retry_non_retryable_error_fails_immediately() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            3,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Err(AgentError::Auth(\"invalid key\".to_string()))\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert!(result.is_err());\n        matches!(result.unwrap_err(), AgentError::Auth(_));\n        assert_eq!(counter.load(Ordering::SeqCst), 1); // Only called once\n    }\n\n    #[tokio::test]\n    async fn test_retry_exhausts_max_retries() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            2,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    counter.fetch_add(1, Ordering::SeqCst);\n                    Err(AgentError::Network(\"timeout\".to_string()))\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        assert!(result.is_err());\n        assert_eq!(counter.load(Ordering::SeqCst), 3); // Initial + 2 retries\n    }\n\n    #[tokio::test]\n    async fn test_rate_limit_uses_retry_after_duration() {\n        let counter = Arc::new(AtomicU32::new(0));\n        let counter_clone = counter.clone();\n        let start = std::time::Instant::now();\n\n        let result: Result\u003ci32, AgentError\u003e = with_retry(\n            1,\n            move || {\n                let counter = counter_clone.clone();\n                async move {\n                    let attempt = counter.fetch_add(1, Ordering::SeqCst);\n                    if attempt == 0 {\n                        Err(AgentError::RateLimited(Duration::from_millis(100)))\n                    } else {\n                        Ok(42)\n                    }\n                }\n            },\n            |_attempt, _max_retries, _retry_delay, _error| async {},\n        )\n        .await;\n\n        let elapsed = start.elapsed();\n        assert_eq!(result.unwrap(), 42);\n        // Should have waited at least 100ms (the retry-after duration)\n        assert!(\n            elapsed \u003e= Duration::from_millis(100),\n            \"Expected at least 100ms wait, got {:?}\",\n            elapsed\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_emits_tool_and_retry_events() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, used_todo) = TodoUsageHook::new(7, Some(event_tx));\n\n        hook.record_tool_call(\n            \"todo\",\n            Some(\"tool-call\".to_string()),\n            \"internal-1\",\n            \"{\\\"items\\\":[]}\",\n        )\n        .await;\n        hook.record_tool_result(\n            \"todo\",\n            Some(\"tool-call\".to_string()),\n            \"internal-1\",\n            \"{\\\"items\\\":[]}\",\n            \"\\\"updated\\\"\",\n        )\n        .await;\n        hook.emit_retry_scheduled(\n            1,\n            3,\n            Duration::from_millis(250),\n            \"temporary network issue\".to_string(),\n        )\n        .await;\n\n        assert!(used_todo.load(Ordering::SeqCst));\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallStarted {\n                turn_id: 7,\n                call_id: \"tool-call\".to_string(),\n                name: \"todo\".to_string(),\n                args_preview: \"{\\\"items\\\":[]}\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallFinished {\n                turn_id: 7,\n                call_id: \"tool-call\".to_string(),\n                name: \"todo\".to_string(),\n                result_preview: \"updated\".to_string(),\n                is_error: false,\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::TodoSnapshot {\n                turn_id: 7,\n                items: vec![],\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::RetryScheduled {\n                turn_id: 7,\n                attempt: 1,\n                max_retries: 3,\n                delay_ms: 250,\n                reason: \"temporary network issue\".to_string(),\n            })\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_falls_back_to_internal_call_ids() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, _used_todo) = TodoUsageHook::new(9, Some(event_tx));\n\n        hook.record_tool_call(\"read\", None, \"internal-call\", \"{\\\"path\\\":\\\"README.md\\\"}\")\n            .await;\n        hook.record_tool_result(\n            \"read\",\n            None,\n            \"internal-call\",\n            \"{\\\"path\\\":\\\"README.md\\\"}\",\n            \"\\\"contents\\\"\",\n        )\n        .await;\n\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallStarted {\n                turn_id: 9,\n                call_id: \"internal-call\".to_string(),\n                name: \"read\".to_string(),\n                args_preview: \"{\\\"path\\\":\\\"README.md\\\"}\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::ToolCallFinished {\n                turn_id: 9,\n                call_id: \"internal-call\".to_string(),\n                name: \"read\".to_string(),\n                result_preview: \"contents\".to_string(),\n                is_error: false,\n            })\n        );\n    }\n\n    #[tokio::test]\n    async fn hook_runtime_emits_turn_scoped_streaming_events() {\n        let (event_tx, mut event_rx) = frontend_event_channel(8);\n        let (hook, _used_todo) = TodoUsageHook::new(5, Some(event_tx));\n\n        hook.record_thinking(\"reasoning\".to_string()).await;\n        hook.record_text_delta(\"delta\").await;\n\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::Thinking {\n                turn_id: 5,\n                text: \"reasoning\".to_string(),\n            })\n        );\n        assert_eq!(\n            event_rx.recv().await,\n            Some(FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"delta\".to_string(),\n            })\n        );\n    }\n\n    #[test]\n    fn runtime_default_hook_uses_session_start_turn_id() {\n        let hook = TodoUsageHook::default();\n        assert_eq!(hook.turn_id, SESSION_START_TURN_ID);\n    }\n\n    /// Verify that the JSON encode/decode round-trip preserves newlines.\n    /// This mirrors what rig's ToolDyn::call does (serde_json::to_string)\n    /// and what record_tool_result does (serde_json::from_str::\u003cString\u003e).\n    #[test]\n    fn json_round_trip_preserves_multiline_content() {\n        let original = \"line 1\\nline 2\\nline 3\\nline 4\\nline 5\".to_string();\n        assert_eq!(original.lines().count(), 5, \"sanity check\");\n\n        // Simulate rig's ToolDyn::call: serde_json::to_string(\u0026output)\n        let encoded = serde_json::to_string(\u0026original).unwrap();\n        tracing::info!(\"Encoded: {:?}\", encoded);\n\n        // Simulate hook's record_tool_result: serde_json::from_str::\u003cString\u003e(result)\n        let decoded: String = serde_json::from_str(\u0026encoded).unwrap();\n        assert_eq!(decoded, original, \"round-trip should preserve content\");\n        assert_eq!(decoded.lines().count(), 5, \"lines should be preserved\");\n    }\n\n    /// Verify that if serde_json::from_str fails, the fallback produces a\n    /// single-line string (which would explain the \"Read 1 lines\" bug).\n    #[test]\n    fn json_fallback_preserves_raw_input_on_failure() {\n        let non_json = \"this is not json\".to_string();\n        let decoded =\n            serde_json::from_str::\u003cString\u003e(\u0026non_json).unwrap_or_else(|_| non_json.clone());\n        assert_eq!(decoded, \"this is not json\");\n\n        // Multi-line non-JSON: fallback preserves newlines\n        let multiline = \"line 1\\nline 2\\nline 3\".to_string();\n        let decoded =\n            serde_json::from_str::\u003cString\u003e(\u0026multiline).unwrap_or_else(|_| multiline.clone());\n        assert_eq!(decoded.lines().count(), 3);\n    }\n\n    #[test]\n    fn strip_error
