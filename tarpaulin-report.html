eded();\n        SPINNER_FRAMES[self.frame_index % SPINNER_FRAMES.len()]\n    }\n\n    /// Get current fun message\n    pub fn message(\u0026mut self) -\u003e \u0026'static str {\n        self.advance_if_needed();\n        FUN_MESSAGES[self.message_index % FUN_MESSAGES.len()]\n    }\n\n    /// Get combined spinner + message string\n    pub fn status_text(\u0026mut self) -\u003e String {\n        format!(\"{} {}\", self.frame(), self.message())\n    }\n\n    /// Reset spinner to initial state\n    pub fn reset(\u0026mut self) {\n        self.frame_index = 0;\n        self.message_index = 0;\n        self.last_update = Instant::now();\n    }\n\n    fn advance_if_needed(\u0026mut self) {\n        let now = Instant::now();\n        let elapsed = now.duration_since(self.last_update);\n\n        if elapsed.as_millis() \u003e= self.frame_interval_ms as u128 {\n            self.frame_index = self.frame_index.wrapping_add(1);\n        }\n\n        if elapsed.as_millis() \u003e= self.message_interval_ms as u128 {\n            self.message_index = self.message_index.wrapping_add(1);\n        }\n\n        // Reset timer if we've advanced\n        if elapsed.as_millis() \u003e= self.frame_interval_ms as u128 {\n            self.last_update = now;\n        }\n    }\n}\n\nimpl Default for Spinner {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn spinner_frames_cycle() {\n        let mut spinner = Spinner::new();\n        let frames: Vec\u003c_\u003e = (0..12).map(|_| spinner.frame()).collect();\n        // Should cycle through SPINNER_FRAMES twice\n        assert_eq!(frames.len(), 12);\n    }\n\n    #[test]\n    fn status_text_contains_frame_and_message() {\n        let mut spinner = Spinner::new();\n        let text = spinner.status_text();\n        // Should contain a frame character and a message\n        assert!(SPINNER_FRAMES.iter().any(|f| text.contains(f)));\n        assert!(FUN_MESSAGES.iter().any(|m| text.contains(m)));\n    }\n\n    #[test]\n    fn reset_clears_indices() {\n        let mut spinner = Spinner::new();\n        // Advance a bit\n        for _ in 0..10 {\n            spinner.frame();\n        }\n        spinner.reset();\n        // After reset, frame_index should be 0\n        assert_eq!(spinner.frame_index, 0);\n        assert_eq!(spinner.message_index, 0);\n    }\n}\n","traces":[{"line":28,"address":[],"length":0,"stats":{"Line":23}},{"line":32,"address":[],"length":0,"stats":{"Line":23}},{"line":39,"address":[],"length":0,"stats":{"Line":27}},{"line":40,"address":[],"length":0,"stats":{"Line":54}},{"line":41,"address":[],"length":0,"stats":{"Line":81}},{"line":45,"address":[],"length":0,"stats":{"Line":3}},{"line":46,"address":[],"length":0,"stats":{"Line":6}},{"line":47,"address":[],"length":0,"stats":{"Line":9}},{"line":51,"address":[],"length":0,"stats":{"Line":3}},{"line":52,"address":[],"length":0,"stats":{"Line":15}},{"line":56,"address":[],"length":0,"stats":{"Line":4}},{"line":57,"address":[],"length":0,"stats":{"Line":4}},{"line":58,"address":[],"length":0,"stats":{"Line":4}},{"line":59,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":30}},{"line":63,"address":[],"length":0,"stats":{"Line":60}},{"line":64,"address":[],"length":0,"stats":{"Line":120}},{"line":66,"address":[],"length":0,"stats":{"Line":60}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":60}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":60}},{"line":76,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[],"length":0,"stats":{"Line":0}}],"covered":20,"coverable":25},{"path":["/","Users","wangyue","workspace","codelder","harness","src","cli","terminal.rs"],"content":"use crossterm::event::{self, Event, KeyEvent, KeyEventKind};\nuse crossterm::terminal::{disable_raw_mode, enable_raw_mode};\nuse ratatui::backend::CrosstermBackend;\nuse ratatui::{Frame, Terminal, TerminalOptions, Viewport};\nuse std::io::{self, Stdout};\nuse std::sync::atomic::{AtomicBool, Ordering};\nuse std::sync::Arc;\nuse std::time::Duration;\nuse tokio::sync::mpsc;\nuse tokio::task::JoinHandle;\n\npub type CliTerminal = Terminal\u003cCrosstermBackend\u003cStdout\u003e\u003e;\n\n/// Minimum viewport height for composer + status.\nconst VIEWPORT_HEIGHT: u16 = 4;\n\n/// Calculate the baseline inline viewport height from terminal size.\n/// The session may expand this later when todo/tools need more room.\n/// Timeline content is printed directly to stdout and scrolls with the terminal.\npub fn calculate_inline_height(_terminal_height: u16) -\u003e u16 {\n    VIEWPORT_HEIGHT\n}\n\n/// Centralized terminal lifecycle guard for raw mode and inline viewport ownership.\npub struct TerminalGuard {\n    terminal: Option\u003cCliTerminal\u003e,\n    raw_mode_enabled: bool,\n    inline_height: u16,\n}\n\nimpl TerminalGuard {\n    pub fn new() -\u003e io::Result\u003cSelf\u003e {\n        let mut ops = SystemLifecycleOps;\n        let mut state = LifecycleState::default();\n        let terminal = initialize_terminal(\u0026mut ops, \u0026mut state)?;\n\n        Ok(Self {\n            terminal: Some(terminal),\n            raw_mode_enabled: state.raw_mode_enabled,\n            inline_height: state.inline_height,\n        })\n    }\n\n    pub fn draw\u003cF\u003e(\u0026mut self, render: F) -\u003e io::Result\u003c()\u003e\n    where\n        F: FnOnce(\u0026mut Frame),\n    {\n        if let Some(terminal) = self.terminal.as_mut() {\n            terminal.draw(render)?;\n        }\n        Ok(())\n    }\n\n    pub fn insert_before\u003cF\u003e(\u0026mut self, height: u16, render_fn: F) -\u003e io::Result\u003c()\u003e\n    where\n        F: FnOnce(\u0026mut ratatui::buffer::Buffer),\n    {\n        if let Some(terminal) = self.terminal.as_mut() {\n            terminal.insert_before(height, render_fn)?;\n        }\n        Ok(())\n    }\n\n    /// Handle terminal resize by recalculating inline height.\n    /// Returns true if viewport height changed.\n    pub fn handle_resize(\u0026mut self) -\u003e io::Result\u003cbool\u003e {\n        if let Some(terminal) = \u0026mut self.terminal {\n            // Inline/fullscreen viewports are auto-resized by ratatui 0.30+.\n            // Keep the current inline height; autoresize only reconciles width and\n            // the viewport's on-screen position with the terminal's new size.\n            terminal.autoresize()?;\n            return Ok(false);\n        }\n        Ok(false)\n    }\n\n    /// Dynamically adjust viewport height (e.g. to show executing tools).\n    /// Returns true if the height actually changed.\n    #[allow(dead_code)]\n    pub fn set_viewport_height(\u0026mut self, height: u16) -\u003e io::Result\u003cbool\u003e {\n        if height == self.inline_height {\n            tracing::trace!(\"set_viewport_height: unchanged at {}\", height);\n            return Ok(false);\n        }\n        let old_height = self.inline_height;\n        if let Some(mut terminal) = self.terminal.take() {\n            // `Viewport::Inline(height)` stores the height in the terminal itself.\n            // Calling `resize(Rect)` only resizes buffers; it does not mutate the\n            // inline viewport's configured height. Recreate the terminal instead.\n            terminal.clear()?;\n            drop(terminal);\n\n            self.inline_height = height;\n            let backend = CrosstermBackend::new(io::stdout());\n            let terminal = Terminal::with_options(\n                backend,\n                TerminalOptions {\n                    viewport: Viewport::Inline(height),\n                },\n            )?;\n            self.terminal = Some(terminal);\n            tracing::debug!(\"set_viewport_height: {} -\u003e {}\", old_height, height);\n            return Ok(true);\n        }\n        Ok(false)\n    }\n\n    /// Get the current viewport height.\n    #[allow(dead_code)]\n    pub fn viewport_height(\u0026self) -\u003e u16 {\n        self.inline_height\n    }\n\n    /// Get the terminal size (width, height).\n    pub fn size(\u0026self) -\u003e io::Result\u003c(u16, u16)\u003e {\n        if let Some(terminal) = \u0026self.terminal {\n            let size = terminal.size()?;\n            Ok((size.width, size.height))\n        } else {\n            Ok((80, 24)) // Default fallback\n        }\n    }\n\n    pub fn restore(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        let mut ops = SystemLifecycleOps;\n        let mut terminal = self.terminal.take();\n        let mut state = LifecycleState {\n            raw_mode_enabled: self.raw_mode_enabled,\n            inline_height: self.inline_height,\n        };\n        let result = restore_terminal(\u0026mut ops, terminal.as_mut(), \u0026mut state);\n\n        self.raw_mode_enabled = state.raw_mode_enabled;\n        self.inline_height = state.inline_height;\n\n        result\n    }\n}\n\nimpl Drop for TerminalGuard {\n    fn drop(\u0026mut self) {\n        let _ = self.restore();\n    }\n}\n\n/// Dedicated blocking input task that feeds crossterm key events into the async UI loop.\n/// Also passes through resize events for viewport reconfiguration.\npub fn spawn_input_listener(\n    stop_flag: Arc\u003cAtomicBool\u003e,\n) -\u003e (\n    JoinHandle\u003cResult\u003c(), String\u003e\u003e,\n    mpsc::UnboundedReceiver\u003cInputEvent\u003e,\n) {\n    let (tx, rx) = mpsc::unbounded_channel();\n\n    let handle = tokio::task::spawn_blocking(move || -\u003e Result\u003c(), String\u003e {\n        while !stop_flag.load(Ordering::SeqCst) {\n            if event::poll(Duration::from_millis(50)).map_err(|error| error.to_string())? {\n                match event::read().map_err(|error| error.to_string())? {\n                    Event::Key(key) =\u003e {\n                        // Accept Press and Release events to support terminals like Warp\n                        // that may send different key event kinds than iTerm2/Terminal.app\n                        if key.kind != KeyEventKind::Repeat\n                            \u0026\u0026 tx.send(InputEvent::Key(key)).is_err()\n                        {\n                            break;\n                        }\n                    }\n                    Event::Resize(columns, rows) =\u003e {\n                        if tx.send(InputEvent::Resize(columns, rows)).is_err() {\n                            break;\n                        }\n                    }\n                    _ =\u003e {}\n                }\n            }\n        }\n        Ok(())\n    });\n\n    (handle, rx)\n}\n\n/// Input events from the terminal.\n#[derive(Debug, Clone)]\npub enum InputEvent {\n    Key(KeyEvent),\n    Resize(u16, u16),\n}\n\n#[derive(Debug, Default, Clone, Copy, PartialEq, Eq)]\nstruct LifecycleState {\n    raw_mode_enabled: bool,\n    inline_height: u16,\n}\n\ntrait TerminalLifecycleOps {\n    type Terminal;\n\n    fn enable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e;\n    fn disable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e;\n    fn get_terminal_height(\u0026self) -\u003e io::Result\u003cu16\u003e;\n    fn create_inline_terminal(\u0026mut self, height: u16) -\u003e io::Result\u003cSelf::Terminal\u003e;\n    fn show_cursor(\u0026mut self, terminal: \u0026mut Self::Terminal) -\u003e io::Result\u003c()\u003e;\n}\n\nstruct SystemLifecycleOps;\n\nimpl TerminalLifecycleOps for SystemLifecycleOps {\n    type Terminal = CliTerminal;\n\n    fn enable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        enable_raw_mode()\n    }\n\n    fn disable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n        disable_raw_mode()\n    }\n\n    fn get_terminal_height(\u0026self) -\u003e io::Result\u003cu16\u003e {\n        let size = crossterm::terminal::size()?;\n        Ok(size.1)\n    }\n\n    fn create_inline_terminal(\u0026mut self, height: u16) -\u003e io::Result\u003cSelf::Terminal\u003e {\n        let backend = CrosstermBackend::new(io::stdout());\n        Terminal::with_options(\n            backend,\n            TerminalOptions {\n                viewport: Viewport::Inline(height),\n            },\n        )\n    }\n\n    fn show_cursor(\u0026mut self, terminal: \u0026mut Self::Terminal) -\u003e io::Result\u003c()\u003e {\n        terminal.show_cursor()\n    }\n}\n\nfn initialize_terminal\u003cOps: TerminalLifecycleOps\u003e(\n    ops: \u0026mut Ops,\n    state: \u0026mut LifecycleState,\n) -\u003e io::Result\u003cOps::Terminal\u003e {\n    ops.enable_raw_mode()?;\n    state.raw_mode_enabled = true;\n\n    // Calculate initial inline height\n    let height = calculate_inline_height(ops.get_terminal_height()?);\n    state.inline_height = height;\n\n    match ops.create_inline_terminal(height) {\n        Ok(terminal) =\u003e Ok(terminal),\n        Err(error) =\u003e {\n            let _ = rollback_terminal_setup(ops, state);\n            Err(error)\n        }\n    }\n}\n\nfn rollback_terminal_setup\u003cOps: TerminalLifecycleOps\u003e(\n    ops: \u0026mut Ops,\n    state: \u0026mut LifecycleState,\n) -\u003e io::Result\u003c()\u003e {\n    restore_terminal::\u003cOps\u003e(ops, None, state)\n}\n\nfn restore_terminal\u003cOps: TerminalLifecycleOps\u003e(\n    ops: \u0026mut Ops,\n    mut terminal: Option\u003c\u0026mut Ops::Terminal\u003e,\n    state: \u0026mut LifecycleState,\n) -\u003e io::Result\u003c()\u003e {\n    let mut first_error = None;\n\n    if let Some(active_terminal) = terminal.as_deref_mut() {\n        capture_cleanup_error(ops.show_cursor(active_terminal), \u0026mut first_error);\n    }\n\n    if state.raw_mode_enabled {\n        capture_cleanup_error(ops.disable_raw_mode(), \u0026mut first_error);\n        state.raw_mode_enabled = false;\n    }\n\n    // Reset inline_height on cleanup\n    state.inline_height = 0;\n\n    if let Some(error) = first_error {\n        Err(error)\n    } else {\n        Ok(())\n    }\n}\n\nfn capture_cleanup_error(result: io::Result\u003c()\u003e, first_error: \u0026mut Option\u003cio::Error\u003e) {\n    if let Err(error) = result {\n        if first_error.is_none() {\n            *first_error = Some(error);\n        }\n    }\n}\n\n#[cfg(test)]\npub(crate) mod tests {\n    use super::*;\n    use std::panic::{self, AssertUnwindSafe};\n    use std::sync::{Arc, Mutex};\n\n    #[allow(dead_code)]\n    #[derive(Debug, Clone, Copy, PartialEq, Eq)]\n    pub(crate) enum RestoreScenario {\n        CleanExit,\n        RuntimeError,\n    }\n\n    #[derive(Debug)]\n    struct MockTerminal;\n\n    #[derive(Debug, Clone)]\n    struct MockLifecycleOps {\n        log: Arc\u003cMutex\u003cVec\u003c\u0026'static str\u003e\u003e\u003e,\n        fail_step: Option\u003c\u0026'static str\u003e,\n        terminal_height: u16,\n    }\n\n    impl MockLifecycleOps {\n        fn new(log: Arc\u003cMutex\u003cVec\u003c\u0026'static str\u003e\u003e\u003e, fail_step: Option\u003c\u0026'static str\u003e) -\u003e Self {\n            Self {\n                log,\n                fail_step,\n                terminal_height: 24, // Default terminal height for tests\n            }\n        }\n\n        fn push(\u0026self, step: \u0026'static str) {\n            self.log.lock().expect(\"log should lock\").push(step);\n        }\n\n        fn maybe_fail(\u0026self, step: \u0026'static str) -\u003e io::Result\u003c()\u003e {\n            self.push(step);\n            if self.fail_step == Some(step) {\n                Err(io::Error::other(format!(\"mock {step} failure\")))\n            } else {\n                Ok(())\n            }\n        }\n    }\n\n    impl TerminalLifecycleOps for MockLifecycleOps {\n        type Terminal = MockTerminal;\n\n        fn enable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            self.maybe_fail(\"enable_raw_mode\")\n        }\n\n        fn disable_raw_mode(\u0026mut self) -\u003e io::Result\u003c()\u003e {\n            self.maybe_fail(\"disable_raw_mode\")\n        }\n\n        fn get_terminal_height(\u0026self) -\u003e io::Result\u003cu16\u003e {\n            Ok(self.terminal_height)\n        }\n\n        fn create_inline_terminal(\u0026mut self, height: u16) -\u003e io::Result\u003cSelf::Terminal\u003e {\n            self.push(\"create_inline_terminal\");\n            // Check if we should fail BEFORE pushing height (to match test expectations)\n            if self.fail_step == Some(\"create_inline_terminal\") {\n                return Err(io::Error::other(\"mock create_inline_terminal failure\"));\n            }\n            // Use Box::leak to get 'static lifetime for the formatted string\n            let height_str = Box::leak(format!(\"height_{}\", height).into_boxed_str());\n            self.push(height_str);\n            Ok(MockTerminal)\n        }\n\n        fn show_cursor(\u0026mut self, _terminal: \u0026mut Self::Terminal) -\u003e io::Result\u003c()\u003e {\n            self.maybe_fail(\"show_cursor\")\n        }\n    }\n\n    struct PanicRestoreGuard {\n        ops: MockLifecycleOps,\n        terminal: Option\u003cMockTerminal\u003e,\n        state: LifecycleState,\n    }\n\n    impl Drop for PanicRestoreGuard {\n        fn drop(\u0026mut self) {\n            let _ = restore_terminal(\u0026mut self.ops, self.terminal.as_mut(), \u0026mut self.state);\n            self.terminal = None;\n        }\n    }\n\n    #[allow(dead_code)]\n    pub(crate) fn terminal_restore_smoke(\n        scenario: RestoreScenario,\n    ) -\u003e io::Result\u003cVec\u003c\u0026'static str\u003e\u003e {\n        let log = Arc::new(Mutex::new(Vec::new()));\n        let mut ops = MockLifecycleOps::new(log.clone(), None);\n        let mut state = LifecycleState::default();\n        let mut terminal = initialize_terminal(\u0026mut ops, \u0026mut state)?;\n\n        match scenario {\n            RestoreScenario::CleanExit =\u003e {}\n            RestoreScenario::RuntimeError =\u003e ops.push(\"runtime_error\"),\n        }\n\n        restore_terminal(\u0026mut ops, Some(\u0026mut terminal), \u0026mut state)?;\n        let entries = log.lock().expect(\"log should lock\").clone();\n        Ok(entries)\n    }\n\n    #[test]\n    fn restore_is_idempotent_without_active_terminal() {\n        let mut guard = TerminalGuard {\n            terminal: None,\n            raw_mode_enabled: false,\n            inline_height: 0,\n        };\n        assert!(guard.restore().is_ok());\n        assert!(guard.restore().is_ok());\n    }\n\n    #[test]\n    fn constructor_rollback_restores_raw_mode_if_terminal_creation_fails() {\n        let log = Arc::new(Mutex::new(Vec::new()));\n        let mut ops = MockLifecycleOps::new(log.clone(), Some(\"create_inline_terminal\"));\n        let mut state = LifecycleState::default();\n\n        let error = initialize_terminal(\u0026mut ops, \u0026mut state).expect_err(\"init should fail\");\n\n        assert!(error.to_string().contains(\"create_inline_terminal\"));\n        assert_eq!(\n            log.lock().expect(\"log should lock\").clone(),\n            vec![\n                \"enable_raw_mode\",\n                \"create_inline_terminal\",\n                \"disable_raw_mode\",\n            ]\n        );\n        assert_eq!(state, LifecycleState::default());\n    }\n\n    #[test]\n    fn panic_path_restore_cleans_up_terminal_state() {\n        let log = Arc::new(Mutex::new(Vec::new()));\n        let result = panic::catch_unwind(AssertUnwindSafe({\n            let log = log.clone();\n            move || {\n                let mut ops = MockLifecycleOps::new(log, None);\n                let mut state = LifecycleState::default();\n                let terminal =\n                    initialize_terminal(\u0026mut ops, \u0026mut state).expect(\"init should succeed\");\n                let _guard = PanicRestoreGuard {\n                    ops,\n                    terminal: Some(terminal),\n                    state,\n                };\n\n                panic!(\"simulate panic\");\n            }\n        }));\n\n        assert!(result.is_err());\n        assert_eq!(\n            log.lock().expect(\"log should lock\").clone(),\n            vec![\n                \"enable_raw_mode\",\n                \"create_inline_terminal\",\n                \"height_4\", // Minimum viewport height\n                \"show_cursor\",\n                \"disable_raw_mode\",\n            ]\n        );\n    }\n\n    #[test]\n    fn calculate_inline_height_returns_minimum_viewport() {\n        assert_eq!(calculate_inline_height(5), 4);\n        assert_eq!(calculate_inline_height(20), 4);\n        assert_eq!(calculate_inline_height(100), 4);\n    }\n}\n","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":5}},{"line":21,"address":[],"length":0,"stats":{"Line":5}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72 Tool indicator dot style (green)\n    pub tool_indicator: Style,\n    /// Tool indicator dot style while executing (gray blink)\n    pub tool_executing_indicator: Style,\n    /// Tool result highlight style (bold)\n    pub tool_result_highlight: Style,\n    /// Error style (red)\n    pub error: Style,\n    /// Status/reminder style (blue)\n    pub status: Style,\n    /// Banner style (bold)\n    pub banner: Style,\n    /// Composer style (bold)\n    pub composer: Style,\n    /// Footer/todo style\n    pub footer: Style,\n}\n\nimpl CliTheme {\n    pub fn new() -\u003e Self {\n        let mode = detect_terminal_theme();\n        Self::from_mode(mode)\n    }\n\n    fn from_mode(mode: ThemeMode) -\u003e Self {\n        match mode {\n            ThemeMode::Dark =\u003e Self::dark_theme(),\n            ThemeMode::Light =\u003e Self::light_theme(),\n        }\n    }\n\n    fn dark_theme() -\u003e Self {\n        Self {\n            user: Style::default()\n                .fg(Color::Cyan)\n                .add_modifier(Modifier::BOLD),\n            assistant: Style::default().fg(Color::Green),\n            thinking: Style::default()\n                .fg(Color::Rgb(110, 110, 110))\n                .add_modifier(Modifier::ITALIC),\n            tool: Style::default()\n                .fg(Color::Rgb(130, 170, 240))\n                .add_modifier(Modifier::BOLD),\n            tool_result: Style::default(),\n            tool_indicator: Style::default().fg(Color::Green),\n            tool_executing_indicator: Style::default()\n                .fg(Color::Rgb(160, 160, 160))\n                .add_modifier(Modifier::SLOW_BLINK),\n            tool_result_highlight: Style::default().add_modifier(Modifier::BOLD),\n            error: Style::default().fg(Color::Red).add_modifier(Modifier::BOLD),\n            status: Style::default().fg(Color::Blue),\n            banner: Style::default().add_modifier(Modifier::BOLD),\n            composer: Style::default().add_modifier(Modifier::BOLD),\n            footer: Style::default().fg(Color::Magenta),\n        }\n    }\n\n    fn light_theme() -\u003e Self {\n        Self {\n            user: Style::default()\n                .fg(Color::Cyan)\n                .add_modifier(Modifier::BOLD),\n            assistant: Style::default().fg(Color::Rgb(0, 100, 0)),\n            // Darker gray for light backgrounds\n            thinking: Style::default()\n                .fg(Color::Rgb(90, 90, 90))\n                .add_modifier(Modifier::ITALIC),\n            // Dark blue for light backgrounds — uses RGB to bypass ANSI color palette remapping\n            tool: Style::default()\n                .fg(Color::Rgb(20, 50, 120))\n                .add_modifier(Modifier::BOLD),\n            tool_result: Style::default().fg(Color::Rgb(60, 60, 60)),\n            tool_indicator: Style::default().fg(Color::Rgb(0, 128, 0)),\n            tool_executing_indicator: Style::default()\n                .fg(Color::Rgb(120, 120, 120))\n                .add_modifier(Modifier::SLOW_BLINK),\n            tool_result_highlight: Style::default()\n                .fg(Color::Black)\n                .add_modifier(Modifier::BOLD),\n            error: Style::default().fg(Color::Red).add_modifier(Modifier::BOLD),\n            status: Style::default().fg(Color::Rgb(0, 0, 180)),\n            banner: Style::default()\n                .fg(Color::Black)\n                .add_modifier(Modifier::BOLD),\n            composer: Style::default()\n                .fg(Color::Black)\n                .add_modifier(Modifier::BOLD),\n            footer: Style::default().fg(Color::Rgb(128, 0, 128)),\n        }\n    }\n}\n\nimpl Default for CliTheme {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n// ---------------------------------------------------------------------------\n// Terminal theme detection\n// ---------------------------------------------------------------------------\n\n/// Detect whether the terminal has a light or dark background.\n///\n/// Strategy (in order):\n/// 1. `COLORFGBG` environment variable (cheap, supported by xterm/kitty/alacritty)\n/// 2. OSC 11 query (send escape sequence, parse RGB response)\n/// 3. Fallback to `Dark`\nfn detect_terminal_theme() -\u003e ThemeMode {\n    if let Some(mode) = detect_from_colorfgbg() {\n        return mode;\n    }\n    if let Some(mode) = detect_from_osc11() {\n        return mode;\n    }\n    ThemeMode::Dark\n}\n\n/// Parse `COLORFGBG` env var. Format: `\"fg;bg\"` with xterm color indices.\n/// Background index 0-7 → dark, 8-15 → light.\nfn detect_from_colorfgbg() -\u003e Option\u003cThemeMode\u003e {\n    let val = std::env::var(\"COLORFGBG\").ok()?;\n    let bg = val.split(';').next_back()?.parse::\u003cu8\u003e().ok()?;\n    Some(if bg \u003c= 7 {\n        ThemeMode::Dark\n    } else {\n        ThemeMode::Light\n    })\n}\n\n/// Query the terminal background color via OSC 11 and classify.\nfn detect_from_osc11() -\u003e Option\u003cThemeMode\u003e {\n    let (r, g, b) = query_osc11_background()?;\n    let luminance = 0.299 * r as f32 + 0.587 * g as f32 + 0.114 * b as f32;\n    Some(if luminance \u003e 128.0 {\n        ThemeMode::Light\n    } else {\n        ThemeMode::Dark\n    })\n}\n\n/// Send OSC 11 query and parse the RGB response.\n///\n/// Response format: `\\x1b]11;rgb:RRRR/GGGG/BBBB\\x1b\\\\` (or 2-digit hex per channel)\n/// Uses a 100ms timeout; returns `None` on any failure.\nfn query_osc11_background() -\u003e Option\u003c(u8, u8, u8)\u003e {\n    let mut stdout_lock = io::stdout().lock();\n    stdout_lock.write_all(b\"\\x1b]11;?\\x07\").ok()?;\n    stdout_lock.flush().ok()?;\n\n    // Spawn a reader thread; wait with timeout so we don't block if terminal ignores OSC 11.\n    let handle = std::thread::spawn(|| {\n        let mut buf = [0u8; 64];\n        let mut pos = 0;\n        let mut stdin_lock = io::stdin().lock();\n\n        loop {\n            if pos \u003e= buf.len() {\n                return None;\n            }\n            match stdin_lock.read(\u0026mut buf[pos..=pos]) {\n                Ok(0) =\u003e return None,\n                Ok(_) =\u003e {\n                    pos += 1;\n                    if buf[pos - 1] == 0x07 {\n                        break;\n                    }\n                    if pos \u003e= 2 \u0026\u0026 buf[pos - 2] == 0x1b \u0026\u0026 buf[pos - 1] == b'\\\\' {\n                        break;\n                    }\n                }\n                Err(_) =\u003e return None,\n            }\n        }\n        parse_osc11_rgb(\u0026buf[..pos])\n    });\n\n    // Timeout: if the terminal doesn't support OSC 11 we don't hang.\n    match handle.join() {\n        Ok(result) =\u003e result,\n        Err(_) =\u003e None,\n    }\n}\n\n/// Parse OSC 11 response bytes into (R, G, B).\n///\n/// Expected: `\\x1b]11;rgb:XXXX/GGGG/BBBB\u003cBEL|ST\u003e`\nfn parse_osc11_rgb(data: \u0026[u8]) -\u003e Option\u003c(u8, u8, u8)\u003e {\n    let s = std::str::from_utf8(data).ok()?;\n    let start = s.find(\"rgb:\")?;\n    let rgb_part = \u0026s[start + 4..];\n    let rgb_part = rgb_part.trim_end_matches('\\x07');\n    let rgb_part = rgb_part\n        .strip_suffix(\"\\x1b\\\\\")\n        .unwrap_or(rgb_part)\n        .strip_suffix('\\\\')\n        .unwrap_or(rgb_part);\n\n    let components: Vec\u003c\u0026str\u003e = rgb_part.split('/').collect();\n    if components.len() != 3 {\n        return None;\n    }\n\n    let parse_hex = |hex: \u0026str| -\u003e Option\u003cu8\u003e {\n        let hex = hex.trim();\n        if hex.len() \u003e= 4 {\n            u8::from_str_radix(\u0026hex[..2], 16).ok()\n        } else if hex.len() \u003e= 2 {\n            u8::from_str_radix(hex, 16).ok()\n        } else {\n            None\n        }\n    };\n\n    Some((\n        parse_hex(components[0])?,\n        parse_hex(components[1])?,\n        parse_hex(components[2])?,\n    ))\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn parse_osc11_rgb_2digit() {\n        let response = b\"\\x1b]11;rgb:1e/1e/2e\\x07\";\n        let (r, g, b) = parse_osc11_rgb(response).unwrap();\n        assert_eq!(r, 0x1e);\n        assert_eq!(g, 0x1e);\n        assert_eq!(b, 0x2e);\n    }\n\n    #[test]\n    fn parse_osc11_rgb_4digit() {\n        let response = b\"\\x1b]11;rgb:1e1e/2e2e/3e3e\\x07\";\n        let (r, g, b) = parse_osc11_rgb(response).unwrap();\n        assert_eq!(r, 0x1e);\n        assert_eq!(g, 0x2e);\n        assert_eq!(b, 0x3e);\n    }\n\n    #[test]\n    fn parse_osc11_rgb_st_terminator() {\n        let response = b\"\\x1b]11;rgb:ff/ff/ff\\x1b\\\\\";\n        let (r, g, b) = parse_osc11_rgb(response).unwrap();\n        assert_eq!(r, 0xff);\n        assert_eq!(g, 0xff);\n        assert_eq!(b, 0xff);\n    }\n\n    #[test]\n    fn parse_osc11_rgb_invalid_returns_none() {\n        assert!(parse_osc11_rgb(b\"garbage\").is_none());\n        assert!(parse_osc11_rgb(b\"\\x1b]11;rgb:bad\").is_none());\n    }\n\n    #[test]\n    fn parse_colorfgbg_values() {\n        // Direct parsing tests — avoid env-var mutation in multi-threaded tests\n        let parse_bg = |val: \u0026str| -\u003e Option\u003cu8\u003e { val.split(';').next_back()?.parse::\u003cu8\u003e().ok() };\n\n        assert_eq!(parse_bg(\"15;0\"), Some(0)); // dark bg\n        assert_eq!(parse_bg(\"0;15\"), Some(15)); // light bg\n        assert_eq!(parse_bg(\"7;8\"), Some(8));\n        assert_eq!(parse_bg(\"garbage\"), None);\n    }\n\n    #[test]\n    fn dark_theme_colors() {\n        let theme = CliTheme::dark_theme();\n        assert_eq!(theme.thinking.fg, Some(Color::Rgb(110, 110, 110)));\n        assert_eq!(theme.tool.fg, Some(Color::Rgb(130, 170, 240)));\n    }\n\n    #[test]\n    fn light_theme_colors() {\n        let theme = CliTheme::light_theme();\n        assert_eq!(theme.thinking.fg, Some(Color::Rgb(90, 90, 90)));\n        assert_eq!(theme.tool.fg, Some(Color::Rgb(20, 50, 120)));\n    }\n\n    #[test]\n    fn luminance_classification() {\n        let lum = 0.299 * 255.0 + 0.587 * 255.0 + 0.114 * 255.0;\n        assert!(lum \u003e 128.0);\n\n        let lum = 0.299 * 30.0 + 0.587 * 30.0 + 0.114 * 46.0;\n        assert!(lum \u003c= 128.0);\n    }\n}\n","traces":[{"line":42,"address":[],"length":0,"stats":{"Line":20}},{"line":43,"address":[],"length":0,"stats":{"Line":40}},{"line":44,"address":[],"length":0,"stats":{"Line":40}},{"line":47,"address":[],"length":0,"stats":{"Line":20}},{"line":48,"address":[],"length":0,"stats":{"Line":20}},{"line":49,"address":[],"length":0,"stats":{"Line":20}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":21}},{"line":56,"address":[],"length":0,"stats":{"Line":42}},{"line":59,"address":[],"length":0,"stats":{"Line":84}},{"line":60,"address":[],"length":0,"stats":{"Line":42}},{"line":63,"address":[],"length":0,"stats":{"Line":42}},{"line":66,"address":[],"length":0,"stats":{"Line":42}},{"line":67,"address":[],"length":0,"stats":{"Line":84}},{"line":68,"address":[],"length":0,"stats":{"Line":42}},{"line":71,"address":[],"length":0,"stats":{"Line":63}},{"line":72,"address":[],"length":0,"stats":{"Line":105}},{"line":73,"address":[],"length":0,"stats":{"Line":84}},{"line":74,"address":[],"length":0,"stats":{"Line":63}},{"line":75,"address":[],"length":0,"stats":{"Line":63}},{"line":76,"address":[],"length":0,"stats":{"Line":42}},{"line":80,"address":[],"length":0,"stats":{"Line":1}},{"line":82,"address":[],"length":0,"stats":{"Line":2}},{"line":85,"address":[],"length":0,"stats":{"Line":4}},{"line":87,"address":[],"length":0,"stats":{"Line":2}},{"line":91,"address":[],"length":0,"stats":{"Line":2}},{"line":94,"address":[],"length":0,"stats":{"Line":4}},{"line":95,"address":[],"length":0,"stats":{"Line":4}},{"line":96,"address":[],"length":0,"stats":{"Line":2}},{"line":99,"address":[],"length":0,"stats":{"Line":2}},{"line":102,"address":[],"length":0,"stats":{"Line":5}},{"line":103,"address":[],"length":0,"stats":{"Line":4}},{"line":104,"addre n\n/// Default retry delay for rate limiting\nconst DEFAULT_RETRY_DELAY: Duration = Duration::from_secs(60);\n\n/// Errors that can occur during agent execution\n#[derive(Debug, Error)]\npub enum AgentError {\n    #[error(\"Network error: {0}\")]\n    Network(String),\n\n    #[error(\"Rate limited: retry after {0:?}\")]\n    RateLimited(Duration),\n\n    #[error(\"Authentication failed: {0}\")]\n    Auth(String),\n\n    #[error(\"Invalid request: {0}\")]\n    InvalidRequest(String),\n\n    #[error(\"Context limit exceeded\")]\n    ContextLimit,\n\n    #[error(\"Tools not implemented (Phase 2)\")]\n    ToolsNotImplemented,\n\n    #[error(\"Provider error: {0}\")]\n    Provider(#[from] ProviderError),\n}\n\nimpl AgentError {\n    /// Returns true if this error is retryable with exponential backoff\n    pub fn is_retryable(\u0026self) -\u003e bool {\n        matches!(self, AgentError::Network(_) | AgentError::RateLimited(_))\n    }\n\n    /// Returns true if this error indicates context limit was reached\n    pub fn is_context_limit(\u0026self) -\u003e bool {\n        matches!(self, AgentError::ContextLimit)\n    }\n}\n\n/// Errors specific to LLM provider operations\n#[derive(Debug, Error)]\npub enum ProviderError {\n    #[error(\"Unknown provider: {0}\")]\n    UnknownProvider(String),\n\n    #[error(\"Missing API key for {0}\")]\n    MissingApiKey(String),\n\n    #[error(\"Provider request failed: {0}\")]\n    RequestFailed(String),\n\n    #[error(\"Invalid model: {0}\")]\n    InvalidModel(String),\n}\n\n/// Standalone function to check if any error is retryable\npub fn is_retryable(error: \u0026AgentError) -\u003e bool {\n    error.is_retryable()\n}\n\n/// Classify a rig PromptError into an appropriate AgentError\n///\n/// This function inspects the structured error from rig-core and maps it\n/// to the appropriate AgentError variant based on:\n/// - HTTP status codes (429 -\u003e RateLimited, 401/403 -\u003e Auth, etc.)\n/// - Error types (network timeouts -\u003e Network)\n/// - Response content (rate limit messages, context limits, etc.)\n///\n/// # Arguments\n/// * `err` - The PromptError from rig-core\n///\n/// # Returns\n/// An appropriately classified AgentError\npub fn classify_prompt_error(err: PromptError) -\u003e AgentError {\n    match err {\n        PromptError::CompletionError(completion_err) =\u003e classify_completion_error(completion_err),\n        PromptError::ToolError(e) =\u003e {\n            AgentError::Provider(ProviderError::RequestFailed(format!(\"Tool error: {}\", e)))\n        }\n        PromptError::ToolServerError(e) =\u003e AgentError::Provider(ProviderError::RequestFailed(\n            format!(\"Tool server error: {}\", e),\n        )),\n        PromptError::MaxTurnsError { max_turns, .. } =\u003e AgentError::Provider(\n            ProviderError::RequestFailed(format!(\"Max turns exceeded: {}\", max_turns)),\n        ),\n        PromptError::PromptCancelled { reason, .. } =\u003e AgentError::Provider(\n            ProviderError::RequestFailed(format!(\"Prompt cancelled: {}\", reason)),\n        ),\n    }\n}\n\n/// Classify a CompletionError from rig-core\nfn classify_completion_error(err: CompletionError) -\u003e AgentError {\n    match err {\n        CompletionError::HttpError(http_err) =\u003e classify_http_error(http_err),\n        CompletionError::ProviderError(msg) =\u003e {\n            // Provider errors might contain useful info in the message\n            classify_provider_message(\u0026msg)\n                .unwrap_or(AgentError::Provider(ProviderError::RequestFailed(msg)))\n        }\n        CompletionError::ResponseError(msg) =\u003e {\n            // Response errors from API (e.g., Anthropic error response)\n            classify_response_message(\u0026msg)\n                .unwrap_or(AgentError::Provider(ProviderError::RequestFailed(msg)))\n        }\n        CompletionError::RequestError(e) =\u003e {\n            AgentError::Provider(ProviderError::RequestFailed(e.to_string()))\n        }\n        CompletionError::JsonError(e) =\u003e AgentError::InvalidRequest(format!(\"JSON error: {}\", e)),\n        CompletionError::UrlError(e) =\u003e AgentError::InvalidRequest(format!(\"URL error: {}\", e)),\n    }\n}\n\n/// Classify an HTTP error from rig-core's http_client\nfn classify_http_error(err: HttpError) -\u003e AgentError {\n    match err {\n        HttpError::InvalidStatusCodeWithMessage(status, body) =\u003e {\n            classify_status_code(status, \u0026body)\n        }\n        HttpError::Instance(e) =\u003e {\n            // Underlying reqwest error (timeout, connection failed, etc.)\n            AgentError::Network(e.to_string())\n        }\n        HttpError::Protocol(e) =\u003e AgentError::Network(format!(\"HTTP protocol error: {}\", e)),\n        _ =\u003e AgentError::Network(err.to_string()),\n    }\n}\n\n/// Classify based on HTTP status code\nfn classify_status_code(status: StatusCode, body: \u0026str) -\u003e AgentError {\n    match status {\n        // 408 Request Timeout - retryable\n        StatusCode::REQUEST_TIMEOUT =\u003e AgentError::Network(format!(\n            \"Request timeout (408): {}\",\n            truncate_error_body(body)\n        )),\n\n        // 429 Too Many Requests - retryable with backoff\n        StatusCode::TOO_MANY_REQUESTS =\u003e {\n            let retry_after = extract_retry_after(body).unwrap_or(DEFAULT_RETRY_DELAY);\n            AgentError::RateLimited(retry_after)\n        }\n\n        // 500 Internal Server Error - retryable\n        StatusCode::INTERNAL_SERVER_ERROR =\u003e {\n            AgentError::Network(format!(\"Server error (500): {}\", truncate_error_body(body)))\n        }\n\n        // 502 Bad Gateway - retryable\n        StatusCode::BAD_GATEWAY =\u003e {\n            AgentError::Network(format!(\"Bad gateway (502): {}\", truncate_error_body(body)))\n        }\n\n        // 503 Service Unavailable - retryable\n        StatusCode::SERVICE_UNAVAILABLE =\u003e AgentError::Network(format!(\n            \"Service unavailable (503): {}\",\n            truncate_error_body(body)\n        )),\n\n        // 504 Gateway Timeout - retryable\n        StatusCode::GATEWAY_TIMEOUT =\u003e AgentError::Network(format!(\n            \"Gateway timeout (504): {}\",\n            truncate_error_body(body)\n        )),\n\n        // 401 Unauthorized - not retryable\n        StatusCode::UNAUTHORIZED =\u003e {\n            AgentError::Auth(format!(\"Unauthorized (401): {}\", truncate_error_body(body)))\n        }\n\n        // 403 Forbidden - not retryable\n        StatusCode::FORBIDDEN =\u003e {\n            AgentError::Auth(format!(\"Forbidden (403): {}\", truncate_error_body(body)))\n        }\n\n        // 400 Bad Request - check for context limit first\n        StatusCode::BAD_REQUEST =\u003e {\n            // Many providers report context/token limit as 400 with specific message\n            if let Some(classified) = classify_context_limit(body) {\n                classified\n            } else {\n                AgentError::InvalidRequest(format!(\n                    \"Bad request (400): {}\",\n                    truncate_error_body(body)\n                ))\n            }\n        }\n\n        // 404 Not Found - not retryable\n        StatusCode::NOT_FOUND =\u003e {\n            AgentError::InvalidRequest(format!(\"Not found (404): {}\", truncate_error_body(body)))\n        }\n\n        // 413 Payload Too Large - context limit\n        StatusCode::PAYLOAD_TOO_LARGE =\u003e AgentError::ContextLimit,\n\n        // Other client errors (4xx) - not retryable\n        code if code.is_client_error() =\u003e AgentError::Provider(ProviderError::RequestFailed(\n            format!(\"Client error ({}): {}\", code, truncate_error_body(body)),\n        )),\n\n        // Other server errors (5xx) - retryable\n        code if code.is_server_error() =\u003e AgentError::Network(format!(\n            \"Server error ({}): {}\",\n            code,\n            truncate_error_body(body)\n        )),\n\n        // Unknown status codes\n        _ =\u003e AgentError::Provider(ProviderError::RequestFailed(format!(\n            \"HTTP {}: {}\",\n            status,\n            truncate_error_body(body)\n        ))),\n    }\n}\n\n/// Check if an error string indicates a context limit (for 400 responses)\nfn classify_context_limit(body: \u0026str) -\u003e Option\u003cAgentError\u003e {\n    let lower = body.to_lowercase();\n\n    // Common context limit indicators in provider error messages\n    if lower.contains(\"context_length_exceeded\")\n        || lower.contains(\"context length\")\n        || lower.contains(\"token limit\")\n        || lower.contains(\"maximum context\")\n        || lower.contains(\"prompt is too long\")\n        || lower.contains(\"max_tokens\")\n        || lower.contains(\"input length\")\n    {\n        return Some(AgentError::ContextLimit);\n    }\n\n    None\n}\n\n/// Check if an error string indicates a timeout\n#[cfg(test)]\nfn is_timeout_error(err_str: \u0026str) -\u003e bool {\n    let lower = err_str.to_lowercase();\n    lower.contains(\"timeout\") || lower.contains(\"timed out\")\n}\n\n/// Try to classify based on provider error message content\nfn classify_provider_message(msg: \u0026str) -\u003e Option\u003cAgentError\u003e {\n    let lower = msg.to_lowercase();\n\n    // Check for rate limit indicators\n    if lower.contains(\"rate limit\") || lower.contains(\"too many requests\") || lower.contains(\"429\")\n    {\n        return Some(AgentError::RateLimited(DEFAULT_RETRY_DELAY));\n    }\n\n    // Check for context limit indicators\n    if lower.contains(\"context length\")\n        || lower.contains(\"token limit\")\n        || lower.contains(\"maximum context\")\n        || lower.contains(\"prompt is too long\")\n    {\n        return Some(AgentError::ContextLimit);\n    }\n\n    // Check for auth indicators\n    if lower.contains(\"invalid api key\")\n        || lower.contains(\"unauthorized\")\n        || lower.contains(\"authentication\")\n    {\n        return Some(AgentError::Auth(msg.to_string()));\n    }\n\n    None\n}\n\n/// Try to classify based on API response message content\nfn classify_response_message(msg: \u0026str) -\u003e Option\u003cAgentError\u003e {\n    let lower = msg.to_lowercase();\n\n    // Anthropic-specific error types\n    if lower.contains(\"rate_limit_error\") || lower.contains(\"overloaded_error\") {\n        return Some(AgentError::RateLimited(DEFAULT_RETRY_DELAY));\n    }\n\n    if lower.contains(\"context_length_exceeded\") {\n        return Some(AgentError::ContextLimit);\n    }\n\n    if lower.contains(\"authentication_error\") || lower.contains(\"permission_error\") {\n        return Some(AgentError::Auth(msg.to_string()));\n    }\n\n    if lower.contains(\"invalid_request_error\") {\n        return Some(AgentError::InvalidRequest(msg.to_string()));\n    }\n\n    // Generic patterns\n    classify_provider_message(msg)\n}\n\n/// Extract retry-after duration from error response body\nfn extract_retry_after(body: \u0026str) -\u003e Option\u003cDuration\u003e {\n    // Try to parse JSON for retry_after field\n    if let Ok(json) = serde_json::from_str::\u003cserde_json::Value\u003e(body) {\n        // Check nested error.retry_after: {\"error\": {\"retry_after\": 60}}\n        if let Some(seconds) = json\n            .get(\"error\")\n            .and_then(|e| e.get(\"retry_after\"))\n            .and_then(|v| v.as_u64())\n        {\n            return Some(Duration::from_secs(seconds));\n        }\n        // Check top-level retry_after: {\"retry_after\": 30}\n        if let Some(seconds) = json.get(\"retry_after\").and_then(|v| v.as_u64()) {\n            return Some(Duration::from_secs(seconds));\n        }\n    }\n\n    // Try to find seconds in plain text\n    let lower = body.to_lowercase();\n    if lower.contains(\"retry after\") {\n        // Try to extract number\n        for part in lower.split(\"retry after\") {\n            if let Some(seconds) = extract_number_from_string(part) {\n                return Some(Duration::from_secs(seconds));\n            }\n        }\n    }\n\n    None\n}\n\n/// Extract first number from a string\nfn extract_number_from_string(s: \u0026str) -\u003e Option\u003cu64\u003e {\n    s.chars()\n        .skip_while(|c| !c.is_ascii_digit())\n        .take_while(|c| c.is_ascii_digit())\n        .collect::\u003cString\u003e()\n        .parse()\n        .ok()\n}\n\n/// Truncate error body for display (UTF-8 safe)\nfn truncate_error_body(body: \u0026str) -\u003e \u0026str {\n    // Limit to first 200 chars for readability, using character boundaries\n    match body.char_indices().nth(200) {\n        Some((idx, _)) =\u003e \u0026body[..idx],\n        None =\u003e body,\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use http::StatusCode;\n    use std::time::Duration;\n\n    #[test]\n    fn test_is_retryable_network() {\n        let error = AgentError::Network(\"connection timeout\".to_string());\n        assert!(error.is_retryable());\n        assert!(is_retryable(\u0026error));\n    }\n\n    #[test]\n    fn test_is_retryable_rate_limited() {\n        let error = AgentError::RateLimited(Duration::from_secs(30));\n        assert!(error.is_retryable());\n    }\n\n    #[test]\n    fn test_not_retryable_auth() {\n        let error = AgentError::Auth(\"invalid API key\".to_string());\n        assert!(!error.is_retryable());\n    }\n\n    #[test]\n    fn test_not_retryable_invalid_request() {\n        let error = AgentError::InvalidRequest(\"malformed request\".to_string());\n        assert!(!error.is_retryable());\n    }\n\n    #[test]\n    fn test_not_retryable_context_limit() {\n        let error = AgentError::ContextLimit;\n        assert!(!error.is_retryable());\n        assert!(error.is_context_limit());\n    }\n\n    #[test]\n    fn test_provider_error_conversion() {\n        let provider_err = ProviderError::UnknownProvider(\"test\".to_string());\n        let agent_err: AgentError = provider_err.into();\n        matches!(agent_err, AgentError::Provider(_));\n    }\n\n    // ================================================================\n    // classify_status_code tests\n    // ================================================================\n\n    #[test]\n    fn test_classify_status_429_rate_limit() {\n        let body = r#\"{\"error\": {\"type\": \"rate_limit_error\", \"message\": \"Too many requests\"}}\"#;\n        let result = classify_status_code(StatusCode::TOO_MANY_REQUESTS, body);\n        assert!(matches!(result, AgentError::RateLimited(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_408_timeout() {\n        let body = \"Request timeout\";\n        let result = classify_status_code(StatusCode::REQUEST_TIMEOUT, body);\n        assert!(matches!(result, AgentError::Network(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_500_server_error() {\n        let body = \"Internal server error\";\n        let result = classify_status_code(StatusCode::INTERNAL_SERVER_ERROR, body);\n        assert!(matches!(result, AgentError::Network(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_502_bad_gateway() {\n        let body = \"Bad gateway\";\n        let result = classify_status_code(StatusCode::BAD_GATEWAY, body);\n        assert!(matches!(result, AgentError::Network(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_503_unavailable() {\n        let body = \"Service unavailable\";\n        let result = classify_status_code(StatusCode::SERVICE_UNAVAILABLE, body);\n        assert!(matches!(result, AgentError::Network(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_504_gateway_timeout() {\n        let body = \"Gateway timeout\";\n        let result = classify_status_code(StatusCode::GATEWAY_TIMEOUT, body);\n        assert!(matches!(result, AgentError::Network(_)));\n        assert!(result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_401_unauthorized() {\n        let body = \"Invalid API key\";\n        let result = classify_status_code(StatusCode::UNAUTHORIZED, body);\n        assert!(matches!(result, AgentError::Auth(_)));\n        assert!(!result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_403_forbidden() {\n        let body = \"Access denied\";\n        let result = classify_status_code(StatusCode::FORBIDDEN, body);\n        assert!(matches!(result, AgentError::Auth(_)));\n        assert!(!result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_400_bad_request() {\n        let body = \"Invalid parameter\";\n        let result = classify_status_code(StatusCode::BAD_REQUEST, body);\n        assert!(matches!(result, AgentError::InvalidRequest(_)));\n        assert!(!result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_400_context_limit() {\n        // Anthropic-style context limit error (reported as 400)\n        let body =\n            r#\"{\"error\": {\"type\": \"context_length_exceeded\", \"message\": \"prompt is too long\"}}\"#;\n        let result = classify_status_code(StatusCode::BAD_REQUEST, body);\n        assert!(matches!(result, AgentError::ContextLimit));\n        assert!(result.is_context_limit());\n        assert!(!result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_400_token_limit() {\n        // OpenAI-style token limit error (reported as 400)\n        let body = \"This model's maximum context length is 4096 tokens\";\n        let result = classify_status_code(StatusCode::BAD_REQUEST, body);\n        assert!(matches!(result, AgentError::ContextLimit));\n    }\n\n    #[test]\n    fn test_classify_status_404_not_found() {\n        let body = \"Model not found\";\n        let result = classify_status_code(StatusCode::NOT_FOUND, body);\n        assert!(matches!(result, AgentError::InvalidRequest(_)));\n        assert!(!result.is_retryable());\n    }\n\n    #[test]\n    fn test_classify_status_413_payload_too_large() {\n        let body = \"Request too large\";\n        let result = classify_status_code(StatusCode::PAYLOAD_TOO_LARGE, body);\n        assert!(matches!(result, AgentError::ContextLimit));\n        assert!(!result.is_retryable());\n    }\n\n    // ================================================================\n    // extract_retry_after tests\n    // ================================================================\n\n    #[test]\n    fn test_extract_retry_after_json() {\n        let body = r#\"{\"retry_after\": 30}\"#;\n        let result = extract_retry_after(body);\n        assert_eq!(result, Some(Duration::from_secs(30)));\n    }\n\n    #[test]\n    fn test_extract_retry_after_nested_json() {\n        let body = r#\"{\"error\": {\"retry_after\": 60}}\"#;\n        let result = extract_retry_after(body);\n        // Now correctly handles nested error.retry_after\n        assert_eq!(result, Some(Duration::from_secs(60)));\n    }\n\n    #[test]\n    fn test_extract_retry_after_plain_text() {\n        let body = \"Please retry after 45 seconds\";\n        let result = extract_retry_after(body);\n        assert_eq!(result, Some(Duration::from_secs(45)));\n    }\n\n    #[test]\n    fn test_extract_retry_after_no_match() {\n        let body = \"Rate limit exceeded\";\n        let result = extract_retry_after(body);\n        assert!(result.is_none());\n    }\n\n    // ================================================================\n    // classify_provider_message tests\n    // ================================================================\n\n    #[test]\n    fn test_classify_provider_rate_limit() {\n        let msg = \"Rate limit exceeded. Please try again later.\";\n        let result = classify_provider_message(msg);\n        assert!(matches!(result, Some(AgentError::RateLimited(_))));\n    }\n\n    #[test]\n    fn test_classify_provider_context_limit() {\n        let msg = \"context length exceeded maximum\";\n        let result = classify_provider_message(msg);\n        assert!(matches!(result, Some(AgentError::ContextLimit)));\n    }\n\n    #[test]\n    fn test_classify_provider_auth_error() {\n        let msg = \"Invalid API key provided\";\n        let result = classify_provider_message(msg);\n        assert!(matches!(result, Some(AgentError::Auth(_))));\n    }\n\n    #[test]\n    fn test_classify_provider_unknown() {\n        let msg = \"Some random error message\";\n        let result = classify_provider_message(msg);\n        assert!(result.is_none());\n    }\n\n    // ================================================================\n    // classify_response_message tests (API-specific errors)\n    // ================================================================\n\n    #[test]\n    fn test_classify_anthropic_rate_limit() {\n        let msg = r#\"{\"type\": \"error\", \"error\": {\"type\": \"rate_limit_error\"}}\"#;\n        let result = classify_response_message(msg);\n        assert!(matches!(result, Some(AgentError::RateLimited(_))));\n    }\n\n    #[test]\n    fn test_classify_anthropic_overloaded() {\n        let msg = r#\"{\"type\": \"error\", \"error\": {\"type\": \"overloaded_error\"}}\"#;\n        let result = classify_response_message(msg);\n        assert!(matches!(result, Some(AgentError::RateLimited(_))));\n    }\n\n    #[test]\n    fn test_classify_anthropic_context_exceeded() {\n        let msg = r#\"{\"type\": \"error\", \"error\": {\"type\": \"context_length_exceeded\"}}\"#;\n        let result = classify_response_message(msg);\n        assert!(matches!(result, Some(AgentError::ContextLimit)));\n    }\n\n    #[test]\n    fn test_classify_anthropic_auth_error() {\n        let msg = r#\"{\"type\": \"error\", \"error\": {\"type\": \"authentication_error\"}}\"#;\n        let result = classify_response_message(msg);\n        assert!(matches!(result, Some(AgentError::Auth(_))));\n    }\n\n    // ================================================================\n    // truncate_error_body tests\n    // ================================================================\n\n    #[test]\n    fn test_truncate_short_body() {\n        let body = \"short error\";\n        let result = truncate_error_body(body);\n        assert_eq!(result, \"short error\");\n    }\n\n    #[test]\n    fn test_truncate_long_body() {\n        let body = \"x\".repeat(300);\n        let result = truncate_error_body(\u0026body);\n        assert_eq!(result.chars().count(), 200);\n    }\n\n    #[test]\n    fn test_truncate_multibyte_utf8() {\n        // Test UTF-8 safe truncation with multibyte characters\n        // Each emoji is 4 bytes, Chinese chars are 3 bytes\n        let body = \"错误信息：\".to_string() + \u0026\"🔥\".repeat(100);\n        let result = truncate_error_body(\u0026body);\n        // Should not panic and should be valid UTF-8\n        assert!(result.is_char_boundary(result.len()));\n        assert!(result.chars().count() \u003c= 200);\n    }\n\n    #[test]\n    fn test_truncate_exactly_200_chars() {\n        let body = \"x\".repeat(200);\n        let result = truncate_error_body(\u0026body);\n        assert_eq!(result.len(), 200);\n    }\n\n    // ================================================================\n    // is_timeout_error tests\n    // ================================================================\n\n    #[test]\n    fn test_is_timeout_timeout() {\n        assert!(is_timeout_error(\"connection timeout\"));\n    }\n\n    #[test]\n    fn test_is_timeout_timed_out() {\n        assert!(is_timeout_error(\"request timed out after 30s\"));\n    }\n\n    #[test]\n    fn test_is_timeout_not_timeout() {\n        assert!(!is_timeout_error(\"connection refused\"));\n    }\n}\n","traces":[{"line":37,"address":[],"length":0,"stats":{"Line":27}},{"line":38,"address":[],"length":0,"stats":{"Li to-frontend protocol.\n///\n/// Delivery policy:\n/// - must-deliver events use `send().await`\n/// - best-effort events use `try_send`\n/// - when a best-effort event hits a full bounded queue, the sender coalesces it\n///   into the latest reducer-visible value so adapters can flush it later\n#[derive(Debug, Clone, PartialEq, Eq)]\npub enum FrontendEvent {\n    SessionStarted {\n        provider: String,\n        model: String,\n        working_directory: String,\n        version: String,\n    },\n    UserMessageCommitted {\n        turn_id: u64,\n        text: String,\n    },\n    AssistantMessageDelta {\n        turn_id: u64,\n        delta: String,\n    },\n    AssistantMessageCompleted {\n        turn_id: u64,\n        text: String,\n    },\n    Thinking {\n        turn_id: u64,\n        text: String,\n    },\n    ToolCallStarted {\n        turn_id: u64,\n        call_id: String,\n        name: String,\n        args_preview: String,\n    },\n    ToolCallFinished {\n        turn_id: u64,\n        call_id: String,\n        name: String,\n        result_preview: String,\n        is_error: bool,\n    },\n    RetryScheduled {\n        turn_id: u64,\n        attempt: u32,\n        max_retries: u32,\n        delay_ms: u64,\n        reason: String,\n    },\n    Reminder {\n        turn_id: u64,\n        message: String,\n    },\n    TodoSnapshot {\n        turn_id: u64,\n        items: Vec\u003cFrontendTodoItem\u003e,\n    },\n    TokenUsage {\n        turn_id: u64,\n        input_tokens: u64,\n        output_tokens: u64,\n        total_tokens: u64,\n    },\n    Status {\n        message: String,\n    },\n    Error {\n        turn_id: u64,\n        message: String,\n    },\n    SessionEnded {\n        summary: FrontendSessionSummary,\n    },\n}\n\nimpl FrontendEvent {\n    pub fn delivery_mode(\u0026self) -\u003e DeliveryMode {\n        match self {\n            FrontendEvent::AssistantMessageDelta { .. }\n            | FrontendEvent::Thinking { .. }\n            | FrontendEvent::Status { .. }\n            | FrontendEvent::TokenUsage { .. } =\u003e DeliveryMode::BestEffort,\n            FrontendEvent::SessionStarted { .. }\n            | FrontendEvent::UserMessageCommitted { .. }\n            | FrontendEvent::AssistantMessageCompleted { .. }\n            | FrontendEvent::ToolCallStarted { .. }\n            | FrontendEvent::ToolCallFinished { .. }\n            | FrontendEvent::RetryScheduled { .. }\n            | FrontendEvent::Reminder { .. }\n            | FrontendEvent::TodoSnapshot { .. }\n            | FrontendEvent::Error { .. }\n            | FrontendEvent::SessionEnded { .. } =\u003e DeliveryMode::MustDeliver,\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub enum EmitOutcome {\n    Delivered,\n    Coalesced,\n}\n\n#[derive(Debug, Default)]\nstruct BestEffortBacklog {\n    assistant_delta: Option\u003c(u64, String)\u003e,\n    thinking: Option\u003c(u64, String)\u003e,\n    status: Option\u003cString\u003e,\n    token_usage: Option\u003c(u64, u64, u64, u64)\u003e, // (turn_id, input, output, total)\n}\n\nimpl BestEffortBacklog {\n    fn push(\u0026mut self, event: FrontendEvent) {\n        match event {\n            FrontendEvent::AssistantMessageDelta { turn_id, delta } =\u003e {\n                self.assistant_delta = Some((turn_id, delta));\n            }\n            FrontendEvent::Thinking { turn_id, text } =\u003e {\n                self.thinking = Some((turn_id, text));\n            }\n            FrontendEvent::Status { message } =\u003e {\n                self.status = Some(message);\n            }\n            FrontendEvent::TokenUsage {\n                turn_id,\n                input_tokens,\n                output_tokens,\n                total_tokens,\n            } =\u003e {\n                self.token_usage = Some((turn_id, input_tokens, output_tokens, total_tokens));\n            }\n            _ =\u003e {}\n        }\n    }\n\n    fn pop_next(\u0026mut self) -\u003e Option\u003cFrontendEvent\u003e {\n        if let Some((turn_id, input, output, total)) = self.token_usage.take() {\n            return Some(FrontendEvent::TokenUsage {\n                turn_id,\n                input_tokens: input,\n                output_tokens: output,\n                total_tokens: total,\n            });\n        }\n\n        if let Some((turn_id, delta)) = self.assistant_delta.take() {\n            return Some(FrontendEvent::AssistantMessageDelta { turn_id, delta });\n        }\n\n        if let Some((turn_id, text)) = self.thinking.take() {\n            return Some(FrontendEvent::Thinking { turn_id, text });\n        }\n\n        self.status\n            .take()\n            .map(|message| FrontendEvent::Status { message })\n    }\n}\n\n#[derive(Debug, Clone)]\npub struct FrontendEventSender {\n    tx: mpsc::Sender\u003cFrontendEvent\u003e,\n    backlog: Arc\u003cMutex\u003cBestEffortBacklog\u003e\u003e,\n}\n\nimpl FrontendEventSender {\n    pub fn new(tx: mpsc::Sender\u003cFrontendEvent\u003e) -\u003e Self {\n        Self {\n            tx,\n            backlog: Arc::new(Mutex::new(BestEffortBacklog::default())),\n        }\n    }\n\n    pub async fn emit(\n        \u0026self,\n        event: FrontendEvent,\n    ) -\u003e Result\u003cEmitOutcome, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        match event.delivery_mode() {\n            DeliveryMode::MustDeliver =\u003e {\n                self.tx.send(event).await?;\n                Ok(EmitOutcome::Delivered)\n            }\n            DeliveryMode::BestEffort =\u003e self.try_emit_best_effort(event).await,\n        }\n    }\n\n    async fn try_emit_best_effort(\n        \u0026self,\n        event: FrontendEvent,\n    ) -\u003e Result\u003cEmitOutcome, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        match self.tx.try_send(event) {\n            Ok(()) =\u003e Ok(EmitOutcome::Delivered),\n            Err(mpsc::error::TrySendError::Full(event)) =\u003e {\n                self.backlog.lock().await.push(event);\n                Ok(EmitOutcome::Coalesced)\n            }\n            Err(mpsc::error::TrySendError::Closed(event)) =\u003e Err(mpsc::error::SendError(event)),\n        }\n    }\n\n    pub async fn flush_best_effort(\u0026self) -\u003e Result\u003cusize, mpsc::error::SendError\u003cFrontendEvent\u003e\u003e {\n        let mut flushed = 0;\n\n        loop {\n            let next_event = {\n                let mut backlog = self.backlog.lock().await;\n                backlog.pop_next()\n            };\n\n            let Some(event) = next_event else {\n                break;\n            };\n\n            match self.tx.try_send(event) {\n                Ok(()) =\u003e flushed += 1,\n                Err(mpsc::error::TrySendError::Full(event)) =\u003e {\n                    self.backlog.lock().await.push(event);\n                    break;\n                }\n                Err(mpsc::error::TrySendError::Closed(event)) =\u003e {\n                    return Err(mpsc::error::SendError(event));\n                }\n            }\n        }\n\n        Ok(flushed)\n    }\n}\n\n/// Commands are always sent with `send().await` so adapters backpressure user input\n/// instead of dropping it.\npub async fn send_frontend_command(\n    tx: \u0026FrontendCommandSender,\n    command: FrontendCommand,\n) -\u003e Result\u003c(), mpsc::error::SendError\u003cFrontendCommand\u003e\u003e {\n    tx.send(command).await\n}\n\npub fn frontend_command_channel(\n    capacity: usize,\n) -\u003e (FrontendCommandSender, FrontendCommandReceiver) {\n    mpsc::channel(capacity)\n}\n\npub fn frontend_event_channel(capacity: usize) -\u003e (FrontendEventSender, FrontendEventReceiver) {\n    let (tx, rx) = mpsc::channel(capacity);\n    (FrontendEventSender::new(tx), rx)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tokio::time::{timeout, Duration};\n\n    #[test]\n    fn command_and_event_types_are_constructible() {\n        let command = FrontendCommand::Interrupt;\n        assert!(matches!(command, FrontendCommand::Interrupt));\n\n        let started = FrontendEvent::ToolCallStarted {\n            turn_id: 7,\n            call_id: \"tool-1\".to_string(),\n            name: \"read\".to_string(),\n            args_preview: \"README.md\".to_string(),\n        };\n        assert!(matches!(started, FrontendEvent::ToolCallStarted { .. }));\n\n        let finished = FrontendEvent::ToolCallFinished {\n            turn_id: 7,\n            call_id: \"tool-1\".to_string(),\n            name: \"read\".to_string(),\n            result_preview: \"done\".to_string(),\n            is_error: false,\n        };\n        assert!(matches!(finished, FrontendEvent::ToolCallFinished { .. }));\n\n        let snapshot = FrontendEvent::TodoSnapshot {\n            turn_id: SESSION_START_TURN_ID,\n            items: vec![FrontendTodoItem {\n                id: 1,\n                text: \"Ship protocol\".to_string(),\n                status: FrontendTodoStatus::InProgress,\n            }],\n        };\n        assert!(matches!(snapshot, FrontendEvent::TodoSnapshot { .. }));\n    }\n\n    #[test]\n    fn protocol_module_is_cli_framework_agnostic() {\n        let source = include_str!(\"protocol.rs\");\n        let production_source = source.split(\"#[cfg(test)]\").next().unwrap_or(source);\n        let forbidden_terms = [\n            [\"rata\", \"tui\"].concat(),\n            [\"reed\", \"line\"].concat(),\n            [\"std\", \"out\"].concat(),\n            [\"std\", \"err\"].concat(),\n            \"crossterm\".to_string(),\n        ];\n\n        for forbidden in forbidden_terms {\n            assert!(!production_source.contains(\u0026forbidden));\n        }\n    }\n\n    #[test]\n    fn todo_snapshot_is_must_deliver() {\n        assert_eq!(\n            FrontendEvent::TodoSnapshot {\n                turn_id: SESSION_START_TURN_ID,\n                items: Vec::new(),\n            }\n            .delivery_mode(),\n            DeliveryMode::MustDeliver\n        );\n    }\n\n    #[tokio::test]\n    async fn best_effort_events_do_not_block_when_channel_is_full() {\n        let (sender, mut receiver) = frontend_event_channel(1);\n\n        sender\n            .emit(FrontendEvent::SessionStarted {\n                provider: \"anthropic\".to_string(),\n                model: \"claude\".to_string(),\n                working_directory: \"/test\".to_string(),\n                version: \"0.1.0\".to_string(),\n            })\n            .await\n            .expect(\"must-deliver event should fit\");\n\n        let result = timeout(\n            Duration::from_millis(50),\n            sender.emit(FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"busy\".to_string(),\n            }),\n        )\n        .await;\n\n        let outcome = result.expect(\"best-effort emit should not block\");\n        assert_eq!(outcome.expect(\"channel open\"), EmitOutcome::Coalesced);\n\n        let first = receiver.recv().await.expect(\"first event should be queued\");\n        assert!(matches!(first, FrontendEvent::SessionStarted { .. }));\n\n        let flushed = sender\n            .flush_best_effort()\n            .await\n            .expect(\"flush should succeed\");\n        assert_eq!(flushed, 1);\n\n        let second = receiver.recv().await.expect(\"coalesced event should flush\");\n        assert_eq!(\n            second,\n            FrontendEvent::AssistantMessageDelta {\n                turn_id: 5,\n                delta: \"busy\".to_string(),\n            }\n        );\n    }\n}\n","traces":[{"line":134,"address":[],"length":0,"stats":{"Line":56}},{"line":135,"address":[],"length":0,"stats":{"Line":56}},{"line":139,"address":[],"length":0,"stats":{"Line":8}},{"line":149,"address":[],"length":0,"stats":{"Line":48}},{"line":169,"address":[],"length":0,"stats":{"Line":2}},{"line":170,"address":[],"length":0,"stats":{"Line":2}},{"line":171,"address":[],"length":0,"stats":{"L
